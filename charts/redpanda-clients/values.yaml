## @section Cluster

## @param cluster.name Name of the Redpanda cluster resource the User and Topic resources point at (`clusterRef`)
## @param cluster.reservedUsers Usernames this chart must never manage: the cluster's superusers and the quota job's user. A client id matching one fails the render
cluster:
  name: redpanda
  reservedUsers: []

## @param environment Environment this release serves, e.g. `dev` or `prod`. Only clients that list it under `environments` are rendered
environment: ""

## @section Client passwords
## Each client's password is read from Vault through External Secrets into the secret `redpanda-client-<id>` (key `password`)

## @param passwords.secretStore ClusterSecretStore that reads the passwords
## @param passwords.vaultKey Key holding every client's password for this environment, as property `client_<id>_pw`
passwords:
  secretStore: vault-backend-devops
  vaultKey: ""

## @section Ingress
## The chart exposes the external Kafka listener through the dedicated Istio ingress gateway: a LoadBalancer Service
## that only accepts whitelisted addresses, and an AuthorizationPolicy on the gateway that allows only the same addresses.
## Neither renders while the whitelist is empty.

## @param ingress.namespace Namespace of the ingress gateway's pods
## @param ingress.selector Labels that select the ingress gateway's pods
## @param ingress.port Port of the external Kafka listener on the gateway
ingress:
  namespace: istio-system
  selector:
    istio: client-messaging
  port: 9094

## @param whitelist Addresses allowed to reach the external listener, grouped under a name for whoever owns them. Each address is an IPv4 address or CIDR range; a bare address means /32. The same list applies in every environment
##
## whitelist:
##   - name: Saia
##     ips:
##       - 20.51.224.101
##       - 74.235.92.224/28
whitelist: []

## @section Topic defaults
## Used for any topic that doesn't set its own value

## @param topicDefaults.partitions Partition count
## @param topicDefaults.replicationFactor Replication factor
## @param topicDefaults.retentionMs Retention in milliseconds (7 days)
topicDefaults:
  partitions: 3
  replicationFactor: 3
  retentionMs: 604800000

## @section Quota job
## Sets or clears each client's quota with rpk after each install or upgrade. The operator has no quota resource.
## Renders whenever there is at least one client.

## @param quotaJob.image Image that provides rpk
## @param quotaJob.brokers Kafka API address of the cluster, reachable from the job
## @param quotaJob.credentialsSecret Secret with the SCRAM-SHA-512 credentials (keys `username`, `password`) of a user whose only ACL is ALTER_CONFIGS on the cluster
## @param quotaJob.caSecret Secret with the CA that signed the brokers' certificate (key `ca.crt`)
## @param quotaJob.resources Resource requests and limits for the job container
## @param quotaJob.podLabels Extra labels on the job's pod, e.g. `sidecar.istio.io/inject: "true"` where Job pods are only meshed on request
quotaJob:
  image: docker.redpanda.com/redpandadata/redpanda:v26.2.2@sha256:468bd13a9f2bd24794cb7fddc867c767fb1008b9a07b297b89fde48c564d7d96
  brokers: redpanda.redpanda.svc.cluster.local:9093
  credentialsSecret: redpanda-quota-manager
  caSecret: redpanda-default-cert
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  podLabels: {}

## @section Clients

## @param clients List of clients. Each client gets a SCRAM-SHA-512 user limited to resources prefixed `<id>.`, its topics, a quota on that user and an ExternalSecret for its password
## Only clients whose `environments` include `environment` are rendered.
## Each client's password is read from Vault (`passwords.vaultKey`, property `client_<id>_pw`); write it there before
## adding the environment to the client, and never commit it.
##
## clients:
##   - id: alpha                    # a lowercase letter, then lowercase letters and digits
##     environments: [dev, prod]    # required; the client exists only in these environments
##     transactions: false          # true adds Write/Describe on transactional IDs prefixed "alpha."
##     quota:                       # optional, positive bytes per second on user "alpha". A rate left out is unlimited
##       producerByteRate: 5242880
##       consumerByteRate: 10485760
##     topics:
##       - name: shipments          # lowercase letters, digits and dashes; created as "alpha.shipments"
##         partitions: 6            # optional, defaults to topicDefaults.partitions
##         retentionMs: 1209600000  # optional, defaults to topicDefaults.retentionMs
clients: []
