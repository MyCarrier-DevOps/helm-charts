{{- include "redpanda-clients.validate" . -}}
{{- range $c := .Values.clients }}
{{- $prefix := printf "%s." $c.id | quote }}
---
apiVersion: cluster.redpanda.com/v1alpha2
kind: User
metadata:
  name: {{ $c.id | quote }}
  labels:
    {{- include "redpanda-clients.labels" $ | nindent 4 }}
spec:
  cluster:
    clusterRef:
      name: {{ $.Values.cluster.name }}
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: redpanda-client-{{ $c.id }}
          key: password
  authorization:
    acls:
      - type: allow
        resource:
          type: topic
          name: {{ $prefix }}
          patternType: prefixed
        operations: [Read, Write, Describe]
      - type: allow
        resource:
          type: group
          name: {{ $prefix }}
          patternType: prefixed
        operations: [Read, Describe]
      {{- if $c.transactions }}
      - type: allow
        resource:
          type: transactionalId
          name: {{ $prefix }}
          patternType: prefixed
        operations: [Write, Describe]
      {{- end }}
{{- end }}
