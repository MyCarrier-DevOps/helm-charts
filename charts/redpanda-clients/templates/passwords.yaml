{{- $clients := include "redpanda-clients.clients" . | fromJsonArray -}}
{{- if and $clients (not .Values.passwords.vaultKey) -}}
  {{- fail "passwords.vaultKey must be set: it holds each client's password as property client_<id>_pw" -}}
{{- end -}}
{{- range $c := $clients }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redpanda-client-{{ $c.id }}-es
  labels:
    {{- include "redpanda-clients.labels" $ | nindent 4 }}
  annotations:
    # The client's User reads this secret, so it must exist first
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.passwords.secretStore }}
  # Every field External Secrets would default is set, so Argo CD sees no drift
  target:
    name: redpanda-client-{{ $c.id }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: {{ $.Values.passwords.vaultKey }}
        property: client_{{ $c.id }}_pw
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
