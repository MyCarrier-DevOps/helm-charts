suite: client users
templates:
  - templates/users.yaml
values:
  - ./values/two-clients.yaml
tests:
  - it: renders one SCRAM-SHA-512 user per client
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: User
      - equal:
          path: spec.authentication.type
          value: scram-sha-512
      - equal:
          path: spec.cluster.clusterRef.name
          value: redpanda

  - it: reads each client's password from its own secret
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: alpha
      - equal:
          path: spec.authentication.password.valueFrom.secretKeyRef.name
          value: redpanda-client-alpha
      - equal:
          path: spec.authentication.password.valueFrom.secretKeyRef.key
          value: password

  - it: scopes topic and group ACLs to the client prefix including the trailing dot
    documentIndex: 0
    asserts:
      - contains:
          path: spec.authorization.acls
          content:
            type: allow
            resource:
              type: topic
              name: alpha.
              patternType: prefixed
            operations: [Read, Write, Describe]
      - contains:
          path: spec.authorization.acls
          content:
            type: allow
            resource:
              type: group
              name: alpha.
              patternType: prefixed
            operations: [Read, Describe]
      - lengthEqual:
          path: spec.authorization.acls
          count: 2

  - it: adds the transactionalId ACL only for clients that use transactions
    documentIndex: 1
    asserts:
      - contains:
          path: spec.authorization.acls
          content:
            type: allow
            resource:
              type: transactionalId
              name: bravo.
              patternType: prefixed
            operations: [Write, Describe]
      - lengthEqual:
          path: spec.authorization.acls
          count: 3

  - it: carries the standard chart labels
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: redpanda-clients
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - exists:
          path: metadata.labels["app.kubernetes.io/instance"]
      - exists:
          path: metadata.labels["helm.sh/chart"]
