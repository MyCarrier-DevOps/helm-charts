suite: client validation
templates:
  - templates/users.yaml
tests:
  - it: rejects a client id containing a dot
    set:
      clients:
        - id: al.pha
    asserts:
      - failedTemplate:
          errorPattern: "invalid client id \"al.pha\""

  - it: rejects an uppercase client id
    set:
      clients:
        - id: Alpha
    asserts:
      - failedTemplate:
          errorPattern: "invalid client id \"Alpha\""

  - it: rejects a missing client id
    set:
      clients:
        - topics: []
    asserts:
      - failedTemplate:
          errorPattern: "invalid client id"

  - it: rejects duplicate client ids
    set:
      clients:
        - id: alpha
        - id: alpha
    asserts:
      - failedTemplate:
          errorPattern: "duplicate client id \"alpha\""

  - it: rejects a topic name with characters outside lowercase, digits and dashes
    set:
      clients:
        - id: alpha
          topics:
            - name: ship_ments
    asserts:
      - failedTemplate:
          errorPattern: "invalid topic name \"ship_ments\" for client \"alpha\""

  - it: rejects a client id that doesn't start with a letter
    set:
      clients:
        - id: "123"
    asserts:
      - failedTemplate:
          errorPattern: "invalid client id \"123\""

  - it: rejects a client id that isn't a string
    set:
      clients:
        - id: true
    asserts:
      - failedTemplate:
          errorPattern: "invalid client id \"true\""

  - it: rejects a topic listed twice for the same client
    set:
      clients:
        - id: alpha
          topics:
            - name: shipments
            - name: shipments
              partitions: 12
    asserts:
      - failedTemplate:
          errorPattern: "duplicate topic name \"shipments\" for client \"alpha\""
