suite: client passwords
templates:
  - templates/passwords.yaml
values:
  - ./values/two-clients.yaml
tests:
  - it: renders one ExternalSecret per client, producing the secret its User reads
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.target.name
          value: redpanda-client-alpha
        documentIndex: 0
      - equal:
          path: metadata.name
          value: redpanda-client-alpha-es
        documentIndex: 0

  - it: reads the password from the client's own property under the environment's key
    documentIndex: 1
    asserts:
      - equal:
          path: spec.data
          value:
            - secretKey: password
              remoteRef:
                key: redpanda/client_messaging/dev
                property: client_bravo_pw
                conversionStrategy: Default
                decodingStrategy: None
                metadataPolicy: None

  - it: reads through the configured ClusterSecretStore
    documentIndex: 0
    asserts:
      - equal:
          path: spec.secretStoreRef
          value:
            kind: ClusterSecretStore
            name: vault-backend-devops

  - it: owns the secret, and spells out the fields External Secrets would otherwise default, so Argo CD sees no drift
    documentIndex: 0
    asserts:
      - equal:
          path: spec.target
          value:
            name: redpanda-client-alpha
            creationPolicy: Owner
            deletionPolicy: Retain
      - equal:
          path: spec.refreshInterval
          value: 1h0m0s

  - it: syncs before the users that read the secrets
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"

  - it: renders no password for a client not yet in this environment
    set:
      environment: prod
    asserts:
      - hasDocuments:
          count: 0

  - it: fails without a key to read the passwords from
    set:
      passwords.vaultKey: ""
    asserts:
      - failedTemplate:
          errorPattern: "passwords.vaultKey must be set"
