suite: client topics
templates:
  - templates/topics.yaml
values:
  - ./values/two-clients.yaml
tests:
  - it: renders one topic per client topic
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: Topic

  - it: prefixes the Redpanda topic name with the client id and applies overrides
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: alpha-shipments
      - equal:
          path: spec.overwriteTopicName
          value: alpha.shipments
      - equal:
          path: spec.partitions
          value: 6
      - equal:
          path: spec.replicationFactor
          value: 3
      - equal:
          path: spec.additionalConfig["retention.ms"]
          value: "1209600000"

  - it: falls back to topic defaults
    documentIndex: 1
    asserts:
      - equal:
          path: spec.overwriteTopicName
          value: alpha.quotes
      - equal:
          path: spec.partitions
          value: 3
      - equal:
          path: spec.additionalConfig["retention.ms"]
          value: "604800000"

  - it: keeps topics and their data when a client is removed from values
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: keeps topics when Argo CD syncs and a client is removed from values
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Prune=false

  - it: carries the standard chart labels
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: redpanda-clients
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
