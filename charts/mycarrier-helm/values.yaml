# Default values for mycarrier Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

## @section Global Settings
## Global settings used across all applications

## @param global.appStack Application stack name, used for naming resources and grouping applications
## @param global.gitbranch Name of the git branch (used for feature branches)
## @param global.branchlabel Label for the branch, used for reference label
## @param global.language Default programming language for applications (can be overridden at application level)
## @param global.v2migration Flag to indicate if we are migrating to v2 (enables certain ArgoCD sync options)
## @param global.commitDeployed Label for the deployed commit (used for tracking deployments)
## @param global.correlationId Correlation ID for tracking deployments across systems
## @param global.argoEventsInstance Argo Events namespace the render pipeline runs in (argo-events|argo-events-test); selects TestEngine deployment
## @param global.env [object] Global environment variables shared across all applications
## @extra global.dependencies Dependency flags to control infrastructure resources
## @param global.dependencies.mongodb Enable MongoDB dependency
## @param global.dependencies.elasticsearch Enable Elasticsearch dependency
## @param global.dependencies.redis Enable Redis dependency
## @param global.dependencies.postgres Enable PostgreSQL dependency
## @param global.dependencies.sqlserver Enable SQL Server dependency
## @param global.dependencies.clickhouse Enable ClickHouse dependency
## @param global.dependencies.azureservicebus Enable Azure Service Bus dependency
## @param global.dependencies.redpanda Enable Redpanda dependency
## @param global.dependencies.loadsure Enable Loadsure dependency
## @param global.dependencies.chargify Enable Chargify dependency
global:
  appStack: "app" # Application stack name (e.g., "app", "billing", "users" - used for naming resources and grouping applications)
  gitbranch: "" # Git branch name (e.g., "main" or "feature/xyz")
  branchlabel: "" # Used for reference label (e.g., "main" or "feature-xyz")
  language: "csharp" # Default language (csharp, java, nodejs, python, go, etc.) - can be overridden at application level
  v2migration: false # Set to true to enable ArgoCD sync options for v2 migration (e.g., skip schema validation, ignore certain fields)
  commitDeployed: "" # Optional: Git commit hash or identifier for the deployed code (used for tracking deployments)
  correlationId: "" # Optional: Correlation ID for tracking deployments across systems
  argoEventsInstance: "argo-events" # Argo Events namespace the render pipeline runs in (argo-events|argo-events-test). Selects which TestEngine deployment receives test trigger payloads. Set by render-deploy-core.yaml from K8S_NAMESPACE.
  env: {}
  dependencies:
    mongodb: false
    elasticsearch: false
    redis: false
    postgres: false
    sqlserver: false
    clickhouse: false
    azureservicebus: false
    redpanda: false
    loadsure: false
    chargify: false

## @section Environment Settings
## Environment-specific settings

## @param environment.name Environment name / namespace (DNS-1123 label). Standard names (dev, preprod, prod, qa, uat, feature-*) have built-in behavior; any other name (e.g. demo) is allowed and treated as a generic environment — configure it explicitly via global.env / application.env / secrets (the same way qa/uat are configured).
## @param environment.namespaceOverride Override the Kubernetes namespace (defaults to environment.name if not set)
## @param environment.dependencyenv Environment name for dependencies
## @extra environment.domainOverride Domain override configuration
## @param environment.domainOverride.enabled Whether to override the default domain (default domains: mycarrier.dev for non-prod, mycarriertms.com for prod)
## @param environment.domainOverride.domain Domain to use when override is enabled
environment:
  name: "dev"
  namespaceOverride: ""
  dependencyenv: "dev"
  domainOverride:
    enabled: false
    domain: "example.com"

## @section Platform Settings
## Platform-wide settings

## @param enableVaultCA Enable Vault CA certificate download during pod startup (no-op: its postStart hook was removed in DEVOPS-176; flag retained for values compatibility)
## @param disableSecurity BREAK-GLASS ONLY (discouraged): when true, every pod in the release renders without runAsNonRoot/securityContext hardening
## @param manualOtelConfig Take over OpenTelemetry configuration from the chart (default false = chart-managed)
## @param disableOtelAutoinstrumentation Disable OpenTelemetry Operator auto-instrumentation only (set to false to enable)
## @param tolerations [array] Default tolerations for all applications
## @param deployment Deployment folder name (should match the subfolder containing the specific deployment)
enableVaultCA: false

## BREAK-GLASS ONLY — leave false. When true, EVERY pod in the release (all workloads) ships
## WITHOUT runAsNonRoot/securityContext hardening; this cannot be scoped per-application.
## Admission backstop: Kyverno require-run-as-non-root is Enforce ONLY on development —
## production-csp/data run Audit, so setting this there removes the chart's non-root guarantee
## with report-only admission and no backstop (containers run as whatever the image USER
## specifies). This is the only flag that removes the hardening block (though not the only
## route to an un-hardened container — see applications.<name>.enableDebugMode's privileged
## sidecar); setting it is discouraged and must be temporary.
## Not settable through mc-environment `environments[]` (its schema rejects the key and
## appset.yaml does not forward it) — only directly-managed mycarrier-helm value files. Intentional.
disableSecurity: false

## The two OTel keys below have DELIBERATELY OPPOSITE defaults. They are not interchangeable and do
## not track each other:
##
##   manualOtelConfig               default false -> chart manages OTel config   (explicit opt-OUT)
##   disableOtelAutoinstrumentation default true  -> operator injection is off   (explicit opt-IN)
##
## For both keys an unset/null value means the documented default above, and an explicit `false`
## genuinely means false.
##
## manualOtelConfig: true means "I configure OpenTelemetry myself". The chart then injects nothing
## OTel-related anywhere: no OTEL_* env vars (generic or language-specific), no operator
## auto-instrumentation annotations, and no otel-log volume or mount. It overrides
## disableOtelAutoinstrumentation, since a workload the chart does not configure must not receive
## operator injection either. Supply your own OTEL_* values via global.env / application.env
## (or jobs[].env / cronjobs[].env, which are resolved independently per workload).
manualOtelConfig: false

## disableOtelAutoinstrumentation controls ONLY the OpenTelemetry Operator's automatic
## instrumentation feature -- the instrumentation.opentelemetry.io / sidecar.opentelemetry.io pod
## annotations and the nodejs NODE_OPTIONS --require hook. It does not affect the standard OTEL_*
## env block, which is governed by manualOtelConfig above.
disableOtelAutoinstrumentation: true
tolerations: []
deployment: deployment

## @section Applications
## Configuration for application deployments
##
## Each application is defined as a key-value pair where the key is the application name.
## See the comprehensive example configuration below for all available options.
##
## **Basic Settings**: enableDebugMode, isFrontend, language, forceOffload, staticHostname, deploymentType, version, replicas
## **Container**: image.registry, image.repository, image.tag, pullPolicy, pullSecret
## **Resources**: resources.requests.cpu/memory, resources.limits.cpu/memory
## **Health Probes**: probes.enableLiveness, probes.enableReadiness, probes.enableStartup (all default true; set to false to disable), custom probe configurations
## **Security Context**: securityContext.readOnlyRootFilesystem (default false), securityContext.addCapabilities (default []; all capabilities are dropped by default, list specific capabilities here to add them back), securityContext.fsGroup (opt-in pod-level fsGroup; previously ignored/silently dropped, now honored; must be >= 1 — fsGroup 0 is the root group and is rejected by the values schema; the >= 1 bound is ORG POLICY enforced by MyCarrier-DevOps/kyverno-policies `require-non-root-groups` rule `check-fsGroup` ("must be empty or greater than zero"), not an upstream Pod Security Standards control — the PSS spec contains zero occurrences of fsGroup/runAsGroup/supplementalGroups; those were PodSecurityPolicy fields, and PSP is retired), securityContext.seccompProfile (opt-in pod-level seccompProfile; previously ignored/silently dropped, now honored)
## **Service**: service.type, service.ports, service.annotations, service.timeout, service.retryOn
## **Networking**: networking.ingress.type, networking.istio.enabled/hosts/routes/corsPolicy/allowedEndpoints
## **Autoscaling**: HPA (autoscaling.minReplicas/maxReplicas/targetCPU/targetMemory), VPA (vpa.enabled/updateMode/resources)
## **Monitoring**: serviceMonitor.enabled/path/interval/scheme
## **Testing**: testtrigger configuration for automated test jobs
##
## **Annotations — reserved keys (application pod template)**: `applications[].annotations` render
## onto the pod template for Deployment / StatefulSet / Rollout applications. Chart-managed
## annotations always win: a user-supplied key that collides with a chart-managed key is DROPPED
## from `annotations` before rendering — it does not override the chart's value and does not render
## twice. The reserved set is an EXACT-KEY match (`hasKey`), not a `vault.security.banzaicloud.io/*`
## prefix match:
##   - vault keys: `vault-addr`, `vault-auth-method`, `vault-path`, `vault-role`,
##     `vault-agent-env-variables`, `mutate-probes`, `run-as-non-root`, `run-as-user`,
##     `run-as-group`, plus `vault-env-daemon` (only when `secrets` is set) and
##     `vault-env-from-path` (only when `secrets.bulk.path` is set)
##   - otel keys: `sidecar.opentelemetry.io/inject`, `instrumentation.opentelemetry.io/container-names`,
##     and `instrumentation.opentelemetry.io/inject-<language>` for the ONE resolved language only.
##     Rendered only when `manualOtelConfig` is not true AND `disableOtelAutoinstrumentation: false`
##     AND the language is nodejs/java/python (verified call chain: `helm.otel.annotations` ->
##     `helm.otel.autoinstrumentation.enabled` -> `helm.otel.chartManaged` -> `manualOtelConfig`)
##   - istio keys: `sidecar.istio.io/inject`, `proxy.istio.io/config`
##   - gateway key: `mycarrier.io/gateway`
##
## Any key NOT in this reserved set is applied to the pod as-is — including other
## `vault.security.banzaicloud.io/*` keys the chart does not set. Security-relevant keys verified to
## pass through unmanaged: `vault-skip-verify` (disables TLS verification to Vault), `mutate: skip`
## (disables secret injection entirely), `vault-namespace`, `vault-serviceaccount`.
## `psp-allow-privilege-escalation` also renders through but is not documented in the current
## bank-vaults reference.
##
## **Istio override is CLOSED on application surfaces**: `sidecar.istio.io/inject`,
## `proxy.istio.io/config` and `mycarrier.io/gateway` set in `applications[].annotations` are DROPPED
## — the chart's own computed values always win. The supported per-workload knobs are
## `applications[].istioDisabled`, `applications[].networking.istio.enabled`, and
## `applications[].service.istioDisabled`. This closure does NOT apply to `cronjobs[]`/`jobs[]` — see
## the Kubernetes Jobs / CronJobs sections below.

## @param applications [object] Map of application definitions where the key is the application name

applications: {}

# ============================================================================
# EXAMPLE APPLICATION CONFIGURATION
# ============================================================================
# Below is a comprehensive example showing all available configuration options.
# Uncomment and customize as needed for your applications.
# ============================================================================
#
# example-api:
#   # ----------------------------------------------------------------------------
#   # Basic Application Settings
#   # ----------------------------------------------------------------------------
#   enableDebugMode: false
#   isFrontend: false
#   forceOffload: false
#   deploymentType: "deployment"  # Options: deployment, statefulset, rollout
#   migratingToRollouts: false
#   version: "1.0.0"
#   replicas: 1
#   
#   # Optional: Static hostname for the application
#   # staticHostname: "api.example.com"
#   
#   # ----------------------------------------------------------------------------
#   # Custom Labels and Annotations
#   # ----------------------------------------------------------------------------
#   labels:
#     app.kubernetes.io/component: "api"
#   
#   annotations:
#     app.mycarrier.tech/team: "platform"
#   
#   # ----------------------------------------------------------------------------
#   # Container Image Configuration
#   # ----------------------------------------------------------------------------
#   image:
#     registry: "myregistry.example.com"
#     repository: "mycarrier/example-api"
#     tag: "1.0.0"
#   
#   pullPolicy: "IfNotPresent"  # Options: IfNotPresent, Always, Never
#   pullSecret: "imagepull"
#   
#   # ----------------------------------------------------------------------------
#   # Environment Variables
#   # ----------------------------------------------------------------------------
#   env:
#     NODE_ENV: "development"
#     LOG_LEVEL: "info"
#     # Example of valueFrom usage:
#     # DB_PASSWORD:
#     #   valueFrom:
#     #     secretKeyRef:
#     #       name: db-secrets
#     #       key: password
#   
#   # ----------------------------------------------------------------------------
#   # Port Configuration
#   # ----------------------------------------------------------------------------
#   ports:
#     http: 8080
#     metrics: 9090
#   
#   # ----------------------------------------------------------------------------
#   # Resource Configuration
#   # ----------------------------------------------------------------------------
#   resources:
#     requests:
#       cpu: "50m"
#       memory: "128Mi"
#     limits:
#       cpu: "500m"
#       memory: "512Mi"
#   
#   securityContext:
#     readOnlyRootFilesystem: false
#     # All capabilities are dropped by default (drop: [ALL]). List specific
#     # capabilities here to add them back for this application only:
#     # addCapabilities:
#     #   - NET_BIND_SERVICE
#
#   # ----------------------------------------------------------------------------
#   # Health Probes (all default true; set to false to disable)
#   # ----------------------------------------------------------------------------
#   probes:
#     enableLiveness: true
#     enableReadiness: true
#     enableStartup: false
#     # Custom probe configuration:
#     # livenessProbe:
#     #   httpGet:
#     #     path: /health/live
#     #     port: http
#     #   initialDelaySeconds: 30
#     #   periodSeconds: 15
#     # readinessProbe:
#     #   httpGet:
#     #     path: /health/ready
#     #     port: http
#     #   initialDelaySeconds: 10
#     #   periodSeconds: 7
#   
#   # ----------------------------------------------------------------------------
#   # Service Configuration
#   # ----------------------------------------------------------------------------
#   service:
#     type: "ClusterIP"  # Options: ClusterIP, NodePort, LoadBalancer
#     headless: false
#     istioDisabled: false
#     
#     # Port definitions (if not provided, uses 'ports' field above)
#     ports:
#       - name: http
#         port: 80
#         targetPort: 8080
#         protocol: TCP
#       - name: metrics
#         port: 9090
#         targetPort: 9090
#     
#     annotations:
#       prometheus.io/scrape: "true"
#       prometheus.io/port: "9090"
#     
#     # Timeout and retry settings
#     timeout: "151s"
#     retryOn: "5xx,reset"
#     attempts: 3
#     perTryTimeout: "50s"
#   
#   # ----------------------------------------------------------------------------
#   # Networking and Ingress
#   # ----------------------------------------------------------------------------
#   networking:
#     ingress:
#       type: "istio"
#     
#     istio:
#       enabled: true
#       internalEnabled: true  # Enable internal ServiceEntry, WasmPlugin, and VirtualService internal host (default: true)
#       offloadVSEnabled: true  # Enable the offload VirtualService for feature environments (default: true)
#       cloudflareProxied: true  # Enable Cloudflare proxy for VirtualService DNS records (external-dns annotation, default: true)
#       # Whitelabel hosts can use the helm.whitelabelHost helper to derive the domain:
#       #   hosts:
#       #     - '{{ include "helm.whitelabelHost" (dict "label" "estes" "ctx" $) }}'
#       # Renders estes.<domain> in prod/preprod/dev and estes.<env>.<domain> elsewhere.
#       hosts: []
#       gateway: istio-system/default  # Ingress gateway (namespace/name) bound in addition to mesh, which is always included (default: istio-system/default)
#       redirects: {}
#       routes: {}  # Custom routes; destination defaults to the app's service. Override with 'destination' field per route.
#       # routes:
#       #   my-route:
#       #     match:
#       #       - uri:
#       #           prefix: /ui/portal
#       #   external-route:
#       #     destination: "other-service.namespace.svc.cluster.local"  # optional override
#       #     port: 9090  # optional port override (defaults to ports.http or 8080)
#       #     match:
#       #       - uri:
#       #           prefix: /api/external
#       responseHeaders: {}
#       corsPolicy: {}
#       
#       # Allowed endpoints (C# apps auto-add /liveness, /health, /api if name contains 'api')
#       allowedEndpoints: []
#       # allowedEndpoints:
#       #   - "/custom-endpoint"
#       #   - "/api/v1/*"
#       # disableDefaultEndpoints: false  # Set true to disable auto C# endpoints
#
#     # ------------------------------------------------------------------------
#     # KrakenD AutoConfig
#     # ------------------------------------------------------------------------
#     # Opt the application into generating a `gateway.krakend.io/v1alpha1`
#     # KrakenDAutoConfig CR. The operator uses the CR to generate KrakenD
#     # endpoints from the referenced OpenAPI spec.
#     #
#     # Requirements (enforced at template time):
#     #   - environment.name is NOT a feature environment (rendering fails)
#     #   - networking.istio.enabled is true (rendering fails otherwise)
#     #   - networking.istio.internalEnabled is true (rendering fails otherwise)
#     #   - istioDisabled is not true (rendering fails otherwise)
#     #   - service.istioDisabled is not true (rendering fails otherwise)
#     # See `helm.krakend.enabled` for the exact gating logic.
#     #
#     # Development workflow: feature environments are intentionally excluded
#     # from KrakenDAutoConfig rendering. New public API endpoints must be
#     # developed and released directly to dev rather than validated via a
#     # feature environment, because each KrakenDAutoConfig registers
#     # endpoints on the shared KrakenDGateway and per-feature-env variants
#     # would collide on the same gateway.
#     #
#     # Guarantees:
#     #   - spec.openapi.url is always http://<app>.<metaEnv>.internal/<path>
#     #   - spec.urlTransform.hostMapping is only emitted when the user
#     #     configures extraHostMapping; auto-generated catch-all entries
#     #     are intentionally not produced.
#     krakend:
#       enabled: false
#       # name: custom-kac-name            # optional; defaults to <fullName>-autoconfig
#       # autoConfigNamespace: krakend     # optional; defaults to gatewayRef.namespace → global.krakendGatewayNamespace → app namespace
#       # labels: {}                       # extra labels for the KAC metadata
#       # annotations: {}                  # extra annotations for the KAC metadata
#       gatewayRef:
#         name: mycarrier-public-api      # required: KrakenDGateway metadata.name
#         # namespace: krakend            # optional; falls back to global.krakendGatewayNamespace or app namespace
#       trigger: OnChange                 # OnChange (default) or Periodic
#       # periodic:
#       #   interval: 5m                  # required when trigger=Periodic
#       openapi:
#         path: /swagger/v1/swagger.json  # optional; default /swagger/v1/swagger.json
#         # format: json                  # optional: json | yaml (auto-detected if omitted)
#         # allowClusterLocal: true       # default true
#         # auth:                         # optional authentication for the spec fetch
#         #   bearerTokenSecret:
#         #     name: my-secret
#         #     key: token
#       urlTransform:
#         stripPathPrefix: /api/v1        # optional
#         addPathPrefix: /api/v1/routing  # optional
#         # extraHostMapping:             # optional; additional mappings appended after the auto-generated ones.
#         #   - from: "http://some-other-host"
#         #     to:   "http://<app>.dev.internal"   # host MUST end in .internal or .svc.cluster.local
#       defaults:                         # optional; matches KrakenDAutoConfigSpec.Defaults
#         endpoint:
#           timeout: 30s
#           inputHeaders:
#             - Authorization
#             - Content-Type
#         # backend:
#         #   encoding: json
#         # policyRef:
#         #   name: default-policy
#       overrides: []                     # optional; list of OperationOverride
#       # overrides:
#       #   - operationId: GetFoo
#       #     endpoint: /foo
#       #     timeout: 10s
#       filter: {}                        # optional; include/exclude paths/methods/tags/operationIds
#       # filter:
#       #   includePaths: ["/api/v1/*"]
#       #   excludeOperationIds: ["debug-only"]
#       cue: {}                           # optional; custom CUE definitions ref / environment
#       # cue:
#       #   environment: dev
#       #   definitionsConfigMapRef:
#       #     name: my-cue-defs
#       #     key: defs.cue
#       additionalEndpoints: []           # optional; endpoints not in the OpenAPI doc (liveness/readiness). Matches KrakenDAutoConfigSpec.AdditionalEndpoints
#       additionalEndpointsBasePath: /api/v1/quote   # optional; overrides the operator's auto-derived base path for additionalEndpoints
#       # additionalEndpoints:
#       #   - endpoint: /liveness         # required (must start with /)
#       #     encoding: no-op             # optional; no-op for pass-through health checks
#       #   - endpoint: /readiness
#       #     encoding: no-op
#
#   # ----------------------------------------------------------------------------
#   # Service Account
#   # ----------------------------------------------------------------------------
#   serviceAccount:
#     create: false
#   
#   # ----------------------------------------------------------------------------
#   # Scheduling Configuration
#   # ----------------------------------------------------------------------------
#   # nodeSelector:
#   #   disktype: ssd
#   # priorityClassName: "high-priority"
#   
#   # ----------------------------------------------------------------------------
#   # Pod Disruption Budget
#   # ----------------------------------------------------------------------------
#   # When set, a PodDisruptionBudget is created for this application. Set exactly
#   # one of minAvailable or maxUnavailable (integer or percentage string).
#   # Default: no PDB is created.
#   # Only applies to deploymentType: deployment, statefulset, or rollout.
#   # podDisruptionBudget:
#   #   minAvailable: 1
#   #   # OR:
#   #   # maxUnavailable: "25%"
#
#   # ----------------------------------------------------------------------------
#   # Update Strategy
#   # ----------------------------------------------------------------------------
#   updateStrategy:
#     type: "RollingUpdate"
#     rollingUpdate:
#       maxUnavailable: 0
#       maxSurge: 2
#     
#     # For Argo Rollouts:
#     # canary:
#     #   steps:
#     #     - setWeight: 25
#     #     - analysis:
#     #         templates:
#     #           - templateName: load-test
#     #     - setWeight: 50
#     #     - analysis:
#     #         templates:
#     #           - templateName: load-test
#     #     - setWeight: 100
#     #   scaleDownDelaySeconds: 30
#     #   scaleDownDelayRevisionLimit: 5
#     #   abortScaleDownDelaySeconds: 30
#   
#   # ----------------------------------------------------------------------------
#   # Monitoring and Observability
#   # ----------------------------------------------------------------------------
#   serviceMonitor:
#     enabled: false
#     interval: "30s"
#     scrapeTimeout: "10s"
#     scheme: "http"
#     # relabelings: []
#     # metricRelabelings: []
#     # tlsConfig: {}
#   
#   # ----------------------------------------------------------------------------
#   # Lifecycle Hooks
#   # ----------------------------------------------------------------------------
#   # lifecycle:
#   #   postStart: "echo 'Container started'"
#   #   preStop: "sleep 10 && pkill node"
#   
#   # ----------------------------------------------------------------------------
#   # Vertical Pod Autoscaler (VPA)
#   # ----------------------------------------------------------------------------
#   vpa:
#     enabled: false
#     controlledValues: "RequestsOnly"  # Options: RequestsOnly, RequestsAndLimits
#     updateMode: "Auto"  # Options: Off, Initial, Auto
#     #   - Off: VPA does not automatically change resource requirements
#     #   - Initial: VPA only assigns resource requests on pod creation
#     #   - Auto: VPA updates resource requests at any time
#     
#     # Optional: Resource boundaries (defaults: min=requests, max=limits×3)
#     resources:
#       cpu:
#         minimum: "100m"    # Examples: "100m", "0.5", "1"
#         maximum: "3000m"   # Examples: "2000m", "2", "4"
#       memory:
#         minimum: "128Mi"   # Examples: "128Mi", "256Mi", "1Gi"
#         maximum: "3Gi"     # Examples: "2Gi", "4Gi", "8Gi"
#   
#   # ----------------------------------------------------------------------------
#   # Horizontal Pod Autoscaler (HPA)
#   # ----------------------------------------------------------------------------
#   # HPA scales based on CPU/memory utilization metrics.
#   # NOTE: HPA and KEDA are mutually exclusive. If keda.enabled is true, HPA
#   # will NOT be created even if autoscaling.enabled is true. KEDA takes precedence.
#   autoscaling:
#     enabled: false
#     minReplicas: 2         # Default: application replicas (min 2)
#     maxReplicas: 6         # Default: minReplicas × 3
#     targetCPUUtilizationPercentage: 80
#     targetMemoryUtilizationPercentage: 80
#     forceAutoscaling: false  # Force HPA even if replicas=1
#
#   # ----------------------------------------------------------------------------
#   # KEDA Autoscaler (Azure Service Bus)
#   # ----------------------------------------------------------------------------
#   # KEDA scales based on Azure Service Bus queue/topic message count.
#   # Authentication is via a ClusterTriggerAuthentication resource (managed outside this chart).
#   #
#   # ClusterTriggerAuthentication naming convention:
#   #   - dev / feature envs: servicebus-connectionstring-dev
#   #   - preprod:            servicebus-connectionstring-preprod
#   #   - prod:               servicebus-connectionstring-prod
#   #
#   # NOTE: HPA and KEDA are mutually exclusive. When keda.enabled is true,
#   # HPA is automatically disabled and replicas are managed by KEDA.
#   # NOTE: KEDA is blocked on feature environments (environment.name starting with "feature").
#   #
#   # --- Queue-based scaling ---
#   # keda:
#   #   enabled: true
#   #   type: "queue"                        # Required: "queue" or "topic"
#   #   queueName: "my-queue"                # Required for type: queue
#   #   # clusterAuthRef defaults to servicebus-connectionstring-<env> based on environment
#   #   messageCount: 500                    # Optional: Messages per replica to trigger scaling (default: 500)
#   #   activationMessageCount: 1            # Optional: Messages to activate scaler (scale from 0/idle)
#   #   pollingInterval: 30                  # Optional: How often KEDA checks the trigger (seconds, default: 30)
#   #   cooldownPeriod: 300                  # Optional: Wait after last trigger before scaling down (seconds, default: 300)
#   #   minReplicaCount: 2                   # Optional: Minimum replicas (default: 2)
#   #   maxReplicaCount: 50                  # Optional: Maximum replicas (default: 50)
#   #   idleReplicaCount: 0                  # Optional: Replicas when idle (set to 0 for scale-to-zero)
#   #   advanced:                            # Optional: Advanced KEDA scaling policies
#   #     horizontalPodAutoscalerConfig:
#   #       behavior:
#   #         scaleDown:
#   #           stabilizationWindowSeconds: 300
#   #
#   # --- Topic-based scaling ---
#   # keda:
#   #   enabled: true
#   #   type: "topic"                        # Required: "queue" or "topic"
#   #   topicName: "my-topic"                # Required for type: topic
#   #   subscriptionName: "my-subscription"  # Required for type: topic
#   #   # clusterAuthRef defaults to servicebus-connectionstring-<env> based on environment
#   #   messageCount: 10
#   #   minReplicaCount: 1
#   #   maxReplicaCount: 20
#
#   # ----------------------------------------------------------------------------
#   # Automated Testing Configuration
#   # ----------------------------------------------------------------------------
#   # Configure automated test jobs that run against your deployed application
#   testtrigger:
