## @section Kubernetes Jobs
## Configuration for Kubernetes Jobs to run
##
## Each job supports: name, timing (pre-deploy/post-deploy), order, ttlSecondsAfterFinished,
## activeDeadlineSeconds, backoffLimit, labels, annotations, image (registry/repository/tag),
## imagePullPolicy, command, args, env, resources (requests/limits for cpu/memory), volumes,
## securityContext (opt-in hardened security context, see below)
##
## **Security Context (opt-in)**: securityContext.readOnlyRootFilesystem (default false; sets the
## container's readOnlyRootFilesystem), securityContext.fsGroup (unset by default; sets the pod-level
## fsGroup; must be >= 1 — fsGroup 0 is the root group and is rejected by the values schema; the >= 1
## bound is ORG POLICY enforced by MyCarrier-DevOps/kyverno-policies `require-non-root-groups` rule
## `check-fsGroup` ("must be empty or greater than zero"), not an upstream Pod Security Standards
## control — the PSS spec contains zero occurrences of fsGroup/runAsGroup/supplementalGroups; those
## were PodSecurityPolicy fields, and PSP is retired), securityContext.seccompProfile (unset by
## default; sets the pod-level seccompProfile, e.g. {type: RuntimeDefault}). All three are opt-in per
## job item — omitting securityContext entirely preserves the chart's existing default rendering.
##
## the `restrict-seccomp` ClusterPolicy differs per cluster, because each app cluster syncs its own
## branch of MyCarrier-DevOps/kyverno-policies:
##   - development cluster: validationFailureAction Enforce; pattern accepts
##     `runtime/default | RuntimeDefault`, so `RuntimeDefault` passes and IS enforced at admission.
##   - data and production-csp clusters: validationFailureAction Audit (report-only — violations
##     appear in PolicyReport objects, nothing is blocked); pattern accepts only the literal
##     `runtime/default`, so `RuntimeDefault` records a PolicyReport entry but is not rejected.
## Use `RuntimeDefault`: it is the correct value for the Kubernetes SeccompProfile.type field
## (`runtime/default` is the pre-1.25 annotation form and is not a legal field value), and Pod
## Security Standards `restricted` permits `RuntimeDefault` and `Localhost`, forbidding only
## `Unconfined`.
##
## **Annotations**: `jobs[].annotations` render onto BOTH the Job resource metadata and the Job pod
## template (filtered), mirroring `cronjobs[].annotations`. This matters because chart Jobs are
## ArgoCD PreSync/PostSync hooks — a never-exiting Istio sidecar on a Job pod blocks the entire
## application sync, not just one Job run — so `sidecar.istio.io/inject: "false"` set via
## `jobs[].annotations` is the documented way to stop that. The Job pod template emits no istio
## annotations of its own, so this key is not chart-managed there and passes through unaffected
## (unlike the application pod template, where it is chart-managed and closed to overrides).
##
## Chart-managed annotations always win; a colliding user-supplied key is DROPPED from `annotations`
## before rendering. The reserved set is an EXACT-KEY match (`hasKey`), not a
## `vault.security.banzaicloud.io/*` prefix match:
##   - Job resource metadata: `argocd.argoproj.io/sync-options`
##   - Job pod template: vault keys (`vault-addr`, `vault-auth-method`, `vault-path`, `vault-role`,
##     `vault-agent-env-variables`, `mutate-probes`, `run-as-non-root`, `run-as-user`, `run-as-group`,
##     plus `vault-env-daemon` when `secrets` is set and `vault-env-from-path` when
##     `secrets.bulk.path` is set) and otel keys (`sidecar.opentelemetry.io/inject`,
##     `instrumentation.opentelemetry.io/container-names`,
##     `instrumentation.opentelemetry.io/inject-<language>` — see the Applications section above for
##     the full otel gating conditions), plus `argocd.argoproj.io/sync-options`,
##     `argocd.argoproj.io/hook-delete-policy`, `argocd.argoproj.io/sync-wave`, and
##     `argocd.argoproj.io/hook`. The four argocd keys are reserved UNCONDITIONALLY, even though
##     sync-wave/hook only render when `.timing` is set — this keeps the reserved set independent of
##     `.timing`, so enabling a hook later cannot silently change which user keys survive.
##
## See the example configuration below for complete job specification details.

## @param jobs [array] List of Kubernetes Jobs to run
jobs: []

# ============================================================================
# EXAMPLE JOB CONFIGURATION
# ============================================================================
# - name: db-migration
#   timing: "pre-deploy"           # Options: pre-deploy, post-deploy
#   order: 0                        # Execution order within timing group
#   ttlSecondsAfterFinished: 300    # Cleanup after completion (seconds)
#   activeDeadlineSeconds: 600      # Job timeout (seconds)
#   backoffLimit: 0                 # Number of retries
#   
#   labels:
#     app.kubernetes.io/component: "job"
#   
#   annotations:
#     app.mycarrier.tech/team: "platform"
#   
#   image:
#     registry: "myregistry.example.com"
#     repository: "mycarrier/db-migration"
#     tag: "1.0.0"
#   
#   imagePullPolicy: "IfNotPresent"
#   command: ["/bin/sh", "-c"]
#   args: ["./run-migration.sh"]
#   
#   env:
#     - name: DB_NAME
#       value: "mydb"
#   
#   resources:
#     requests:
#       cpu: "100m"
#       memory: "128Mi"
#     limits:
#       cpu: "500m"
#       memory: "256Mi"
#
#   # Optional: Hardened security context (opt-in; omit entirely to keep default rendering)
#   # securityContext:
#   #   readOnlyRootFilesystem: true
#   #   fsGroup: 3000
#   #   seccompProfile:
#   #     type: RuntimeDefault

## @section Kubernetes CronJobs
## Configuration for Kubernetes CronJobs to run on a schedule
##
## Each cronjob supports: name, schedule (required), timeZone, concurrencyPolicy, suspend,
## successfulJobsHistoryLimit, failedJobsHistoryLimit, startingDeadlineSeconds, activeDeadlineSeconds,
## backoffLimit, restartPolicy, labels, annotations, image (registry/repository/tag), imagePullPolicy,
## imagePullSecret, command, args, env, configMapName, secretName, resources (requests/limits), volumes,
## securityContext (opt-in hardened security context, see below)
##
## **Security Context (opt-in)**: securityContext.readOnlyRootFilesystem (default false; sets the
## container's readOnlyRootFilesystem), securityContext.fsGroup (unset by default; sets the pod-level
## fsGroup; must be >= 1 — fsGroup 0 is the root group and is rejected by the values schema; the >= 1
## bound is ORG POLICY enforced by MyCarrier-DevOps/kyverno-policies `require-non-root-groups` rule
## `check-fsGroup` ("must be empty or greater than zero"), not an upstream Pod Security Standards
## control — the PSS spec contains zero occurrences of fsGroup/runAsGroup/supplementalGroups; those
## were PodSecurityPolicy fields, and PSP is retired), securityContext.seccompProfile (unset by
## default; sets the pod-level seccompProfile, e.g. {type: RuntimeDefault}). All three are opt-in per
## cronjob item — omitting securityContext entirely preserves the chart's existing default rendering.
##
## the `restrict-seccomp` ClusterPolicy differs per cluster, because each app cluster syncs its own
## branch of MyCarrier-DevOps/kyverno-policies:
##   - development cluster: validationFailureAction Enforce; pattern accepts
##     `runtime/default | RuntimeDefault`, so `RuntimeDefault` passes and IS enforced at admission.
##   - data and production-csp clusters: validationFailureAction Audit (report-only — violations
##     appear in PolicyReport objects, nothing is blocked); pattern accepts only the literal
##     `runtime/default`, so `RuntimeDefault` records a PolicyReport entry but is not rejected.
## Use `RuntimeDefault`: it is the correct value for the Kubernetes SeccompProfile.type field
## (`runtime/default` is the pre-1.25 annotation form and is not a legal field value), and Pod
## Security Standards `restricted` permits `RuntimeDefault` and `Localhost`, forbidding only
## `Unconfined`.
##
## `annotations` render onto BOTH the CronJob resource metadata and the CronJob pod template, so it
## can be used to set per-cronjob pod annotations — e.g. `sidecar.istio.io/inject: "false"` to opt a
## CronJob's pods out of Istio sidecar injection in istio-injection=enabled namespaces (a never-exiting
## sidecar container otherwise hangs the Job). The CronJob pod template emits no istio annotations of
## its own, so `sidecar.istio.io/inject` is not chart-managed here and passes through unaffected —
## unlike the application pod template, where this key IS chart-managed and closed to overrides.
##
## Chart-managed annotations always win. A user-supplied key that collides with a chart-managed
## annotation is DROPPED from `annotations` before rendering — it will not override the chart's value,
## and it will not render twice. The reserved set is an EXACT-KEY match (`hasKey`), not a
## `vault.security.banzaicloud.io/*` prefix match:
##   - CronJob resource metadata: `argocd.argoproj.io/sync-options`
##   - CronJob pod template: vault keys (`vault-addr`, `vault-auth-method`, `vault-path`, `vault-role`,
##     `vault-agent-env-variables`, `mutate-probes`, `run-as-non-root`, `run-as-user`, `run-as-group`,
##     plus `vault-env-daemon` when `secrets` is set and `vault-env-from-path` when
##     `secrets.bulk.path` is set) and otel keys (`sidecar.opentelemetry.io/inject`,
##     `instrumentation.opentelemetry.io/container-names`,
##     `instrumentation.opentelemetry.io/inject-<language>` — see the Applications section above for
##     the full otel gating conditions). No argocd/istio/gateway keys are reserved on the CronJob pod
##     template.
##
## Any key NOT in the reserved set above is applied to the pod/resource as-is — including other
## `vault.security.banzaicloud.io/*` keys the chart does not set (see the Applications section above
## for the security-relevant passthrough keys verified: `vault-skip-verify`, `mutate: skip`,
## `vault-namespace`, `vault-serviceaccount`, `psp-allow-privilege-escalation`).
##
## The reserved set is context-dependent: a key that is free today can become chart-managed when a
## related feature is enabled (e.g. turning on otel autoinstrumentation), at which point the user's
## value stops taking effect. This is deliberate — the alternative (failing the template render) would
## turn an unrelated future "enable otel" change into a hard non-local build break.
##
## See the example configuration below for complete cronjob specification details.

## @param cronjobs [array] List of Kubernetes CronJobs to run
cronjobs: []

# ============================================================================
# EXAMPLE CRONJOB CONFIGURATION
# ============================================================================
# - name: backup-job
#   schedule: "0 2 * * *"           # REQUIRED: Cron schedule (runs at 2 AM daily)
#   timeZone: "UTC"
#   concurrencyPolicy: "Forbid"     # Options: Allow, Forbid, Replace
#   suspend: false
#   successfulJobsHistoryLimit: 3
#   failedJobsHistoryLimit: 1
#   startingDeadlineSeconds: 200
#   activeDeadlineSeconds: 600
#   backoffLimit: 0
#   restartPolicy: "Never"          # Options: Never, OnFailure
#   
#   labels:
#     app.kubernetes.io/component: "cronjob"
#   
#   annotations:
#     app.mycarrier.tech/team: "platform"
#   
#   image:
#     registry: "myregistry.example.com"
#     repository: "mycarrier/backup"
#     tag: "1.0.0"
#   
#   imagePullPolicy: "IfNotPresent"
#   imagePullSecret: "imagepull"
#   command: ["/bin/sh", "-c"]
#   args: ["./run-backup.sh"]
#   
#   env:
#     - name: BACKUP_PATH
#       value: "/backups"
#   
#   # Optional: ConfigMap and Secret references
#   # configMapName: "backup-config"
#   # secretName: "backup-secrets"
#   
#   resources:
#     requests:
#       cpu: "100m"
#       memory: "128Mi"
#     limits:
#       cpu: "500m"
#       memory: "512Mi"
#
#   # Optional: Hardened security context (opt-in; omit entirely to keep default rendering)
#   # securityContext:
#   #   readOnlyRootFilesystem: true
#   #   fsGroup: 3000
#   #   seccompProfile:
#   #     type: RuntimeDefault
#
#   # Optional: Volume mounts
#   # volumes:
#   #   - name: backup-storage
#   #     mountPath: /backups
#   #     kind: emptyDir

## @section Secrets Management
## Configuration for secrets from Vault
##
## **Bulk secrets**: secrets.bulk.path - retrieves all keys from a Vault path as environment variables
## **Individual secrets**: secrets.individual[] - array of {envVarName, path, keyName} for specific env vars
## **Mounted secrets**: secrets.mounted[] - array of {name, mountedFileName, vault.path, vault.property, mount.path, mount.subPath}
##
## See the example configuration below for complete secrets specification details.

## @extra secrets Secret configuration
## @param secrets.bulk [object] Bulk secret retrieval from a single Vault path
## @param secrets.individual [array] Individual environment variables from Vault
## @param secrets.mounted [array] File-mounted secrets from Vault

secrets:
  bulk: {}
    # path: "secrets/data/dev/app"
  
  individual: []
    # - envVarName: DB_PASSWORD
    #   path: secrets/data/dev/app/db
    #   keyName: password
  
  mounted: []
    # - name: certificate
    #   mountedFileName: cert.pem
    #   vault:
    #     path: secrets/data/dev/app/certs
    #     property: certificate
    #   mount:
    #     path: /app/certs
    #     subPath: cert.pem

## @section Infrastructure Resources
## Infrastructure resources provisioned via Crossplane
##
## **Resource Groups**: infrastructure.azure.resourceGroup[] - name, location, managementPolicies, tags, namespace
## **Storage Accounts**: infrastructure.azure.storage.accounts[] - resource groups, storage accounts, containers, tags
## **Service Bus**: infrastructure.azure.servicebus[] - namespace, SKU, topics, subscriptions, rules, management policies
##
## All resources support managementPolicies for lifecycle management (default: ["Observe"] for safe imports).
## "Delete" policy is blocked to prevent accidental resource deletion.
##
## See the comprehensive example configuration below for all available options and detailed documentation.

# ============================================================================
# INFRASTRUCTURE CONFIGURATION
# ============================================================================
# The following sections configure Azure infrastructure resources managed
# through Crossplane. These resources are provisioned and managed as part
# of your Kubernetes deployment.
# ============================================================================

## @extra infrastructure Infrastructure configuration
## @extra infrastructure.azure Azure infrastructure resources
## @extra infrastructure.azure.defaults Default values shared across all Azure resources
## @param infrastructure.azure.defaults.location [string] Default Azure region for all resources (empty = must set per-resource)
## @param infrastructure.azure.defaults.providerConfigRef [string] Default Crossplane ProviderConfig name (empty = auto: resourceGroup/storage use "default"; servicebus is environment-aware — dev="default", preprod/prod="baseitm")
## @param infrastructure.azure.resourceGroup [array] Azure Resource Group configurations
## @extra infrastructure.azure.storage Azure Storage configuration
## @param infrastructure.azure.storage.accounts [array] Azure storage account configurations
## @param infrastructure.azure.servicebus [array] Azure Service Bus namespace configurations

infrastructure:
  azure:
    # Default values shared across Resource Group and Service Bus resources.
    # Storage uses Compositions and does not consume these defaults.
    # Per-resource values take precedence over these defaults.
    defaults:
      location: ""                  # Default Azure region (e.g., "East US"). Empty = must set per-resource.
      providerConfigRef: ""         # Default Crossplane ProviderConfig name. Empty = auto:
                                    #   - resourceGroup & storage fall back to "default"
                                    #   - servicebus is environment-aware: dev="default", preprod/prod="baseitm"
                                    # Set a non-empty value here to force one ProviderConfig for all resources.

    # Azure Resource Group configurations
    resourceGroup: []
      # Example Resource Group configuration:
      # - name: "rg-app-dev"                              # Optional: Resource Group name (default: inf-{metaEnv})
      #                                                    # metaEnv maps feature-* to "dev", otherwise uses env name
      #                                                    # Examples: inf-dev, inf-preprod, inf-prod
      #   location: "East US"                             # Required: Azure region (or set infrastructure.azure.defaults.location)
      #   providerConfigRef: "default"                    # Optional: Crossplane ProviderConfig name (default: infrastructure.azure.defaults.providerConfigRef, or "default")
      #
      #   # Optional: Manage resource lifecycle with managementPolicies
      #   # managementPolicies: ["Observe"]               # Optional: Management policies (default: ["Observe"] - import/read-only mode)
      #                                                    # IMPORTANT: "Delete" policy is BLOCKED to protect infrastructure from accidental deletion
      #                                                    # Default is safe for importing existing resources: ["Observe"]
      #                                                    # To create/manage new resources: ["Create", "Update", "LateInitialize", "Observe"]
      #
      #   # Optional: Managed by resource ID
      #   # managedBy: "/subscriptions/.../resourceGroups/..."  # Optional: ID of resource that manages this RG
      #
      #   # Optional: Resource tags
      #   tags:
      #     environment: "dev"
      #     purpose: "application-resources"
      #     managed-by: "crossplane"
      #
      #   # Optional: Custom Kubernetes namespace
      #   namespace: "my-custom-namespace"                # Optional: Custom Kubernetes namespace (default: environment.name, or environment.namespaceOverride if set)
      #
      #   # Optional: Custom annotations
      #   annotations:
      #     custom.annotation/key: "custom-value"

    storage:
      # Azure storage account configurations
      accounts: []
        # Example storage account configuration:
        # - # Resource Group Options (choose one):
        #   existingResourceGroup:                          # Option 1: Use existing external resource group
        #     name: "my-existing-rg"                        # Required: Name of existing resource group
        #   # OR
        #   newResourceGroup:                               # Option 2: Create new resource group as part of composition
        #     name: "my-new-rg"                             # Optional: Name for new resource group (auto-generated if omitted)
        #   
        #   # Storage Account Options (choose one):
        #   existingStorageAccount:                         # Option 1: Use existing external storage account
        #     name: "mystorageacct"                         # Required: Name of existing storage account
        #   # OR
        #   newStorageAccount:                              # Option 2: Create new storage account as part of composition
        #     name: "mystorageacct"                         # Optional: Name for new storage account (auto-generated if omitted)
        #     location: "East US"                           # Required: Azure region
        #     accountTier: "Standard"                       # Optional: Standard (default) or Premium
        #     accountReplicationType: "LRS"                 # Optional: LRS (default), GRS, RAGRS, ZRS, GZRS, RAGZRS
        #     accessTier: "Cool"                            # Optional: Cool (default), Hot, Archive
        #   
        #   # Optional: Blob containers to create
        #   containers:
        #     - name: "uploads"                             # Required: Container name
        #       accessType: "private"                       # Optional: private (default), blob, container
        #       metadata:                                   # Optional: Container metadata
        #         retention: "30days"
        #         tier: "hot"
        #     - name: "logs"
        #       accessType: "blob"
        #   
        #   # Optional: Resource tags
        #   tags:
        #     environment: "dev"
        #     purpose: "application-storage"
        #   
        #   # Optional: Custom Kubernetes namespace
        #   namespace: "my-custom-namespace"
        #   
        #   # Optional: Custom annotations
        #   annotations:
        #     custom.annotation/key: "custom-value"
    # Azure Service Bus configurations
    servicebus: []
      # Example Service Bus configuration:
      # - name: "my-servicebus-namespace"                # Optional: Service Bus namespace name (default: inf-{metaEnv}-servicebus)
      #                                                    # metaEnv maps feature-* to "dev", otherwise uses env name
      #                                                    # Examples: inf-dev-servicebus, inf-preprod-servicebus, inf-prod-servicebus
      #   location: "East US"                             # Required: Azure region (or set infrastructure.azure.defaults.location)
      #   sku: "Standard"                                 # Optional: Basic, Standard, or Premium (default: "Standard")
      #   providerConfigRef: "default"                    # Optional: Crossplane ProviderConfig name
      #                                                    # Default: infrastructure.azure.defaults.providerConfigRef if set, else environment-aware:
      #                                                    #   dev="default", preprod/prod="baseitm" (feature-* maps to dev)
      #                                                    # Inherited by all child resources (topics, subscriptions, rules)
      #   resourceGroupName: "rg-app-dev"                 # Optional: Resource group name (default: inf-{env}, matching default RG name)
      #
      #   # Optional: For Premium SKU only
      #   # capacity: 1                                   # Optional: Messaging units: 1, 2, 4, 8, or 16 (default: 1)
      #
      #   # Optional: Manage resource lifecycle with managementPolicies
      #   # managementPolicies: ["Observe"]               # Optional: Management policies (default: ["Observe"] - import/read-only mode)
      #                                                    # IMPORTANT: "Delete" policy is BLOCKED to protect infrastructure from accidental deletion
      #                                                    # Default is safe for importing existing resources: ["Observe"]
      #                                                    # To create/manage new resources: ["Create", "Update", "LateInitialize", "Observe"]
      #
      #   # Optional: Resource tags
      #   tags:
      #     environment: "dev"
      #     purpose: "messaging"
      #
      #   # Optional: Custom Kubernetes namespace
      #   namespace: "my-custom-namespace"                # Optional: Custom Kubernetes namespace (default: environment.name, or environment.namespaceOverride if set)
      #
      #   # Required: At least one topic with subscriptions
      #   topics:
      #     - name: "orders"                              # Required: Topic name
      #
      #       # Optional: Topic-level management policies
      #       # managementPolicies: ["Observe"]           # Optional: Management policies (default: ["Observe"] - import/read-only mode)
      #                                                    # IMPORTANT: "Delete" policy is BLOCKED
      #                                                    # To create/manage new topics: ["Create", "Update", "LateInitialize", "Observe"]
      #
      #       # Optional: Topic settings (all have Azure defaults if omitted)
      #       # maxSizeInMegabytes: 1024                  # Optional: Topic size in MB (default: 1024 for Basic/Standard, 5120 for Premium)
      #       # requiresDuplicateDetection: false         # Optional: Enable duplicate detection (default: false)
      #       # defaultMessageTtl: "P14D"                 # Optional: ISO 8601 duration (default: P14D - 14 days)
      #       # duplicateDetectionHistoryTimeWindow: "PT10M" # Optional: ISO 8601 duration (default: PT10M - 10 minutes)
      #       # batchedOperationsEnabled: true            # Optional: Enable batched operations (default: true)
      #       # expressEnabled: false                     # Optional: Enable Express mode (Standard/Premium only, default: false)
      #       # partitioningEnabled: false                # Optional: Enable partitioning (default: false)
      #       # supportOrdering: false                    # Optional: Enable message ordering (default: false)
      #       # autoDeleteOnIdle: "P10675199DT2H48M5.4775807S" # Optional: Auto-delete after idle time (default: never)
      #
      #       # Required: At least one subscription per topic
      #       subscriptions:
      #         - name: "orders-processor"               # Required: Subscription name
      #
      #           # Optional: Subscription-level management policies
      #           # managementPolicies: ["Observe"]      # Optional: Management policies (default: ["Observe"] - import/read-only mode)
      #                                                   # IMPORTANT: "Delete" policy is BLOCKED
      #                                                   # To create/manage new subscriptions: ["Create", "Update", "LateInitialize", "Observe"]
      #
      #           # Optional: Subscription settings (all have Azure defaults if omitted)
      #           # maxDeliveryCount: 10                 # Optional: Maximum delivery attempts (default: 10)
      #           # lockDuration: "PT1M"                 # Optional: ISO 8601 duration (default: PT1M - 1 minute)
      #           # requiresSession: false               # Optional: Enable sessions (default: false)
      #           # defaultMessageTtl: "P14D"            # Optional: ISO 8601 duration (default: P14D - 14 days)
      #           # deadLetteringOnMessageExpiration: false # Optional: Move expired messages to DLQ (default: false)
      #           # deadLetteringOnFilterEvaluationError: true # Optional: Move messages to DLQ on filter errors (default: true)
      #           # batchedOperationsEnabled: true       # Optional: Enable batched operations (default: true)
      #           # autoDeleteOnIdle: "P10675199DT2H48M5.4775807S" # Optional: Auto-delete after idle time (default: never)
      #           # forwardTo: "another-topic-or-queue"  # Optional: Forward messages to another entity
      #           # forwardDeadLetteredMessagesTo: "dlq-topic-or-queue" # Optional: Forward dead-lettered messages
      #
      #           # Optional: Subscription rules for message filtering
      #           rules:
      #             - name: "high-priority-filter"       # Required: Rule name
      #               filterType: "SqlFilter"            # Required: SqlFilter or CorrelationFilter
      #               sqlFilter: "priority = 'high'"     # Required for SqlFilter: SQL expression for filtering
      #               # action: "SET priority = 'urgent'" # Optional: SQL action to modify message properties
      #
      #               # Optional: Rule-level management policies
      #               # managementPolicies: ["Observe"]  # Optional: Management policies (default: ["Observe"] - import/read-only mode)
      #                                                   # IMPORTANT: "Delete" policy is BLOCKED
