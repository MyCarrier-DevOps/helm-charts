{{/* PERFORMANCE OPTIMIZATION: Precompute global context once instead of in every helper */}}
{{- $globalCtx := include "helm.context" $ | fromJson -}}
{{- range $appName, $appValues := .Values.applications }}
{{- $appContext := (merge (dict "appName" $appName "application" $appValues "ctx" $globalCtx) $) }}
{{- $domain := include "helm.domain" $ }}
{{- $domainPrefix := include "helm.domain.prefix" $ }}
{{- $namespace := include "helm.namespace" $ }}
{{- $fullName := include "helm.fullname" $appContext }}
{{- $metaenv := (include "helm.metaEnvironment" $ ) }}
{{- $istioConfig := dig "networking" "istio" dict $appValues }}
{{- $istioEnabled := true }}
{{- if and $istioConfig (hasKey $istioConfig "enabled") }}
{{- $istioEnabled = $istioConfig.enabled }}
{{- end }}
{{- $appIstioDisabled := dig "istioDisabled" false $appValues }}
{{- $serviceIstioDisabled := dig "service" "istioDisabled" false $appValues }}
{{- $internalEnabled := dig "networking" "istio" "internalEnabled" true $appValues }}
{{- $offloadOperatorEnabled := and (dig "networking" "istio" "offloadOperatorEnabled" (eq $metaenv "dev") $appValues) (eq $metaenv "dev") }}
{{- $renderVirtualService := and $istioEnabled (not $appIstioDisabled) (not $serviceIstioDisabled) (not $offloadOperatorEnabled) }}
{{- if $renderVirtualService }}
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ $fullName }}
  namespace: {{ $namespace }}
  labels:
    {{ include "helm.labels.standard" $appContext | indent 4 | trim }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=true
    {{ include "helm.annotations.virtualservice" $appContext | indent 4 | trim }}
spec:
  {{ include "helm.specs.virtualservice" $appContext | indent 2 | trim }}
{{- end }}
{{- $offloadVSEnabled := dig "networking" "istio" "offloadVSEnabled" true $appValues }}
{{- if and $istioEnabled (not $appIstioDisabled) (not $serviceIstioDisabled) (hasPrefix "feature" $.Values.environment.name) $offloadVSEnabled (not (dig "networking" "krakend" "enabled" false $appValues)) }}
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ $fullName }}-offload
  namespace: {{ $namespace }}
  labels:
    {{ include "helm.labels.standard" $appContext | indent 4 | trim }}
  annotations:
    {{ include "helm.annotations.virtualservice" $appContext | indent 4 | trim }}
spec:
  exportTo:
  - .
  - istio-system
  hosts:
  - {{ $fullName }}
  - {{ $fullName }}.{{ $namespace }}.svc
  - {{ $fullName }}.{{ $namespace }}.svc.cluster.local
  {{- if and ($.Values.isEnvironmentDeploy | default false) $appValues.staticHostname }}
  - {{ $appValues.staticHostname | trimSuffix "." }}.{{ $domain }}
  {{- else }}
  - {{ $fullName }}.{{ $domainPrefix }}.{{ $domain }}
  {{- end }}
  {{- /* Include additional custom hosts from networking.istio.hosts */ -}}
  {{- if and (hasKey $istioConfig "hosts") $istioConfig.hosts -}}
  {{- range $istioConfig.hosts }}
  - {{ tpl . $ }}
  {{- end -}}
  {{- end }}
  {{- range (dig "networking" "istio" "legacyHostAliases" list $appValues) }}
  - {{ include "helm.legacyHostFqdn" (dict "alias" . "ctx" $) }}
  {{- end }}
  {{ include "helm.virtualservice.gateways" $appValues | indent 2 | trim }}
  http:
  {{- /* Custom routes (networking.istio.routes) - most specific first, before the catch-all */ -}}
  {{- if and (hasKey $istioConfig "routes") $istioConfig.routes }}
  {{- range $key, $value := $istioConfig.routes }}
  {{- $routeSpec := omit $value "destination" "port" }}
  - name: {{ $key }}
    {{- tpl (toYaml $routeSpec) $ | nindent 4 }}
    route:
      - destination:
          host: "{{ tpl (default (printf "%s.%s.svc.cluster.local" $fullName $namespace) $value.destination) $ }}"
          port:
            number: {{ default (default 8080 (dig "ports" "http" nil $appValues)) $value.port }}
  {{- end }}
  {{- end }}
  - name: {{ $fullName }}
    route:
      - destination:
          host: "{{ $fullName }}.{{ $namespace }}.svc.cluster.local"
          port:
            number: {{ default 8080 (dig "ports" "http" nil $appValues) }}
{{- end }}
{{- end }}