{{/* PERFORMANCE OPTIMIZATION: Precompute global context once instead of in every helper */}}
{{- $globalCtx := include "helm.context" $ | fromJson -}}
{{- range $appName, $appValues := .Values.applications }}
{{- $appContext := (merge (dict "appName" $appName "application" $appValues "ctx" $globalCtx) $) }}
{{- if eq "true" (include "helm.hpaCondition" $appContext | trim) }}
{{- $namespace := include "helm.namespace" $ }}
{{- $fullName := include "helm.fullname" $appContext }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullName }}
  namespace: {{ $namespace }}
  labels:
    {{ include "helm.labels.dependencies" $appContext | indent 4 | trim }}
    {{ include "helm.labels.standard" $appContext | indent 4 | trim }}
    {{ include "helm.labels.version" $appContext | indent 4 | trim }}
  annotations:
    argocd.argoproj.io/sync-wave: "11"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=true
    {{- /* A Rollout app's HPA targets the Rollout (helm.specs.hpa). kube-linter, chart-renderer's render check, models
           only built-in workloads, so its dangling-horizontalpodautoscaler check finds no such target and refuses the
           render (DEVOPS-534). An HPA of a Deployment or StatefulSet stays linted. */}}
    {{- if eq $appValues.deploymentType "rollout" }}
    ignore-check.kube-linter.io/dangling-horizontalpodautoscaler: "targets an Argo Rollout, which kube-linter does not model"
    {{- end }}
spec:
  {{ include "helm.specs.hpa" $appContext | indent 2 | trim }}
{{- end -}}
{{- end }}
