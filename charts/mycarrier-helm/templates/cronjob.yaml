{{- if hasKey .Values "cronjobs" }}
{{/* PERFORMANCE OPTIMIZATION: Precompute global context once instead of in every helper */}}
{{- $globalCtx := include "helm.context" $ | fromJson -}}
{{- $namespace := include "helm.namespace" . }}
{{- $appStack := .Values.global.appStack }}
{{- $env := .Values.environment.name -}}
{{- range .Values.cronjobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  {{- $rootContext := (merge (dict "cronjob" . "ctx" $globalCtx) $) }}
  name: {{ $namespace }}-{{ $appStack }}-{{ .name | default "cronjob" }}
  namespace: {{ $namespace }}
  labels:
    {{ include "helm.labels.dependencies" $rootContext | indent 4 | trim }}
    {{ include "helm.labels.standard" $rootContext | indent 4 | trim }}
    {{ include "helm.labels.version" $rootContext | indent 4 | trim }}
    {{- if .labels }}
    {{ toYaml .labels | indent 4 | trim }}
    {{- end }}
  annotations:
    {{ include "helm.annotations.cronjobMetadata" . | indent 4 | trim }}
    {{- /* kube-linter, chart-renderer's render check, wants a liveness probe on every container and refuses the render
           of any cronjobs[] entry without this. An entry that sets the key in its annotations keeps its own value
           (no duplicate key). */}}
    {{- if not (hasKey (.annotations | default dict) "ignore-check.kube-linter.io/no-liveness-probe") }}
    ignore-check.kube-linter.io/no-liveness-probe: "the container runs to completion as a Job; there is nothing to probe"
    {{- end }}
  {{- if hasKey (.annotations | default dict) "argocd.argoproj.io/sync-wave" }}
  {{- fail (printf "cronjob %q: annotation argocd.argoproj.io/sync-wave is set by the chart (\"10\", the workloads' wave, so a CronJob updates after the pre-deploy jobs); remove it from cronjobs[].annotations" (toString .name)) }}
  {{- end }}
  {{- $reserved := include "helm.annotations.cronjobMetadata" . | fromYaml }}
  {{- $extra := include "helm.annotations.userExtra" (dict "reserved" $reserved "user" .annotations) }}
  {{- if $extra }}
    {{ $extra | indent 4 | trim }}
  {{- end }}
  {{- $spec := include "helm.specs.cronjob" $rootContext }}
  {{- with include "helm.mongodb.lintIgnores" (dict "root" $ "spec" $spec "annotations" .annotations) }}
    {{ . | indent 4 | trim }}
  {{- end }}
spec:
  {{ $spec | indent 2 | trim }}
{{- end }}
{{- end }}
