{{- if and (eq .Values.environment.name "dev") (not (.Values.isEnvironmentDeploy | default false)) }}
{{- $fullName := include "helm.fullname" . }}
{{- $namespace := include "helm.namespace" . }}
{{- $deployment := include "helm.deployment" . }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $fullName }}-offload-generator
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - git:
                    files:
                      - path: Apps/dev-{{ .Values.global.appStack | lower }}/v2-offload.yaml
                    repoURL: https://github.com/MyCarrier-DevOps/GitOps-dev.git
                    revision: main
                - list:
                    elementsYaml: '{{`{{`}} .offloads.{{ $deployment }} | toJson {{`}}`}}'
          - list:
              elements:
                - Values:
                    global:
                      appStack: {{ .Values.global.appStack | lower }}
                      gitbranch: {{ .Values.global.gitbranch }}
                      language: {{ .Values.global.language }}
                      {{- if .Values.global.env }}
                      env:
                        {{- .Values.global.env | toYaml | nindent 24 }}
                      {{- end }}
                      dependencies:
                        {{- with .Values.global.dependencies }}
                        {{- toYaml . | nindent 24 }}
                        {{- end }}
                    environment:
                      name: "{{`{{`}} .name {{`}}`}}"
                      dependencyenv: dev
                      domainOverride:
                        enabled: {{ .Values.environment.domainOverride.enabled }}
                        domain: {{ .Values.environment.domainOverride.domain }}
                    deployment: {{ $deployment }}
                    applications:
                      {{- range $appName, $appConfig := .Values.applications }}
                      {{ $appName }}:
                        {{- omit $appConfig "env" | toYaml | nindent 24 }}
                      {{- end }}
                    jobs: {{- with .Values.jobs }}
                    {{- . | toYaml | nindent 22 }}
                    {{- end }}
                    secrets: {{- with .Values.secrets }}
                    {{- . | toYaml | nindent 22 }}
                    {{- end }}
  template:
    metadata:
      name: "{{ $fullName }}-offload-{{`{{`}} .name {{`}}`}}"
      annotations:
        notifications.argoproj.io/subscribe.on-deployed.deploy-reporter: ""
        {{- if not .Values.jobs }}
        {{- /* CSA->SSA managedFields migration of the legacy Replace-era manager, as in mc-environment
             (DEVOPS-313). Skipped when the offload renders Jobs: mycarrier-helm Jobs keep Force=true,Replace=true,
             get the legacy manager back on every replace, and the migration's client-side apply of an immutable
             Job template fails the sync. */}}
        argocd.argoproj.io/client-side-apply-migration-manager: argocd-application-controller
        {{- end }}
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: {{ $namespace }}
      source:
        repoURL: https://charts.mycarrier.dev
        chart: mycarrier-helm
        targetRevision: {{ $.Chart.Version}}
        helm:
          values: |2+
            {{`{{`}}- $Values := .Values {{`}}`}}
            {{`{{`}}- .Values | toYaml {{`}}`}}
      # The Rollouts-safe set from mc-environment (DEVOPS-313). Without it selfHeal re-applied the Rollout and its
      # Services on every reconcile and the offload slot stayed OutOfSync for good.
      ignoreDifferences:
        - group: ""
          kind: Service
          managedFieldsManagers:
            - rollouts-controller
          # Per-deploy labels (mycarrier-helm _labels.tpl). Ignoring them keeps Services Synced on a deploy, so
          # ApplyOutOfSyncOnly skips them and SSA (force-conflicts) never takes the atomic spec.selector
          # away from rollouts-controller (which would drop rollouts-pod-template-hash).
          jsonPointers:
            - /metadata/labels/mycarrier.tech~1correlationId
            - /metadata/labels/mycarrier.tech~1commitDeployed
            - /metadata/labels/mycarrier.tech~1reference
        - group: networking.istio.io
          kind: VirtualService
          jqPathExpressions:
            # Weights on every multi-destination route with a -preview destination (Rollout-managed: canary and allowed-* routes).
            # Host forms: FQDN <app>-preview.<ns>.svc.cluster.local and multi-frontend short <app>-preview (hence the end-of-string alternative).
            - '.spec.http[] | select(((.route // []) | length) > 1 and any(.route[]; (.destination.host // "") | test("-preview(\\.|$)"))) | .route[].weight'
            - '.spec.http[] | select(.name == "canary-header")'
        # The autoscalers sync in wave 11, after the Rollout (wave 10); their per-deploy labels would keep them in every
        # sync and the app OutOfSync for the whole canary. Labels only, no spec field is ignored.
        - group: autoscaling
          kind: HorizontalPodAutoscaler
          jsonPointers:
            - /metadata/labels/mycarrier.tech~1correlationId
            - /metadata/labels/mycarrier.tech~1commitDeployed
            - /metadata/labels/mycarrier.tech~1reference
            - /metadata/labels/version
            - /metadata/labels/mycarrier~1service-version
        - group: keda.sh
          kind: ScaledObject
          jsonPointers:
            - /metadata/labels/mycarrier.tech~1correlationId
            - /metadata/labels/mycarrier.tech~1commitDeployed
            - /metadata/labels/mycarrier.tech~1reference
            - /metadata/labels/version
            - /metadata/labels/mycarrier~1service-version
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - Validate=true
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=false
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true

        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 10m
{{- end -}}