{{/* PERFORMANCE OPTIMIZATION: Precompute global context once instead of in every helper */}}
{{- $globalCtx := include "helm.context" $ | fromJson -}}
{{- $serviceDefaults := $globalCtx.chartDefaults.service -}}
{{- range $appName, $appValues := .Values.applications }}
{{- $appContext := (merge (dict "appName" $appName "application" $appValues "ctx" $globalCtx) $) }}
{{- $namespace := include "helm.namespace" $ }}
{{- $fullName := include "helm.fullname" $appContext }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    {{- /* Rollout Services use client-side apply: it merges spec.selector, so the rollouts-pod-template-hash key the
           Rollouts controller adds survives a deploy that also changes the Service. Server-side apply replaces the
           whole selector map and briefly sends traffic to old and new pods together. This only takes effect when the
           app syncs without app-level Replace=true (mc-environment 0.3.0 or later): with Replace, gitops-engine takes
           the replace path before it reads per-resource sync options. The legacy offload generator (offloads.yaml)
           still sets Replace=true. */}}
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=true{{ if eq $appValues.deploymentType "rollout" }},ServerSideApply=false{{ end }}
    {{- if and (hasKey $appValues "service") (hasKey $appValues.service "annotations") }}
    {{ toYaml $appValues.service.annotations | indent 4 | trim }}
    {{- end }}
  labels:
    {{ include "helm.labels.standard" $appContext | indent 4 | trim }}
spec:
  {{ include "helm.specs.service" $appContext | indent 2 | trim }}

{{- if (eq $appValues.deploymentType "rollout")  }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-preview
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,ServerSideApply=false
    {{- if and (hasKey $appValues "service") (hasKey $appValues.service "annotations") }}
    {{ toYaml $appValues.service.annotations | indent 4 | trim }}
    {{- end }}
  labels:
    {{ include "helm.labels.standard" $appContext | indent 4 | trim }}
spec:
  {{ include "helm.specs.service" $appContext | indent 2 | trim }}
{{- end }}

{{- if and (hasKey $appValues "service") (hasKey $appValues.service "aliases") }}
{{- range $appValues.service.aliases }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ . }}
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    {{- if and (hasKey $appValues "service") (hasKey $appValues.service "annotations") }}
    {{ toYaml $appValues.service.annotations | indent 4 | trim }}
    {{- end }}
  labels:
    {{ include "helm.labels.standard" $appContext | indent 4 | trim }}
spec:
  type: {{ $appValues.service.type | default "ClusterIP" }}
  ports:
  {{- range $appValues.service.ports }}
    - name: {{ .name | lower }}
      port: {{ .port }}
      {{ if .targetPort }}targetPort: {{ .targetPort }}{{- end }}
  {{- end }}
  selector:
    {{ include "helm.labels.selector" $appContext | indent 4 | trim }}
  {{- if not $appValues.service.disableAffinity }}
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: {{ dig "service" "affinityTimeoutSeconds" $serviceDefaults.sessionAffinityTimeoutSeconds $appValues }}
  {{ end }}
{{- end }}
{{- end }}
{{- end }}
