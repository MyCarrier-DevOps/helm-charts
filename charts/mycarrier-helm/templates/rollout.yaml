{{/* PERFORMANCE OPTIMIZATION: Precompute global context once instead of in every helper */}}
{{- $globalCtx := include "helm.context" $ | fromJson -}}
{{- /* global.strategy.canary.leader must name an application of the release whenever it is set, so a misspelled leader
       fails now. That it is a canary Rollout is checked where the dark stage needs it (helm.canary.configuredSteps, in
       every environment, also where the steps do not render), so a leader set in shared values does not fail
       environments where that application is still a Deployment or migrating. */}}
{{- with dig "strategy" "canary" "leader" "" (.Values.global | default dict) }}
{{- if not (hasKey ($.Values.applications | default dict) (toString .)) }}
{{- fail (printf "global.strategy.canary.leader '%s' is not an application of this release" (toString .)) }}
{{- end }}
{{- end }}
{{- /* Canary analysis is mandatory (DEVOPS-312), so the removed analysis.enabled: false and the old [health, alerts]
       list fail in every environment, Rollouts or not: a stack sees them on its first render, not at its first prod
       canary. analysis.enabled: true is accepted and has no effect. */}}
{{- $analysisValues := dig "strategy" "canary" "analysis" dict (.Values.global | default dict) }}
{{- if and (hasKey $analysisValues "enabled") (not $analysisValues.enabled) }}
{{- fail "global.strategy.canary.analysis.enabled: false is no longer supported: canary analysis is mandatory for every Rollout (analysis.enabled is deprecated; true has no effect). Remove it. To leave out one check, set global.strategy.canary.analysis.health.enabled: false or analysis.alerts.enabled: false." }}
{{- end }}
{{- range ($analysisValues.templates | default list) }}
{{- if has (toString .) (list "health" "alerts") }}
{{- fail (printf "global.strategy.canary.analysis.templates lists '%s': health and alerts always run, so list only extra templates there. To leave one out, set global.strategy.canary.analysis.%s.enabled: false." (toString .) (toString .)) }}
{{- end }}
{{- end }}
{{- range $appName, $appValues := .Values.applications }}
{{- $appContext := (merge (dict "appName" $appName "application" $appValues "ctx" $globalCtx) $) }}
{{- /* Also rendered for a Deployment app while migratingToRollouts is set: on the way back from a Rollout, the Rollout
       stays for one release next to the Deployment, as the Deployment does on the way in. */}}
{{- if or (eq $appValues.deploymentType "rollout") (and (eq $appValues.deploymentType "deployment") $appValues.migratingToRollouts) }}
{{- $fullName := include "helm.fullname" $appContext }}
{{- $namespace := include "helm.namespace" $ }}
{{- $metaenv := include "helm.metaEnvironment" $ }}
{{- /* The offload operator owns the VirtualService in dev (same rule as virtualService.yaml) and rewrites it on
       every reconcile, which would wipe canary weights and header routes. A schema rule cannot see this
       environment-dependent default, so the check is here. A Rollout kept on the way back has no traffic routing. */ -}}
{{- if and (eq $appValues.deploymentType "rollout") (dig "networking" "istio" "offloadOperatorEnabled" (eq $metaenv "dev") $appValues) (eq $metaenv "dev") }}
{{- fail (printf "application '%s': deploymentType rollout cannot run while the offload operator owns the VirtualService (networking.istio.offloadOperatorEnabled, on by default in dev); the operator would wipe canary weights. Set networking.istio.offloadOperatorEnabled: false for this application, or keep deploymentType: deployment in this environment. In the dev environment itself the operator owns %s's VirtualService, so turning it off there deletes that VirtualService until Argo CD self-heals; try Rollouts in a feature environment instead." $appName $fullName) }}
{{- end }}
{{- /* In a feature environment the chart also renders <fullName>-offload (same gate as virtualService.yaml), which
       claims the same hosts as the Rollout's VirtualService. Istio does not merge VirtualServices for sidecars, and
       the order across resources at a gateway is undefined, so the canary weights might never apply. */ -}}
{{- $offloadVSRendered := and (dig "networking" "istio" "enabled" true $appValues) (not (dig "istioDisabled" false $appValues)) (not (dig "service" "istioDisabled" false $appValues)) (hasPrefix "feature" $.Values.environment.name) (dig "networking" "istio" "offloadVSEnabled" true $appValues) (not (dig "networking" "krakend" "enabled" false $appValues)) }}
{{- $canary := eq (include "helm.canary.enabled" $appContext) "true" }}
{{- if and $canary $offloadVSRendered }}
{{- fail (printf "application '%s': a Rollout in a feature environment also needs networking.istio.offloadVSEnabled: false; otherwise %s-offload claims the same hosts as the Rollout's VirtualService, and Istio does not merge VirtualServices for sidecars." $appName $fullName) }}
{{- end }}
{{- /* The shared <primary>-multifrontend-offload VirtualService of a feature environment follows the primary frontend's
       offloadVSEnabled, so a non-primary frontend Rollout needs the primary's flag off too. */ -}}
{{- if and $canary $appValues.isFrontend (hasPrefix "feature" $.Values.environment.name) }}
{{- $frontendCount := 0 }}{{- $primaryValues := dict }}
{{- range $name, $values := $.Values.applications }}{{ if $values.isFrontend }}{{ $frontendCount = add1 $frontendCount }}{{ if $values.isPrimary }}{{ $primaryValues = $values }}{{ end }}{{ end }}{{ end }}
{{- if and (gt $frontendCount 1) $primaryValues (dig "networking" "istio" "offloadVSEnabled" true $primaryValues) }}
{{- fail (printf "application '%s': a frontend Rollout in a feature environment also needs networking.istio.offloadVSEnabled: false on the primary frontend; otherwise the shared -multifrontend-offload VirtualService claims the same hosts and Istio does not merge VirtualServices for sidecars." $appName) }}
{{- end }}
{{- end }}
{{- /* The canary weights live in the chart's VirtualService, so a Rollout that runs canary steps needs it rendered. */ -}}
{{- if and $canary (or (not (dig "networking" "istio" "enabled" true $appValues)) (dig "istioDisabled" false $appValues) (dig "service" "istioDisabled" false $appValues)) }}
{{- fail (printf "application '%s': a Rollout needs the chart's Istio VirtualService for its canary weights; networking.istio.enabled, istioDisabled and service.istioDisabled must leave Istio on." $appName) }}
{{- end }}
{{- /* Canary settings are release-wide, so every Rollout of a release runs the same steps (DEVOPS-311, D20). */ -}}
{{- if and (kindIs "map" $appValues.updateStrategy) (hasKey $appValues.updateStrategy "canary") }}
{{- fail (printf "application '%s': updateStrategy.canary is no longer supported; canary settings are release-wide in global.strategy.canary (preset, steps, analysis)." $appName) }}
{{- end }}
{{- /* Alias Services select every pod of the app without the rollouts-pod-template-hash the controller manages, so
       traffic through them reaches canary pods in proportion to pod count, whatever the weights. */ -}}
{{- if and (eq $appValues.deploymentType "rollout") (dig "service" "aliases" nil $appValues) }}
{{- fail (printf "application '%s': service.aliases is not supported with deploymentType rollout; alias Services would send traffic to canary pods regardless of the canary weights." $appName) }}
{{- end }}
{{- /* While migrating, the Rollout runs the Deployment's pod template next to the Deployment, so the privileged debug
       sidecar would run in both pod sets. */ -}}
{{- if and $appValues.migratingToRollouts $appValues.enableDebugMode }}
{{- fail (printf "application '%s': enableDebugMode cannot be on while migratingToRollouts is set; both the Deployment and the Rollout would run the privileged debug sidecar. Turn enableDebugMode off for the two migration releases." $appName) }}
{{- end }}
{{- if dig "updateStrategy" "bluegreen" false $appValues }}
{{- fail (printf "application '%s': updateStrategy.bluegreen is no longer supported; use global.strategy.canary." $appName) }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ $fullName }}{{- if contains "feature" $.Values.environment.name }}{{ end }}
  namespace: {{ $namespace }}
  labels:
    {{ include "helm.labels.dependencies" $appContext | indent 4 | trim }}
    {{ include "helm.labels.standard" $appContext | indent 4 | trim }}
    {{ include "helm.labels.version" $appContext | indent 4 | trim }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=true
    {{- if $canary }}
    {{- /* How many Rollouts of this release run canary steps; the canary-coordinator (DEVOPS-325) waits for them. */}}
    mycarrier.tech/rolloutGroupSize: {{ include "helm.canary.groupSize" $ | quote }}
    {{- /* alert-gate's watch window after promotion (D18), read by the release's rollout-watch (DEVOPS-319). */}}
    mycarrier.tech/bakeMinutes: {{ include "helm.canary.bakeMinutes" $appContext | quote }}
    {{- /* The canary's worst-case length in seconds (D22); rollout-watch times out at the release group's largest value
           plus 15 minutes (DEVOPS-319). Computed, with its checks, in every environment, and rendered only where the
           steps render (prod, or stepsOutsideProd; DEVOPS-516). */}}
    {{- $budget := include "helm.canary.budgetSeconds" $appContext }}
    {{- if eq (include "helm.canary.stepsRendered" $appContext) "true" }}
    mycarrier.tech/canaryBudgetSeconds: {{ $budget | quote }}
    {{- end }}
    {{- end }}
    {{ include "helm.annotations.gateway" $appContext | indent 4 | trim }}
spec:
  {{ include "helm.specs.rollout" $appContext | indent 2 | trim }}
---
{{- end }}
{{- end }}
