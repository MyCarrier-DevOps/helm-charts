{{/* PERFORMANCE OPTIMIZATION: Precompute global context once instead of in every helper */}}
{{- $globalCtx := include "helm.context" $ | fromJson -}}
{{- range $appName, $appValues := .Values.applications }}
{{- $appContext := (merge (dict "appName" $appName "application" $appValues "ctx" $globalCtx) $) }}
{{- if (eq $appValues.deploymentType "rollout")  }}
{{- $environment := $.Values.environment.name }}
{{- $fullName := include "helm.fullname" $appContext }}
{{- $namespace := include "helm.namespace" $ }}
{{- $standardLabels := include "helm.labels.standard" $appContext }}
{{- $versionLabels :=  include "helm.labels.version" $appContext }}
{{- $httpPort := dig "ports" "http" 8080 $appValues }}
{{- $customNames := list }}
{{- range ($appValues.analysisTemplates | default list) }}{{ $customNames = append $customNames (toString .name) }}{{ end }}
{{- $cfg := include "helm.canary.config" $appContext | fromJson }}
{{- /* The chart's own health template (DEVOPS-312) for a canary Rollout (helm.canary.enabled: the repository's
       deployment-strategy property is canary), unless analysis.health.enabled is false. It renders in every
       environment, also where the canary Rollout renders no steps (outside prod without stepsOutsideProd, DEVOPS-516)
       and nothing references it, so stepsOutsideProd changes only the Rollout; the health-path check runs in
       helm.canary.configuredSteps either way. A Rollout whose property is not canary gets none. The -preview Service's health
       endpoint must meet analysis.health.successCondition (default result == "Healthy"), read at $.status of a JSON
       body. Argo Rollouts up to v1.10.1 counts a 2xx body that is not JSON as Successful without evaluating the
       condition; argo-rollouts#4770 (merged, not yet released) evaluates it on the raw body, so an app whose health
       path serves HTML needs successCondition "true". A non-2xx answer is an error; at the default
       consecutiveErrorLimit 1, a second error in a row aborts the canary. An
       applications.<app>.analysisTemplates entry named health replaces it. The URL is resolved only when the check is
       in use, so a probe the check cannot reuse fails the render only then. */}}
{{- $wantHealth := and (eq (include "helm.canary.enabled" $appContext) "true") $cfg.analysis.health.enabled (not (has "health" $customNames)) }}
{{- $healthUrl := "" }}
{{- if $wantHealth }}{{ $healthUrl = include "helm.canary.analysis.healthUrl" $appContext }}{{ end }}
{{- if and $wantHealth $healthUrl }}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ $environment }}-{{ $fullName }}-health
  namespace: {{ $namespace }}
  labels:
    {{ $standardLabels | nindent 4 | trim }}
    {{ $versionLabels | nindent 4 | trim }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=true
spec:
  metrics:
  - name: health
    interval: {{ $cfg.analysis.health.interval }}
    count: {{ int $cfg.analysis.health.count }}
    failureLimit: 0
    consecutiveErrorLimit: {{ int $cfg.analysis.health.consecutiveErrorLimit }}
    successCondition: {{ $cfg.analysis.health.successCondition | quote }}
    provider:
      web:
        url: {{ $healthUrl }}
        jsonPath: "{$.status}"
        timeoutSeconds: 10
{{- end }}
{{- /* The chart's alerts template (DEVOPS-312, D15), in prod only (canaries run only in prod, Q42), on alert-gate's label contract
       (DEVOPS-329): alerts with the service label, the environment (prod also matches none) and a folder other than
       Platform. The Rollout runs it as background analysis from its first weight until promotion
       (helm.canary.backgroundAnalysis), so it also checks during the pauses. Two metrics:
       - alert-rules, a Job (helm.canary.alerts.rulesCheck) run twice, 30s apart, at the start: fails unless an alert
         rule that can fire matches, so a wrong service label, paused rules or no rules refuse the deploy until they
         are fixed (Q39, bcarlock 2026-10-19). A configuration error (401/403, an empty token) fails it too; a Grafana
         outage passes and is logged (Q40). It is never in dry run, and fails when either run fails (failureLimit 0),
         so a run that passes on an outage cannot hide the other run's configuration error; the Job retries a failed
         pod once (backoffLimit 1), and the script retries Grafana itself. A Job, because a web metric would store
         Grafana's whole rules document in the AnalysisRun.
       - alerts, a web metric on the Alertmanager API, every interval until promotion: fails when an alert that is not
         silenced matches (re-checked on the answer, as alert-gate does). A non-2xx answer is an error; one more than
         consecutiveErrorLimit (4) in a row fails the run. Argo Rollouts up to v1.10.1 counts a 2xx body that is not
         JSON as Successful without evaluating the condition (argo-rollouts#4770 changes that).
       Both read the Grafana token from the Secret of one ExternalSecret (vault-backend-devops reads the DevOps mount;
       vault-backend reads secrets). With analysis.alerts.dryRun (default true) the alerts metric also runs in Argo
       Rollouts dry run: results are recorded in the AnalysisRun's dryRunSummary and never fail the run. An
       applications.<app>.analysisTemplates entry named alerts replaces the template, in every environment, and also
       runs as background analysis. analysis.alerts.enabled: false turns off both. */}}
{{- $alertsEnvironment := include "helm.canary.alerts.environment" $appContext }}
{{- $wantAlerts := and (eq (include "helm.canary.enabled" $appContext) "true") $cfg.analysis.alerts.enabled (not (has "alerts" $customNames)) $alertsEnvironment }}
{{- $alertsService := "" }}
{{- if $wantAlerts }}{{ $alertsService = include "helm.canary.alerts.service" $appContext }}{{ end }}
{{- if and $wantAlerts $alertsService }}
{{- $alerts := $cfg.analysis.alerts }}
{{- $alertsName := printf "%s-%s-alerts" $environment $fullName }}
{{- $grafanaUrl := "https://grafana.mycarrier.tech" }}
{{- $alertsMatch := dict "service" $alertsService "environment" $alertsEnvironment }}
{{- $alertFilters := list (printf "service=%s" (toJson $alertsService)) (ternary `environment=~"prod|"` (printf "environment=%s" (toJson $alertsEnvironment)) (eq $alertsEnvironment "prod")) `grafana_folder!="Platform"` }}
{{- $alertsQuery := list "active=true" "silenced=false" "inhibited=true" }}
{{- range $alertFilters }}{{ $alertsQuery = append $alertsQuery (printf "filter=%s" (urlquery .)) }}{{ end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $alertsName }}
  namespace: {{ $namespace }}
  labels:
    {{ $standardLabels | nindent 4 | trim }}
    {{ $versionLabels | nindent 4 | trim }}
  annotations:
    {{- /* Before the Rollout (wave 10): Argo CD waits for it to be Ready, so a Vault read that fails stops the sync
           here instead of failing the canary's analysis. */}}
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend-devops
  target:
    name: {{ $alertsName }}
    creationPolicy: Owner
  data:
  - secretKey: token
    remoteRef:
      key: grafana/service-accounts/api/tokens
      property: {{ $alerts.tokenKey }}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ $alertsName }}
  namespace: {{ $namespace }}
  labels:
    {{ $standardLabels | nindent 4 | trim }}
    {{ $versionLabels | nindent 4 | trim }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  args:
  - name: grafana-token
    valueFrom:
      secretKeyRef:
        name: {{ $alertsName }}
        key: token
  {{- if $alerts.dryRun }}
  dryRun:
  - metricName: alerts
  {{- end }}
  metrics:
  - name: alert-rules
    count: 2
    interval: 30s
    failureLimit: 0
    provider:
      job:
        spec:
          backoffLimit: 1
          activeDeadlineSeconds: 360
          template:
            metadata:
              {{- /* Not the app's selector labels, so the pod never becomes an endpoint of the app's Service. */}}
              labels:
                app.kubernetes.io/name: {{ printf "%s-alert-rules" $fullName | trunc 63 | trimSuffix "-" }}
                app.kubernetes.io/component: canary-analysis
              annotations:
                sidecar.istio.io/inject: "false"
            spec:
              restartPolicy: Never
              {{- include "helm.podSecurityContext" (dict "Values" $.Values) | nindent 14 }}
              containers:
              - name: alert-rules
                image: {{ $alerts.image }}
                {{- /* The pod status then carries the script's last lines, including its FAIL reason. */}}
                terminationMessagePolicy: FallbackToLogsOnError
                command:
                - python3
                - -I
                - -B
                - -c
                - |
                  {{- include "helm.canary.alerts.rulesCheck" $appContext | nindent 18 }}
                env:
                - name: GRAFANA_URL
                  value: {{ $grafanaUrl }}
                - name: ALERTS_SERVICE
                  value: {{ $alertsService | quote }}
                - name: ALERTS_ENVIRONMENT
                  value: {{ $alertsEnvironment }}
                - name: GRAFANA_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $alertsName }}
                      key: token
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
                {{- include "helm.containerSecurityContext" (dict "Values" $.Values) | nindent 16 }}
  - name: alerts
    interval: {{ $alerts.interval }}
    failureLimit: 0
    consecutiveErrorLimit: {{ int $alerts.consecutiveErrorLimit }}
    failureCondition: {{ printf `any(result, {%s && !((#.status?.state ?? "") == "suppressed" && len(#.status?.silencedBy ?? []) > 0)})` (include "helm.canary.alerts.match" (merge (dict "labels" "#.labels") $alertsMatch)) | quote }}
    provider:
      web:
        url: {{ printf "%s/api/alertmanager/grafana/api/v2/alerts?%s" $grafanaUrl (join "&" $alertsQuery) | quote }}
        headers:
        - key: Authorization
          value: {{ "Bearer {{args.grafana-token}}" | quote }}
        - key: Accept
          value: application/json
        jsonPath: "{$}"
        timeoutSeconds: 15
{{- end }}
{{- /* The chart's tests template (DEVOPS-515) for a canary Rollout that lists tests in analysis.templates or references
       <environment>-<fullName>-tests in explicit steps (helm.canary.tests.wanted), unless an
       applications.<app>.analysisTemplates entry named tests replaces it. Like health, it renders in every environment
       where it is listed, also where the Rollout renders steps: [], so stepsOutsideProd changes only the Rollout. One
       Job runs the app's TestEngine suite against the -preview Service (helm.canary.tests.jobSpec) and exits 0 only when
       the run passes, so a failing suite fails the AnalysisRun and aborts the canary. TestEngine's caller contract
       (V1_TRIGGER.md rule 13): count 1, failureLimit 0 and inconclusiveLimit 0. A failed measurement fails the run. An
       inconclusive one ends the run Inconclusive: Argo Rollouts v1.10.0 records it when the Job's pod waits on
       ErrImagePull, ImagePullBackOff or InvalidImageName (the Job image, or the Vault webhook's init image). With
       inconclusiveLimit 0 the Rollout then pauses at its canary weight (PauseReasonInconclusiveAnalysis), still serving
       production traffic, with the suite never run. With more than one canary Rollout, the siblings' next barrier times
       out and canary-coordinator's cascade aborts it (about 9 minutes). With one, nothing aborts it until rollout-watch
       times out at mycarrier.tech/canaryBudgetSeconds + 15 minutes (about 93 minutes on the standard preset), publishes
       prod.rollback, and gitops-rollback reverts the release. Hence analysis.tests.image should be an ACR mirror. */}}
{{- if eq (include "helm.canary.tests.wanted" $appContext) "true" }}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ $environment }}-{{ $fullName }}-tests
  namespace: {{ $namespace }}
  labels:
    {{ $standardLabels | nindent 4 | trim }}
    {{ $versionLabels | nindent 4 | trim }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=true
spec:
  metrics:
  - name: tests
    count: 1
    failureLimit: 0
    inconclusiveLimit: 0
    provider:
      job:
        spec:
          {{- include "helm.canary.tests.jobSpec" (dict "context" $appContext "name" "tests") | nindent 10 }}
{{- end }}
{{- range $index, $template := $appValues.analysisTemplates }}
{{- /* The release-era job contract (a test container run directly against -preview, with RELEASE_ID,
       RELEASE_DEFINITION_NAME and BRANCH_NAME) is gone: canary tests run through TestEngine (DEVOPS-312). */}}
{{- if dig "provider" "job" "container" nil $template }}
{{- fail (printf "application '%s': analysisTemplates '%s' runs a test container through the job provider shorthand, which is no longer supported. Canary tests run through TestEngine (DEVOPS-312); give a full Argo Rollouts provider instead." $appName (toString $template.name)) }}
{{- end }}
{{- /* count 0 with an interval runs indefinitely, which Argo Rollouts accepts only in background analysis: an analysis
       step that references such a template leaves the Rollout InvalidSpec. Refused only for entries a step references
       (explicit steps, or the preset's health, extra analysis.templates and the dark stage's tests-dark), so a spare
       template and a replacement alerts entry (background analysis) still render. */}}
{{- if and (eq (include "helm.canary.enabled" $appContext) "true") (hasKey $template "count") (eq (int $template.count) 0) $template.interval }}
{{- $self := printf "%s-%s-%s" $environment $fullName (toString $template.name) }}
{{- $stepRefs := list }}
{{- if $cfg.steps }}
{{- range $cfg.steps }}{{ range (dig "analysis" "templates" list .) }}{{ $stepRefs = append $stepRefs (toString .templateName) }}{{ end }}{{ end }}
{{- else }}
{{- if $cfg.analysis.health.enabled }}{{ $stepRefs = append $stepRefs (printf "%s-%s-health" $environment $fullName) }}{{ end }}
{{- range $cfg.analysis.templates }}{{ $stepRefs = append $stepRefs (printf "%s-%s-%s" $environment $fullName .) }}{{ end }}
{{- if and $cfg.coordinator.enabled $cfg.dark }}{{ $stepRefs = append $stepRefs (printf "%s-%s-tests-dark" $environment $fullName) }}{{ end }}
{{- end }}
{{- if has $self $stepRefs }}
{{- fail (printf "application '%s': analysisTemplates '%s' has count 0 and an interval, so it runs indefinitely, and an analysis step references it; Argo Rollouts refuses that and leaves the Rollout InvalidSpec. Set a count above 0." $appName (toString $template.name)) }}
{{- end }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  {{- /* <environment>-<fullName>-<name>: the name the canary analysis steps reference (helm.canary.configuredSteps),
         unique per app in a shared namespace. */}}
  name: {{ $environment }}-{{ $fullName }}-{{ $template.name }}
  namespace: {{ $namespace }}
  labels:
    {{ $standardLabels | nindent 4 | trim }}
    {{ $versionLabels | nindent 4 | trim }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=true
spec:
  metrics:
  - name: {{ $environment }}-{{ $template.name }}
    {{- /* An explicit count is kept as written: count 0 (with an interval) is how a background analysis, such as a
           replacement alerts entry, runs until promotion; Sprig's default would turn 0 into 1. */}}
    count: {{ hasKey $template "count" | ternary $template.count 1 }}
    failureLimit: {{ $template.failureLimit | default 0 }}
    {{- with $template.interval }}
    interval: {{ . }}
    {{- end }}
    {{- if hasKey $template "consecutiveErrorLimit" }}
    consecutiveErrorLimit: {{ int $template.consecutiveErrorLimit }}
    {{- end }}
    {{- /* Only the web shorthand and a raw job provider are supported (values.schema.json): a query provider would need
           metric-level conditions, and with none Argo Rollouts counts every measurement as Successful. */}}
    {{- if and (kindIs "map" $template.provider) (hasKey $template.provider "web") }}
    {{- $web := $template.provider.web | default dict }}
    {{- /* Default: the -preview Service port that reaches the http container port (service.ports may remap it). */}}
    {{- $previewPort := include "helm.canary.previewPort" (dict "application" $appValues "port" $httpPort) | default $httpPort }}
    {{- $base := $web.url | default (printf "http://%s-preview.%s.svc.cluster.local:%v" $fullName $namespace $previewPort) }}
    {{- $url := $base }}
    {{- if $web.statusEndpoint }}
    {{- $url = printf "%s/%s" (trimSuffix "/" $base) (trimPrefix "/" $web.statusEndpoint) }}
    {{- else if not $web.url }}
    {{- $url = printf "%s/health" $base }}
    {{- end }}
    successCondition: {{ $web.successCondition | default `result == "Healthy"` | quote }}
    provider:
      web:
        url: {{ $url }}
        jsonPath: {{ $web.jsonPath | default "{$.status}" | quote }}
        {{- with $web.timeoutSeconds }}
        timeoutSeconds: {{ int . }}
        {{- end }}
    {{- else if and (kindIs "map" $template.provider) (hasKey $template.provider "job") }}
    provider:
      {{- toYaml $template.provider | nindent 6 }}
    {{- else }}
    {{- fail (printf "application '%s': analysisTemplates '%s' needs provider web or job; other metric providers are not supported" $appName (toString $template.name)) }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
