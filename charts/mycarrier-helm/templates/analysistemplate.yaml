{{/* PERFORMANCE OPTIMIZATION: Precompute global context once instead of in every helper */}}
{{- $globalCtx := include "helm.context" $ | fromJson -}}
{{- range $appName, $appValues := .Values.applications }}
{{- $appContext := (merge (dict "appName" $appName "application" $appValues "ctx" $globalCtx) $) }}
{{- if (eq $appValues.deploymentType "rollout")  }}
{{- $environment := $.Values.environment.name }}
{{- $fullName := include "helm.fullname" $appContext }}
{{- $namespace := include "helm.namespace" $ }}
{{- $standardLabels := include "helm.labels.standard" $appContext }}
{{- $versionLabels :=  include "helm.labels.version" $appContext }}
{{- $httpPort := dig "ports" "http" 8080 $appValues }}
{{- $customNames := list }}
{{- range ($appValues.analysisTemplates | default list) }}{{ $customNames = append $customNames (toString .name) }}{{ end }}
{{- $cfg := include "helm.canary.config" $appContext | fromJson }}
{{- /* The chart's own health template (DEVOPS-312) for a Rollout that runs canary steps with analysis on: the -preview
       Service's health endpoint must meet analysis.health.successCondition (default result == "Healthy"), read at
       $.status of a JSON body. Argo Rollouts up to v1.10.1 counts a 2xx body that is not JSON as Successful without
       evaluating the condition; argo-rollouts#4770 (merged, not yet released) evaluates it on the raw body, so an app
       whose health path serves HTML needs successCondition "true". A non-2xx answer is an error; at the default
       consecutiveErrorLimit 1, a second error in a row aborts the canary. An applications.<app>.analysisTemplates entry named health replaces it. The URL is resolved only
       when the check is in use, so a probe the check cannot reuse fails the render only then. */}}
{{- $wantHealth := and (eq (include "helm.canary.enabled" $appContext) "true") $cfg.analysis.enabled (has "health" $cfg.analysis.templates) (not (has "health" $customNames)) }}
{{- $healthUrl := "" }}
{{- if $wantHealth }}{{ $healthUrl = include "helm.canary.analysis.healthUrl" $appContext }}{{ end }}
{{- if and $wantHealth $healthUrl }}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ $environment }}-{{ $fullName }}-health
  namespace: {{ $namespace }}
  labels:
    {{ $standardLabels | nindent 4 | trim }}
    {{ $versionLabels | nindent 4 | trim }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=true
spec:
  metrics:
  - name: health
    interval: {{ $cfg.analysis.health.interval }}
    count: {{ int $cfg.analysis.health.count }}
    failureLimit: 0
    consecutiveErrorLimit: {{ int $cfg.analysis.health.consecutiveErrorLimit }}
    successCondition: {{ $cfg.analysis.health.successCondition | quote }}
    provider:
      web:
        url: {{ $healthUrl }}
        jsonPath: "{$.status}"
        timeoutSeconds: 10
{{- end }}
{{- /* The chart's alerts template (DEVOPS-312, D15), in prod and preprod only, on alert-gate's label contract
       (DEVOPS-329): firing alerts with the service label, the environment (prod also matches none) and a folder other
       than Platform. Two metrics:
       - alert-rules, a Job run once per analysis step (helm.canary.alerts.rulesCheck): fails unless at least one alert
         rule that can fire matches, so a wrong service label cannot leave the check green. A Job, because a web metric
         would store Grafana's whole rules document in the AnalysisRun; its token comes from Vault through bank-vaults.
       - alerts, a web metric on the Alertmanager API: fails when an alert that is not silenced matches (re-checked on
         the answer, as alert-gate does). The token reaches it from the Secret of an ExternalSecret, because Argo
         Rollouts resolves web metric headers from AnalysisTemplate args. A non-2xx answer is an error; at the default
         consecutiveErrorLimit 1, a second error in a row aborts the canary. Argo Rollouts up to v1.10.1 counts a 2xx
         body that is not JSON as Successful without evaluating the condition (argo-rollouts#4770 changes that).
       An applications.<app>.analysisTemplates entry named alerts replaces it. */}}
{{- $alertsEnvironment := include "helm.canary.alerts.environment" $appContext }}
{{- $wantAlerts := and (eq (include "helm.canary.enabled" $appContext) "true") $cfg.analysis.enabled (has "alerts" $cfg.analysis.templates) (not (has "alerts" $customNames)) $alertsEnvironment }}
{{- $alertsService := "" }}
{{- if $wantAlerts }}{{ $alertsService = include "helm.canary.alerts.service" $appContext }}{{ end }}
{{- if and $wantAlerts $alertsService }}
{{- $alerts := $cfg.analysis.alerts }}
{{- $alertsName := printf "%s-%s-alerts" $environment $fullName }}
{{- $grafanaUrl := "https://grafana.mycarrier.tech" }}
{{- $alertsMatch := dict "service" $alertsService "environment" $alertsEnvironment }}
{{- $alertFilters := list (printf "service=%s" (toJson $alertsService)) (ternary `environment=~"prod|"` (printf "environment=%s" (toJson $alertsEnvironment)) (eq $alertsEnvironment "prod")) `grafana_folder!="Platform"` }}
{{- $alertsQuery := list "active=true" "silenced=false" "inhibited=true" }}
{{- range $alertFilters }}{{ $alertsQuery = append $alertsQuery (printf "filter=%s" (urlquery .)) }}{{ end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $alertsName }}
  namespace: {{ $namespace }}
  labels:
    {{ $standardLabels | nindent 4 | trim }}
    {{ $versionLabels | nindent 4 | trim }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    {{- /* vault-backend reads the secrets mount; the Grafana token is in the DevOps mount. */}}
    name: vault-backend-devops
  target:
    name: {{ $alertsName }}
    creationPolicy: Owner
  data:
  - secretKey: token
    remoteRef:
      key: grafana/service-accounts/api/tokens
      property: ci-alert-gate
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ $alertsName }}
  namespace: {{ $namespace }}
  labels:
    {{ $standardLabels | nindent 4 | trim }}
    {{ $versionLabels | nindent 4 | trim }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  args:
  - name: grafana-token
    valueFrom:
      secretKeyRef:
        name: {{ $alertsName }}
        key: token
  metrics:
  - name: alert-rules
    count: 1
    failureLimit: 0
    provider:
      job:
        spec:
          backoffLimit: 0
          activeDeadlineSeconds: 180
          template:
            metadata:
              {{- /* Not the app's selector labels, so the pod never becomes an endpoint of the app's Service. */}}
              labels:
                app.kubernetes.io/name: {{ printf "%s-alert-rules" $fullName | trunc 63 | trimSuffix "-" }}
                app.kubernetes.io/component: canary-analysis
              annotations:
                sidecar.istio.io/inject: "false"
                {{- include "helm.annotations.vault" dict | nindent 16 }}
            spec:
              restartPolicy: Never
              {{- include "helm.podSecurityContext" (dict "Values" $.Values) | nindent 14 }}
              containers:
              - name: alert-rules
                image: python:3.13.15-alpine3.23
                command:
                - python3
                - -I
                - -B
                - -c
                - |
                  {{- include "helm.canary.alerts.rulesCheck" $appContext | nindent 18 }}
                env:
                - name: GRAFANA_URL
                  value: {{ $grafanaUrl }}
                - name: ALERTS_SERVICE
                  value: {{ $alertsService | quote }}
                - name: ALERTS_ENVIRONMENT
                  value: {{ $alertsEnvironment }}
                - name: GRAFANA_API_KEY
                  value: vault:DevOps/data/grafana/service-accounts/api/tokens#ci-alert-gate
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
                {{- include "helm.containerSecurityContext" (dict "Values" $.Values) | nindent 16 }}
  - name: alerts
    interval: {{ $alerts.interval }}
    count: {{ int $alerts.count }}
    failureLimit: 0
    consecutiveErrorLimit: {{ int $alerts.consecutiveErrorLimit }}
    failureCondition: {{ printf `any(result, {%s && !((#.status?.state ?? "") == "suppressed" && len(#.status?.silencedBy ?? []) > 0)})` (include "helm.canary.alerts.match" (merge (dict "labels" "#.labels") $alertsMatch)) | quote }}
    provider:
      web:
        url: {{ printf "%s/api/alertmanager/grafana/api/v2/alerts?%s" $grafanaUrl (join "&" $alertsQuery) | quote }}
        headers:
        - key: Authorization
          value: {{ "Bearer {{args.grafana-token}}" | quote }}
        - key: Accept
          value: application/json
        jsonPath: "{$}"
        timeoutSeconds: 15
{{- end }}
{{- range $index, $template := $appValues.analysisTemplates }}
{{- /* The release-era job contract (a test container run directly against -preview, with RELEASE_ID,
       RELEASE_DEFINITION_NAME and BRANCH_NAME) is gone: canary tests run through TestEngine (DEVOPS-312). */}}
{{- if dig "provider" "job" "container" nil $template }}
{{- fail (printf "application '%s': analysisTemplates '%s' runs a test container through the job provider shorthand, which is no longer supported. Canary tests run through TestEngine (DEVOPS-312); give a full Argo Rollouts provider instead." $appName (toString $template.name)) }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  {{- /* <environment>-<fullName>-<name>: the name the canary analysis steps reference (helm.canary.steps), unique per
         app in a shared namespace. */}}
  name: {{ $environment }}-{{ $fullName }}-{{ $template.name }}
  namespace: {{ $namespace }}
  labels:
    {{ $standardLabels | nindent 4 | trim }}
    {{ $versionLabels | nindent 4 | trim }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=true
spec:
  metrics:
  - name: {{ $environment }}-{{ $template.name }}
    count: {{ $template.count | default 1 }}
    failureLimit: {{ $template.failureLimit | default 0 }}
    {{- with $template.interval }}
    interval: {{ . }}
    {{- end }}
    {{- if hasKey $template "consecutiveErrorLimit" }}
    consecutiveErrorLimit: {{ int $template.consecutiveErrorLimit }}
    {{- end }}
    {{- /* Only the web shorthand and a raw job provider are supported (values.schema.json): a query provider would need
           metric-level conditions, and with none Argo Rollouts counts every measurement as Successful. */}}
    {{- if and (kindIs "map" $template.provider) (hasKey $template.provider "web") }}
    {{- $web := $template.provider.web | default dict }}
    {{- /* Default: the -preview Service port that reaches the http container port (service.ports may remap it). */}}
    {{- $previewPort := include "helm.canary.previewPort" (dict "application" $appValues "port" $httpPort) | default $httpPort }}
    {{- $base := $web.url | default (printf "http://%s-preview.%s.svc.cluster.local:%v" $fullName $namespace $previewPort) }}
    {{- $url := $base }}
    {{- if $web.statusEndpoint }}
    {{- $url = printf "%s/%s" (trimSuffix "/" $base) (trimPrefix "/" $web.statusEndpoint) }}
    {{- else if not $web.url }}
    {{- $url = printf "%s/health" $base }}
    {{- end }}
    successCondition: {{ $web.successCondition | default `result == "Healthy"` | quote }}
    provider:
      web:
        url: {{ $url }}
        jsonPath: {{ $web.jsonPath | default "{$.status}" | quote }}
        {{- with $web.timeoutSeconds }}
        timeoutSeconds: {{ int . }}
        {{- end }}
    {{- else if and (kindIs "map" $template.provider) (hasKey $template.provider "job") }}
    provider:
      {{- toYaml $template.provider | nindent 6 }}
    {{- else }}
    {{- fail (printf "application '%s': analysisTemplates '%s' needs provider web or job; other metric providers are not supported" $appName (toString $template.name)) }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
