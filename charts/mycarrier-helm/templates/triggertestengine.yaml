{{/* PERFORMANCE OPTIMIZATION: Precompute global context once instead of in every helper */}}
{{- $globalCtx := include "helm.context" $ | fromJson -}}
{{- range $appName, $appValues := .Values.applications }}
{{- $appContext := (merge (dict "appName" $appName "application" $appValues "ctx" $globalCtx) $) }}
{{- $domainPrefix := include "helm.domain.prefix" $ }}
{{- $namespace := include "helm.namespace" $ }}
{{- $fullName := include "helm.fullname" $appContext }}
{{- if .testtrigger }}
{{- /* DEVOPS-629: enableV1: false selected one call per test definition to TestEngine's legacy POST /trigger, which is
       removed (DEVOPS-623). Every trigger now goes to the v1 trigger (or v2, with testEnvironmentTag), so false fails
       the render for every application, with or without test definitions, before anything else renders for it. */}}
{{- if not (dig "testtrigger" "enableV1" true $appValues) }}
{{- fail (printf "application '%s': testtrigger.enableV1: false is not supported. TestEngine's legacy POST /trigger is removed (DEVOPS-623), so the chart sends every test trigger to TestEngine's v1 trigger, or to its v2 trigger for test definitions with testEnvironmentTag. Remove applications.%s.testtrigger.enableV1, or set it to true." $appName $appName) }}
{{- end }}
{{- /* A prod canary Rollout gets no PostSync hook (Tech Spec D7): the hook can fire at the start of a canary sync, after
       the last promote or after an abort, so it could test the wrong version. The release's rollout-watch starts
       prod_tests after promotion instead (DEVOPS-319): it posts request.json from the <fullName>-prod-tests ConfigMap
       labelled with this release's correlation id, the same v1 request the hook sends (helm.testtrigger.v1request).
       It posts with the shared key and the Management-cluster URL, so
       a per-application key or a TestEngine URL override fails the render instead of being ignored. The ConfigMap
       never renders where the hook does, so prod_tests never starts twice.
       AQA-38: an application whose test definitions set testEnvironmentTag goes to TestEngine's v2 trigger
       (helm.testtrigger.version): request.json then holds the v2 request (helm.testtrigger.v2request), and the key
       version, v2, tells rollout-watch to post it to /v2/trigger. Without the key the request is v1, as before; a
       rollout-watch that does not read it posts the v2 request to /v1/trigger, which refuses it with a 422. */}}
{{- $triggerVersion := include "helm.testtrigger.version" $appContext }}
{{- if eq (include "helm.canary.prodTestsByRolloutWatch" $appContext) "true" }}
{{- /* AQA-38: rollout-watch's start-prod-tests does not read the ConfigMap's version key yet (DEVOPS-613). It would post
       the v2 request to /v1/trigger, which refuses it with a 422, and the prod tests would not run. Remove this check once
       DEVOPS-613 ships (rollout-watch posts a version: v2 request to /v2/trigger), and bring back the unit tests that
       assert the v2 ConfigMap; the v2 branch of the ConfigMap below is ready for it. */}}
{{- if eq $triggerVersion "v2" }}
{{- fail (printf "application '%s': a Rollout in prod cannot use testEnvironmentTag yet. The chart renders no PostSync hook for it: the release's rollout-watch starts prod_tests after promotion and posts to TestEngine's v1 trigger only until DEVOPS-613, which refuses a v2 request with a 422, so its prod tests would not run. Keep filters on applications.%s.testtrigger.testdefinitions in the prod values." $appName $appName) }}
{{- end }}
{{- $apikey := dig "testtrigger" "apikey" "" $appValues | default "" | toString }}
{{- if and $apikey (ne $apikey "vault:DevOps/data/testengine/api#encoded_header") }}
{{- fail (printf "application '%s': testtrigger.apikey must be vault:DevOps/data/testengine/api#encoded_header or unset for a Rollout in prod. The chart renders no PostSync hook for it: the release's rollout-watch starts prod_tests after promotion with that shared key (DEVOPS-319), so a per-application key would not be used. Remove testtrigger.apikey, or set it to vault:DevOps/data/testengine/api#encoded_header." $appName) }}
{{- end }}
{{- if (dig "testengineWebhookUrl" "" ($.Values.global | default dict)) }}
{{- fail (printf "application '%s': global.testengineWebhookUrl cannot be set in prod while a Rollout has a testtrigger. The chart renders no PostSync hook for the Rollout: the release's rollout-watch starts prod_tests after promotion through TestEngine's v1 trigger on the Management cluster (DEVOPS-319), so the URL would not be used. Remove global.testengineWebhookUrl from the prod values." $appName) }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-prod-tests
  namespace: {{ $namespace }}
  labels:
    {{ include "helm.labels.dependencies" $appContext | indent 4 | trim }}
    {{ include "helm.labels.standard" $appContext | indent 4 | trim }}
    {{ include "helm.labels.version" $appContext | indent 4 | trim }}
data:
  request.json: |-
  {{- if eq $triggerVersion "v2" }}
    {{- include "helm.testtrigger.v2request" $appContext | nindent 4 }}
  version: v2
  {{- else }}
    {{- include "helm.testtrigger.v1request" $appContext | nindent 4 }}
  {{- end }}
{{- else }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullName }}-trigger
  namespace: {{ $namespace }}
  labels:
    {{ include "helm.labels.dependencies" $appContext | indent 4 | trim }}
    {{ include "helm.labels.standard" $appContext | indent 4 | trim }}
    {{ include "helm.labels.version" $appContext | indent 4 | trim }}
  annotations:
    argocd.argoproj.io/sync-wave: "1000"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed
    {{ include "helm.annotations.vault" . | indent 4 | trim }}
spec:
  {{ include "helm.specs.testenginehook" $appContext | indent 2 | trim }}
{{- end }}
{{- end }}
{{- end }}