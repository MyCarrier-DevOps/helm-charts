suite: allowed endpoints by namespace - enforced everywhere except the plain dev namespace, with Swagger on dev/feature only and an allowAllEndpoints escape hatch
templates:
  - templates/virtualService.yaml
tests:
  - it: should NOT render allowed endpoints in dev namespace
    set:
      global:
        appStack: test-stack
        language: csharp
      environment:
        name: dev
      namespace: dev
      applications:
        test-app:
          deploymentType: deployment
          image:
            registry: mycarrieracr.azurecr.io
            repository: test/app
            tag: latest
          networking:
            istio:
              enabled: true
              offloadOperatorEnabled: false
              allowedEndpoints:
                - "/api/health"
                - "/api/status"
          service:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
    asserts:
      - isKind:
          of: VirtualService
      - equal:
          path: metadata.namespace
          value: dev
      # Should have the basic route configuration (spec.http[1])
      - equal:
          path: spec.http[0].name
          value: test-stack-test-app
      - equal:
          path: spec.http[1].name
          value: test-stack-test-app-feature-routing
      - equal:
          path: spec.http[2].name
          value: test-stack-test-app-default
      # Should have a route section
      - exists:
          path: spec.http[2].route
      # Should NOT have the forbidden endpoint (which would appear beyond spec.http[2])
      - notExists:
          path: spec.http[3]

  - it: should render allowed endpoints in feature20 namespace
    set:
      global:
        appStack: test-stack
        language: csharp
      environment:
        name: feature20
      namespace: feature20
      applications:
        test-app:
          deploymentType: deployment
          image:
            registry: mycarrieracr.azurecr.io
            repository: test/app
            tag: latest
          networking:
            istio:
              enabled: true
              offloadOperatorEnabled: false
              allowedEndpoints:
                - "/api/health"
                - "/api/status"
          service:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
    documentIndex: 0
    asserts:
      - isKind:
          of: VirtualService
      - equal:
          path: metadata.namespace
          value: feature20
      # Feature namespaces still lead with the exact header match for their branch
      - equal:
          path: spec.http[0].match[0].headers.environment.exact
          value: feature20
      # Feature environments now enforce the allowlist, so unlisted paths are refused at the
      # gateway instead of being proxied to the pod.
      - equal:
          path: spec.http[1].name
          value: test-stack-test-app-feature20-allowed-liveness
      - equal:
          path: spec.http[4].name
          value: test-stack-test-app-feature20-allowed-api-health
      - equal:
          path: spec.http[6].name
          value: test-stack-test-app-feature20-forbidden
      - equal:
          path: spec.http[6].fault.abort.httpStatus
          value: 403

  - it: should allow Swagger on a feature namespace but never on preprod
    set:
      global:
        appStack: test-stack
        language: csharp
      environment:
        name: feature20
      namespace: feature20
      applications:
        test-app:
          deploymentType: deployment
          image:
            registry: mycarrieracr.azurecr.io
            repository: test/app
            tag: latest
          networking:
            istio:
              enabled: true
              offloadOperatorEnabled: false
          service:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
    documentIndex: 0
    asserts:
      - equal:
          path: spec.http[3].name
          value: test-stack-test-app-feature20-allowed-swagger
      - equal:
          path: spec.http[3].match[0].uri.prefix
          value: /swagger

  - it: should not allow Swagger in preprod
    set:
      global:
        appStack: test-stack
        language: csharp
      environment:
        name: preprod
      namespace: preprod
      applications:
        test-app:
          deploymentType: deployment
          image:
            registry: mycarrieracr.azurecr.io
            repository: test/app
            tag: latest
          networking:
            istio:
              enabled: true
          service:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
    documentIndex: 0
    asserts:
      # Swagger must never be reachable outside dev/feature, so no allowed-swagger rule exists.
      - notMatchRegex:
          path: spec.http[1].name
          pattern: swagger
      - notMatchRegex:
          path: spec.http[2].name
          pattern: swagger
      - notMatchRegex:
          path: spec.http[3].name
          pattern: swagger

  - it: allowAllEndpoints should restore the unrestricted catch-all on a feature namespace
    set:
      global:
        appStack: test-stack
        language: csharp
      environment:
        name: feature20
      namespace: feature20
      applications:
        test-app:
          deploymentType: deployment
          image:
            registry: mycarrieracr.azurecr.io
            repository: test/app
            tag: latest
          networking:
            istio:
              enabled: true
              offloadOperatorEnabled: false
              allowAllEndpoints: true
          service:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
    documentIndex: 0
    asserts:
      # Back to the pre-allowlist shape: header match, then a single default fallback route.
      - equal:
          path: spec.http[0].match[0].headers.environment.exact
          value: feature20
      - exists:
          path: spec.http[1].match[0].withoutHeaders.environment
      - notExists:
          path: spec.http[2]

  - it: allowAllEndpoints must be rejected outright in preprod
    set:
      global:
        appStack: test-stack
        language: csharp
      environment:
        name: preprod
      namespace: preprod
      applications:
        test-app:
          deploymentType: deployment
          image:
            registry: mycarrieracr.azurecr.io
            repository: test/app
            tag: latest
          networking:
            istio:
              enabled: true
              allowAllEndpoints: true
          service:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
    asserts:
      # The escape hatch is dev/feature only. Rather than silently ignoring it outside those,
      # the render is rejected so the mistake surfaces instead of looking effective.
      # allow_all_endpoints_guardrail_test.yaml covers this across every environment.
      - failedTemplate:
          errorPattern: applications\.test-app\.networking\.istio\.allowAllEndpoints

  - it: should render allowed endpoints in preprod namespace
    set:
      global:
        appStack: test-stack
        language: csharp
      environment:
        name: preprod
      namespace: preprod
      applications:
        test-app:
          deploymentType: deployment
          image:
            registry: mycarrieracr.azurecr.io
            repository: test/app
            tag: latest
          networking:
            istio:
              enabled: true
              allowedEndpoints:
                - "/api/health"
                - "/api/status"
          service:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
    asserts:
      - isKind:
          of: VirtualService
      - equal:
          path: metadata.namespace
          value: preprod
      # Should have allowed endpoint rules
      - exists:
          path: spec.http[1].match[0].uri
      # Should have multiple http rules (more than just the basic route)
      - exists:
          path: spec.http[2]

  - it: should render allowed endpoints in prod namespace
    set:
      global:
        appStack: test-stack
        language: csharp
      environment:
        name: prod
      namespace: prod
      applications:
        test-app:
          deploymentType: deployment
          image:
            registry: mycarrieracr.azurecr.io
            repository: test/app
            tag: latest
          networking:
            istio:
              enabled: true
              allowedEndpoints:
                - "/api/health"
                - "/api/status"
          service:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
    asserts:
      - isKind:
          of: VirtualService
      - equal:
          path: metadata.namespace
          value: prod
      # Should have allowed endpoint rules
      - exists:
          path: spec.http[1].match[0].uri
      # Should have multiple http rules (more than just the basic route)
      - exists:
          path: spec.http[2]

  - it: dev namespace with language-specific default endpoints should also NOT render allowedEndpoints
    set:
      global:
        appStack: test-stack
        language: csharp
      environment:
        name: dev
      namespace: dev
      applications:
        test-app:
          deploymentType: deployment
          image:
            registry: mycarrieracr.azurecr.io
            repository: test/app
            tag: latest
          networking:
            istio:
              enabled: true
              offloadOperatorEnabled: false
              # No custom allowedEndpoints, but C# has defaults: /liveness, /health, /api
          service:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
    asserts:
      - isKind:
          of: VirtualService
      - equal:
          path: metadata.namespace
          value: dev
      # Should have the basic route configuration
      - equal:
          path: spec.http[0].name
          value: test-stack-test-app
      - equal:
          path: spec.http[1].name
          value: test-stack-test-app-feature-routing
      - equal:
          path: spec.http[2].name
          value: test-stack-test-app-default
      # Should have a route section
      - exists:
          path: spec.http[2].route
      # Should NOT have multiple endpoint rules (just the basic route)
      - notExists:
          path: spec.http[3]

  - it: dev namespace without any endpoints should render basic route
    set:
      global:
        appStack: test-stack
        language: nodejs
      environment:
        name: dev
      namespace: dev
      applications:
        test-app:
          deploymentType: deployment
          image:
            registry: mycarrieracr.azurecr.io
            repository: test/app
            tag: latest
          networking:
            istio:
              enabled: true
              offloadOperatorEnabled: false
              # No allowedEndpoints
          service:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
    asserts:
      - isKind:
          of: VirtualService
      - equal:
          path: metadata.namespace
          value: dev
      # Should have the basic route configuration
      - equal:
          path: spec.http[0].name
          value: test-stack-test-app
      - equal:
          path: spec.http[1].name
          value: test-stack-test-app-feature-routing
      - equal:
          path: spec.http[2].name
          value: test-stack-test-app-default
      # Should have a route section
      - exists:
          path: spec.http[2].route
      # Should have destination host
      - equal:
          path: spec.http[2].route[0].destination.host
          value: "test-stack-test-app.dev.svc.cluster.local"

  - it: preprod namespace should respect allowedEndpoints when explicitly defined
    set:
      global:
        appStack: insurance
        language: csharp
      environment:
        name: preprod
      namespace: preprod
      applications:
        api:
          deploymentType: deployment
          image:
            registry: mycarrieracr.azurecr.io
            repository: insurance/api
            tag: v1.0.0
          networking:
            istio:
              enabled: true
              allowedEndpoints:
                - "/api/v1/health"
                - "/api/v1/ready"
          service:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
    asserts:
      - isKind:
          of: VirtualService
      - equal:
          path: metadata.namespace
          value: preprod
      # Should have endpoint matching rules
      - exists:
          path: spec.http[1].match[0].uri

  - it: feature20 namespace with no allowedEndpoints
    set:
      global:
        appStack: insurance
        language: csharp
      environment:
        name: feature20
      namespace: feature20
      applications:
        api:
          deploymentType: deployment
          image:
            registry: mycarrieracr.azurecr.io
            repository: insurance/api
            tag: v1.0.0
          networking:
            istio:
              enabled: true
              offloadOperatorEnabled: false
              # C# has default endpoints: /liveness, /health, /api
          service:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
    documentIndex: 0
    asserts:
      - isKind:
          of: VirtualService
      - equal:
          path: metadata.namespace
          value: feature20
      # Shoul NOT have endpoint matching rules from language defaults (starting at http[0] for feature envs)
      - notExists:
          path: spec.http[0].match[0].uri
