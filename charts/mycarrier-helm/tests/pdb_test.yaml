suite: PodDisruptionBudget template tests
templates:
  - pdb.yaml
tests:
  - it: should not create a PDB when not configured
    set:
      environment.name: "prod"
      applications.test-app-api.deploymentType: deployment
      applications.test-app-api.image.registry: "myregistry.example.com"
      applications.test-app-api.image.repository: "mycarrier/test-app-api"
      applications.test-app-api.image.tag: "1.0.0"
      applications.test-app-api.ports.http: 8080
    asserts:
      - hasDocuments:
          count: 0

  - it: should create a PDB with minAvailable for a deployment
    set:
      environment.name: "prod"
      applications.test-app-api.deploymentType: deployment
      applications.test-app-api.image.registry: "myregistry.example.com"
      applications.test-app-api.image.repository: "mycarrier/test-app-api"
      applications.test-app-api.image.tag: "1.0.0"
      applications.test-app-api.ports.http: 8080
      applications.test-app-api.podDisruptionBudget.minAvailable: 1
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: apiVersion
          value: policy/v1
      - equal:
          path: metadata.name
          value: app-test-app-api
      - equal:
          path: spec.minAvailable
          value: 1
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: app-test-app-api
      - notExists:
          path: spec.maxUnavailable

  - it: should create a PDB with maxUnavailable for a statefulset
    set:
      environment.name: "prod"
      applications.test-app-api.deploymentType: statefulset
      applications.test-app-api.image.registry: "myregistry.example.com"
      applications.test-app-api.image.repository: "mycarrier/test-app-api"
      applications.test-app-api.image.tag: "1.0.0"
      applications.test-app-api.ports.http: 8080
      applications.test-app-api.podDisruptionBudget.maxUnavailable: 1
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable

  - it: should accept a percentage string for maxUnavailable on a rollout
    set:
      environment.name: "prod"
      applications.test-app-api.deploymentType: rollout
      applications.test-app-api.image.registry: "myregistry.example.com"
      applications.test-app-api.image.repository: "mycarrier/test-app-api"
      applications.test-app-api.image.tag: "1.0.0"
      applications.test-app-api.ports.http: 8080
      applications.test-app-api.podDisruptionBudget.maxUnavailable: "25%"
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.maxUnavailable
          value: "25%"

  - it: should reject configuring both minAvailable and maxUnavailable via schema validation
    set:
      environment.name: "prod"
      applications.test-app-api.deploymentType: deployment
      applications.test-app-api.image.registry: "myregistry.example.com"
      applications.test-app-api.image.repository: "mycarrier/test-app-api"
      applications.test-app-api.image.tag: "1.0.0"
      applications.test-app-api.ports.http: 8080
      applications.test-app-api.podDisruptionBudget.minAvailable: 1
      applications.test-app-api.podDisruptionBudget.maxUnavailable: 1
    asserts:
      - failedTemplate:
          errorPattern: "applications[./]test-app-api[./]podDisruptionBudget"
