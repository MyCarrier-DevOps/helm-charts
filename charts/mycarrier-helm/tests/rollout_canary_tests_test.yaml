                containerTag: 1.0.0
                secretId: vault:QA/data/app_auth#SecretId
                filters: [TestCategory=CoreAPI, TestCategory=PreprodSmoke&TestCategory=CoreAPI]
    asserts:
      - failedTemplate:
          errorPattern: "application 'api': test definition 'apitests' has the filter 'TestCategory=PreprodSmoke&TestCategory=CoreAPI', whose first TestCategory starts with preprod"

  - it: fails a single prod filter string that starts with preprod
    template: analysistemplate.yaml
    set:
      <<: *prod
      applications:
        api:
          <<: *api
          testtrigger:
            testdefinitions:
              - name: apitests
                containerImage: testing/mycarrier/api/tests
                containerTag: 1.0.0
                secretId: vault:QA/data/app_auth#SecretId
                filters: preprod_smoke
    asserts:
      - failedTemplate:
          errorPattern: "has the filter 'preprod_smoke', whose first TestCategory starts with preprod"

  - it: accepts a preprod category that is not first, a Vault filter in prod, and a preprod filter outside prod
    template: analysistemplate.yaml
    set:
      <<: *prod
      applications:
        api:
          <<: *api
          testtrigger:
            testdefinitions:
              - name: apitests
                containerImage: testing/mycarrier/api/tests
                containerTag: 1.0.0
                secretId: vault:QA/data/app_auth#SecretId
                filters: [TestCategory=CoreAPI&TestCategory=PreprodSmoke]
              - name: vaulttests
                containerImage: testing/mycarrier/api/tests
                containerTag: 1.0.0
                secretId: vault:QA/data/app_auth#SecretId
                filters: vault:QA/data/prod/mycarrier#categoryfilters
    asserts:
      - hasDocuments:
          count: 4

  - it: accepts a preprod filter in preprod
    template: analysistemplate.yaml
    set:
      global: *global
      environment:
        name: preprod
      applications:
        api:
          <<: *api
          testtrigger:
            testdefinitions:
              - name: apitests
                containerImage: testing/mycarrier/api/tests
                containerTag: 1.0.0
                secretId: vault:QA/data/app_auth#SecretId
                filters: [TestCategory=PreprodSmoke]
    asserts:
      - hasDocuments:
          count: 2

  # Values: analysis.tests takes only timeout (a duration) and image (a string).
  - it: refuses a tests.timeout that is not a duration
    template: analysistemplate.yaml
    set:
      <<: *prod
      global:
        <<: *global
        strategy:
          canary:
            analysis:
              templates: [tests]
              tests:
                timeout: 8 minutes
    asserts:
      - failedTemplate:
          errorPattern: "timeout.*does not match pattern"

  - it: refuses a tests.image that is not a string
    template: analysistemplate.yaml
    set:
      <<: *prod
      global:
        <<: *global
        strategy:
          canary:
            analysis:
              templates: [tests]
              tests:
                image: 5
    asserts:
      - failedTemplate:
          errorPattern: "image.*(expected string|got number)"

  - it: refuses an unknown key under analysis.tests
    template: analysistemplate.yaml
    set:
      <<: *prod
      global:
        <<: *global
        strategy:
          canary:
            analysis:
              templates: [tests]
              tests:
                pollInterval: 5s
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'pollInterval' not allowed"

  - it: fails a zero tests.timeout
    template: rollout.yaml
    set:
      <<: *prod
      global:
        <<: *global
        strategy:
          canary:
            analysis:
              templates: [tests]
              tests:
                timeout: 0s
    asserts:
      - failedTemplate:
          errorPattern: "global.strategy.canary.analysis.tests.timeout is '0s'; the tests template needs a duration above zero"

  # DEVOPS-310 (#156): only a canary Rollout (global.deploymentStrategy canary) gets the tests template and its checks,
  # as for the chart's health and alerts templates. A rolling or unset property ignores tests, also with values that
  # would fail every tests check: no test definitions, a literal key, a preprod filter, a foreign serviceAddress, the
  # dark stage, the coordinator off with two Rollouts, no correlationId and a timeout past the barrier window.
  - it: renders no tests template and runs no tests check for a Rollout whose property is not canary
    template: analysistemplate.yaml
    set: &notCanary
      global: &notCanaryGlobal
        appStack: mycarrier
        language: csharp
        gitbranch: main
        deploymentStrategy: rolling
        strategy:
          canary:
            dark: true
            coordinator:
              enabled: false
            analysis:
              templates: [tests]
              tests:
                timeout: 10m
      environment:
        name: prod
      alerts:
        serviceName: MyCarrier
      applications:
        api:
          deploymentType: rollout
          image: *image
          ports:
            http: 8080
          testtrigger:
            apikey: Bearer bGl0ZXJhbC1rZXk=
            testdefinitions:
              - name: apitests
                containerImage: testing/mycarrier/api/tests
                containerTag: 1.0.0
                secretId: vault:QA/data/app_auth#SecretId
                filters: [TestCategory=PreprodSmoke]
                serviceAddress: https://payment-api.dev.mycarrier.dev
        worker:
          deploymentType: rollout
          image: *image
          ports:
            http: 8080
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Rollouts without steps and the hook for a Rollout whose property is not canary, with tests listed
    template: rollout.yaml
    set: *notCanary
    asserts:
      - hasDocuments:
          count: 2
      - notExists:
          path: spec.strategy.canary.steps
      - equal:
          path: spec.strategy.canary.maxUnavailable
          value: 0
      - notExists:
          path: metadata.annotations["mycarrier.tech/canaryBudgetSeconds"]

  - it: keeps the PostSync hook in prod for a Rollout whose property is not canary, with tests listed
    template: triggertestengine.yaml
    set: *notCanary
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job

  - it: renders no tests template for a Rollout with no deploymentStrategy, with tests listed
    template: analysistemplate.yaml
    set:
      <<: *notCanary
      global:
        appStack: mycarrier
        language: csharp
        strategy:
          canary:
            analysis:
              templates: [tests]
      applications:
        api: *api
    asserts:
      - hasDocuments:
          count: 0

  # The same values with the property canary: the template renders (and here its checks fail), so the property alone
  # decides.
  - it: renders the tests template once the property is canary, for the same values
    template: analysistemplate.yaml
    documentSelector: *testsTemplate
    set:
      <<: *prod
      global:
        <<: *global
        deploymentStrategy: canary
    asserts:
      - isKind:
          of: AnalysisTemplate

  - it: runs the tests checks once the property is canary
    template: rollout.yaml
    set:
      <<: *notCanary
      global:
        <<: *notCanaryGlobal
        correlationId: 62a354da-6833-4bf7-8f6d-689970865996
        deploymentStrategy: canary
      applications:
        api: *api
        worker: *api
    asserts:
      - failedTemplate:
          errorPattern: "application 'api': the canary tests template needs the coordinator when the release has more than one canary Rollout"
