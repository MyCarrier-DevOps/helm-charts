suite: Rollout template tests
templates:
  - rollout.yaml
tests:
  - it: should create rollout when deploymentType is rollout
    set:
      environment.name: "dev"
      applications.test-app-api.deploymentType: rollout
      applications.test-app-api.isFrontend: false
      applications.test-app-api.image.registry: "myregistry.example.com"
      applications.test-app-api.image.repository: "mycarrier/test-app-api"
      applications.test-app-api.image.tag: "1.0.0"
      applications.test-app-api.ports.http: 8080
      applications.test-app-api.ports.metrics: 9090
      applications.test-app-api.replicas: 2
      applications.test-app-api.env: {}
      applications.test-app-api.probes.enableLiveness: true
      applications.test-app-api.probes.enableReadiness: true
      applications.test-app-api.updateStrategy.type: "RollingUpdate"
      applications.test-app-api.updateStrategy.canary.steps:
        - setWeight: 25
        - setWeight: 50
        - setWeight: 100
    asserts:
      - isKind:
          of: Rollout
      - exists:
          path: spec.template.spec.containers[0].image

  - it: should create bluegreen rollout with analysis templates
    set:
      environment.name: "dev"
      applications.test-app-api.deploymentType: rollout
      applications.test-app-api.isFrontend: false
      applications.test-app-api.image.registry: "myregistry.example.com"
      applications.test-app-api.image.repository: "mycarrier/test-app-api"
      applications.test-app-api.image.tag: "1.0.0"
      applications.test-app-api.ports.http: 8080
      applications.test-app-api.ports.metrics: 9090
      applications.test-app-api.probes.enableLiveness: true
      applications.test-app-api.probes.enableReadiness: true
      applications.test-app-api.replicas: 2
      applications.test-app-api.env: {}
      # Fix: Set updateStrategy.bluegreen as an object with properties
      applications.test-app-api.updateStrategy.type: "RollingUpdate"
      applications.test-app-api.updateStrategy.bluegreen:
        activeService: test-app-api
        previewService: test-app-api-preview
        autoPromotionEnabled: true
    asserts:
      - isKind:
          of: Rollout
      - exists:
          path: spec.strategy.blueGreen

  - it: should annotate rollout with the default gateway
    set:
      environment.name: "dev"
      applications.test-app-api.deploymentType: rollout
      applications.test-app-api.isFrontend: false
      applications.test-app-api.image.registry: "myregistry.example.com"
      applications.test-app-api.image.repository: "mycarrier/test-app-api"
      applications.test-app-api.image.tag: "1.0.0"
      applications.test-app-api.ports.http: 8080
      applications.test-app-api.env: {}
      applications.test-app-api.updateStrategy.type: "RollingUpdate"
      applications.test-app-api.updateStrategy.canary.steps:
        - setWeight: 100
    asserts:
      - isKind:
          of: Rollout
      - equal:
          path: metadata.annotations["mycarrier.io/gateway"]
          value: istio-system/default
      - equal:
          path: spec.template.metadata.annotations["mycarrier.io/gateway"]
          value: istio-system/default

  - it: should annotate rollout with a custom gateway
    set:
      environment.name: "dev"
      applications.test-app-api.deploymentType: rollout
      applications.test-app-api.isFrontend: false
      applications.test-app-api.image.registry: "myregistry.example.com"
      applications.test-app-api.image.repository: "mycarrier/test-app-api"
      applications.test-app-api.image.tag: "1.0.0"
      applications.test-app-api.ports.http: 8080
      applications.test-app-api.env: {}
      applications.test-app-api.updateStrategy.type: "RollingUpdate"
      applications.test-app-api.updateStrategy.canary.steps:
        - setWeight: 100
      applications.test-app-api.networking.istio.gateway: istio-system/authenticated
    asserts:
      - isKind:
          of: Rollout
      - equal:
          path: metadata.annotations["mycarrier.io/gateway"]
          value: istio-system/authenticated
      - equal:
          path: spec.template.metadata.annotations["mycarrier.io/gateway"]
          value: istio-system/authenticated

  - it: should not annotate rollout with a gateway when istio is disabled
    set:
      environment.name: "dev"
      applications.test-app-api.deploymentType: rollout
      applications.test-app-api.isFrontend: false
      applications.test-app-api.image.registry: "myregistry.example.com"
      applications.test-app-api.image.repository: "mycarrier/test-app-api"
      applications.test-app-api.image.tag: "1.0.0"
      applications.test-app-api.ports.http: 8080
      applications.test-app-api.env: {}
      applications.test-app-api.updateStrategy.type: "RollingUpdate"
      applications.test-app-api.updateStrategy.canary.steps:
        - setWeight: 100
      applications.test-app-api.service.istioDisabled: true
    asserts:
      - isKind:
          of: Rollout
      - notExists:
          path: metadata.annotations["mycarrier.io/gateway"]
      - notExists:
          path: spec.template.metadata.annotations["mycarrier.io/gateway"]

  - it: should not create rollout when deploymentType is not rollout
    set:
      environment.name: "dev"
      applications.test-app-api.deploymentType: deployment
      applications.test-app-api.isFrontend: false
      applications.test-app-api.image.registry: "myregistry.example.com"
      applications.test-app-api.image.repository: "mycarrier/test-app-api"
      applications.test-app-api.image.tag: "1.0.0"
      applications.test-app-api.ports.http: 8080
      applications.test-app-api.ports.metrics: 9090
      applications.test-app-api.env: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: should honor application-level securityContext fsGroup and seccompProfile on the pod spec
    set:
      environment.name: "dev"
      applications.app-level-sc-rollout:
        enabled: true
        deploymentType: rollout
        image:
          registry: "myregistry.example.com"
          repository: "mycarrier/app-level-sc-rollout"
          tag: "1.0.0"
        updateStrategy:
          type: "RollingUpdate"
        securityContext:
          fsGroup: 1000000
          seccompProfile:
            type: RuntimeDefault
    asserts:
      - isKind:
          of: Rollout
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000000
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: should default container-level readOnlyRootFilesystem to true on a rollout without securityContext
    set:
      environment.name: "dev"
      applications.test-app-api.deploymentType: rollout
      applications.test-app-api.isFrontend: false
      applications.test-app-api.image.registry: "myregistry.example.com"
      applications.test-app-api.image.repository: "mycarrier/test-app-api"
      applications.test-app-api.image.tag: "1.0.0"
      applications.test-app-api.ports.http: 8080
      applications.test-app-api.replicas: 1
      applications.test-app-api.updateStrategy.type: "RollingUpdate"
    asserts:
      - isKind:
          of: Rollout
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true