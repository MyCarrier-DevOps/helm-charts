{
  "applications": {
    "app1": {
      "version": "1.0.0",
      "enabled": true,
      "image": {
        "registry": "myregistry.example.com",
        "repository": "mycarrier/app1",
        "tag": "1.0.0"
      },
      "testtrigger": {
        "ttlSecondsAfterFinished": "300",
        "testdefinitions": [
          {
            "name": "apitests",
            "containerImage": "alpine/curl",
            "containerTag": "latest",
            "secretId": "vault:Secret/data/secret#SecretId",
            "filters": [
              "TestCategory=whatever"
            ],
            "env": {
              "BIG": ""
            }
          }
        ]
      }
    }
  }
}
