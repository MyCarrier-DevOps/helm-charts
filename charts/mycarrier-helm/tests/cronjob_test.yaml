suite: CronJob template tests
templates:
  - cronjob.yaml
values:
  - ../values.yaml
tests:
  - it: should create a basic cronjob with required fields
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.name
          value: dev-app-backup-job
      - equal:
          path: spec.schedule
          value: "0 2 * * *"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: "myregistry.example.com/mycarrier/backup:1.0.0"
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 3
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 1

  - it: should set timezone when specified
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          timeZone: "America/New_York"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.timeZone
          value: "America/New_York"

  - it: should set concurrency policy when specified
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          concurrencyPolicy: "Replace"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.concurrencyPolicy
          value: "Replace"

  - it: should suspend cronjob when specified
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          suspend: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.suspend
          value: true

  - it: should set custom history limits
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          successfulJobsHistoryLimit: 5
          failedJobsHistoryLimit: 3
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 5
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 3

  - it: should set starting deadline seconds when specified
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          startingDeadlineSeconds: 200
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.startingDeadlineSeconds
          value: 200

  - it: should include custom labels
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          labels:
            custom-label: "test-value"
            team: "platform"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.labels.custom-label
          value: "test-value"
      - equal:
          path: metadata.labels.team
          value: "platform"

  - it: should include custom annotations
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          annotations:
            app.mycarrier.tech/team: "platform"
            custom-annotation: "test-value"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.annotations["app.mycarrier.tech/team"]
          value: "platform"
      - equal:
          path: metadata.annotations.custom-annotation
          value: "test-value"
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: "Prune=true"

  - it: should render custom annotations onto the pod template too (e.g. istio sidecar opt-out)
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          annotations:
            sidecar.istio.io/inject: "false"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.annotations["sidecar.istio.io/inject"]
          value: "false"
      - equal:
          path: spec.jobTemplate.spec.template.metadata.annotations["sidecar.istio.io/inject"]
          value: "false"

  - it: should set job deadline and backoff limit
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          activeDeadlineSeconds: 600
          backoffLimit: 3
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.jobTemplate.spec.activeDeadlineSeconds
          value: 600
      - equal:
          path: spec.jobTemplate.spec.backoffLimit
          value: 3

  - it: should set restart policy
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          restartPolicy: "OnFailure"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: "OnFailure"

  - it: should set image pull policy
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          imagePullPolicy: "Always"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].imagePullPolicy
          value: "Always"

  - it: should set command and args
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          command: ["/bin/sh -c"]
          args: ["./run-backup.sh"]
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[0]
          value: "/bin/sh -c"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          value: "./run-backup.sh"

  - it: should set environment variables
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          env:
            BACKUP_PATH: "/backups"
            LOG_LEVEL: "info"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: BACKUP_PATH
            value: "/backups"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: "info"

  - it: should set environment variables from secret using secretKeyRef
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          env:
            S3_ACCESS_KEY:
              secretKeyRef:
                name: "s3-credentials"
                key: "access-key"
            S3_SECRET_KEY:
              secretKeyRef:
                name: "s3-credentials"
                key: "secret-key"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: "s3-credentials"
                key: "access-key"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: "s3-credentials"
                key: "secret-key"

  - it: should set environment variables from configMap using configMapKeyRef
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          env:
            BACKUP_CONFIG:
              configMapKeyRef:
                name: "backup-config"
                key: "settings.json"
            RETENTION_POLICY:
              configMapKeyRef:
                name: "backup-config"
                key: "retention"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: BACKUP_CONFIG
            valueFrom:
              configMapKeyRef:
                name: "backup-config"
                key: "settings.json"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: RETENTION_POLICY
            valueFrom:
              configMapKeyRef:
                name: "backup-config"
                key: "retention"

  - it: should set environment variables from field references
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          env:
            POD_NAME:
              fieldRef:
                fieldPath: "metadata.name"
            POD_NAMESPACE:
              fieldRef:
                fieldPath: "metadata.namespace"
            POD_IP:
              fieldRef:
                fieldPath: "status.podIP"
            NODE_NAME:
              fieldRef:
                fieldPath: "spec.nodeName"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: "metadata.name"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: "metadata.namespace"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: "status.podIP"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: "spec.nodeName"

  - it: should set environment variables from resource field references
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          env:
            MEMORY_LIMIT:
              resourceFieldRef:
                containerName: "backup-job"
                resource: "limits.memory"
            CPU_REQUEST:
              resourceFieldRef:
                containerName: "backup-job"
                resource: "requests.cpu"
            MEMORY_REQUEST:
              resourceFieldRef:
                containerName: "backup-job"
                resource: "requests.memory"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: MEMORY_LIMIT
            valueFrom:
              resourceFieldRef:
                containerName: "backup-job"
                resource: "limits.memory"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: CPU_REQUEST
            valueFrom:
              resourceFieldRef:
                containerName: "backup-job"
                resource: "requests.cpu"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: MEMORY_REQUEST
            valueFrom:
              resourceFieldRef:
                containerName: "backup-job"
                resource: "requests.memory"

  - it: should support mixed environment variable types
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          env:
            PLAIN_VALUE: "simple-string"
            NUMERIC_VALUE: "12345"
            BACKUP_BUCKET: "s3://my-backups"
            S3_SECRET_KEY:
              secretKeyRef:
                name: "s3-credentials"
                key: "secret-key"
            RETENTION_DAYS:
              configMapKeyRef:
                name: "backup-config"
                key: "retention"
            POD_NAME:
              fieldRef:
                fieldPath: "metadata.name"
            MEMORY_LIMIT:
              resourceFieldRef:
                containerName: "backup-job"
                resource: "limits.memory"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PLAIN_VALUE
            value: "simple-string"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: NUMERIC_VALUE
            value: "12345"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: BACKUP_BUCKET
            value: "s3://my-backups"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: "s3-credentials"
                key: "secret-key"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: RETENTION_DAYS
            valueFrom:
              configMapKeyRef:
                name: "backup-config"
                key: "retention"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: "metadata.name"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: MEMORY_LIMIT
            valueFrom:
              resourceFieldRef:
                containerName: "backup-job"
                resource: "limits.memory"

  - it: should combine env with both configMapName and secretName
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          env:
            CUSTOM_VAR: "custom-value"
            OVERRIDE_VALUE: "override"
          configMapName: "backup-config"
          secretName: "backup-secrets"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: CUSTOM_VAR
            value: "custom-value"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: OVERRIDE_VALUE
            value: "override"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: "backup-config"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: "backup-secrets"

  - it: should handle empty env object
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          env: {}
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - exists:
          path: spec.jobTemplate.spec.template.spec.containers[0].env

  - it: should set custom resources
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.requests.cpu
          value: "200m"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.requests.memory
          value: "128Mi"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.limits.cpu
          value: "1000m"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.limits.memory
          value: "512Mi"

  - it: should create multiple cronjobs
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
        - name: cleanup-job
          schedule: "0 3 * * *"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/cleanup"
            tag: "2.0.0"
    asserts:
      - hasDocuments:
          count: 2

  - it: should not create cronjob when cronjobs is empty
    set:
      environment.name: "dev"
      cronjobs: []
    asserts:
      - hasDocuments:
          count: 0

  - it: should include standard labels
    set:
      environment.name: "dev"
      global.appStack: "myapp"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - exists:
          path: metadata.labels["app.kubernetes.io/name"]
      - exists:
          path: metadata.labels["app.kubernetes.io/instance"]

  - it: should set configMapName when specified
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          configMapName: "backup-config"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: "backup-config"

  - it: should set secretName when specified
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          secretName: "backup-secrets"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: "backup-secrets"

  - it: should render a large fsGroup value as a plain integer, not scientific notation (int64 cast regression guard)
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
          securityContext:
            fsGroup: 1000000
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.fsGroup
          value: 1000000

  - it: should set container-level readOnlyRootFilesystem when specified on cronjob securityContext
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
          securityContext:
            readOnlyRootFilesystem: true
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: should default container-level readOnlyRootFilesystem to false without cronjob securityContext
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false

  - it: should set pod-level seccompProfile when specified on cronjob securityContext
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
          securityContext:
            seccompProfile:
              type: RuntimeDefault
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: should let the chart-managed vault annotation win over a colliding user annotation while passing through a benign one
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
          annotations:
            sidecar.istio.io/inject: "false"
            vault.security.banzaicloud.io/run-as-non-root: "false"
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.metadata.annotations["vault.security.banzaicloud.io/run-as-non-root"]
          value: "true"
      - equal:
          path: spec.jobTemplate.spec.template.metadata.annotations["sidecar.istio.io/inject"]
          value: "false"
      # Prove there is no duplicate/stray key left behind by the collision-drop logic: the plugin
      # (v1.0.0) has no raw-text/duplicate-key assertion for parsed YAML manifests (matchRegexRaw
      # only populates for text-file templates and render-error content, not standard K8s
      # manifests - verified empirically: the "raw" field is nil for cronjob.yaml). The strongest
      # available proxy is asserting the annotations map equals EXACTLY the expected key set -
      # any duplicate key would either fail YAML decoding or be silently collapsed by the decoder,
      # and any stray/incorrectly-retained key would break this exact-equality check.
      - equal:
          path: spec.jobTemplate.spec.template.metadata.annotations
          value:
            sidecar.istio.io/inject: "false"
            vault.security.banzaicloud.io/mutate-probes: "true"
            vault.security.banzaicloud.io/run-as-group: "1000"
            vault.security.banzaicloud.io/run-as-non-root: "true"
            vault.security.banzaicloud.io/run-as-user: "100"
            vault.security.banzaicloud.io/vault-addr: "https://vault.mycarrier.tech"
            vault.security.banzaicloud.io/vault-agent-env-variables: '[{"Name":"SKIP_CHOWN","Value":"true"},{"Name":"SKIP_SETCAP","Value":"true"}]'
            vault.security.banzaicloud.io/vault-auth-method: "azure"
            vault.security.banzaicloud.io/vault-env-daemon: "true"
            vault.security.banzaicloud.io/vault-path: "clusterauth"
            vault.security.banzaicloud.io/vault-role: "appcluster"

  - it: should let the chart-managed argocd sync-options annotation win over a colliding user annotation on CronJob metadata
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
          annotations:
            argocd.argoproj.io/sync-options: "Prune=false"
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: "Prune=true"

  - it: should reject fsGroup 0 via the values schema (fsGroup 0 is the root group and is disallowed)
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
          securityContext:
            fsGroup: 0
    asserts:
      # Asserted loosely on purpose: the local unittest plugin (v1.0.0) emits
      # "cronjobs.0.securityContext.fsGroup: Must be greater than or equal to 1", but CI pins
      # v1.1.0 whose exact wording is unconfirmed. Two independent, version-robust patterns:
      # one anchors on the field name, the other on the numeric bound/phrase, so this survives
      # a wording change (e.g. jsonschema's "minimum: got 0, want 1" style) without being so loose
      # it would also pass for an unrelated failure.
      - failedTemplate:
          errorPattern: "fsGroup"
      - failedTemplate:
          errorPattern: "(?i)(greater than or equal to 1|minimum|want 1|>= *1)"

  - it: should render pod-template annotations and pod securityContext byte-identical to snapshot (regression guard)
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - matchSnapshot:
          path: spec.jobTemplate.spec.template.metadata.annotations
      - matchSnapshot:
          path: spec.jobTemplate.spec.template.spec.securityContext

  - it: should render the smallest legal fsGroup (1) as a presence guard boundary, not a falsey-guard boundary
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
          securityContext:
            fsGroup: 1
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.fsGroup
          value: 1

  - it: should render pod securityContext with only the default fields when no cronjob securityContext is specified (opt-in regression guard)
    set:
      environment.name: "dev"
      cronjobs:
        - name: backup-job
          schedule: "0 2 * * *"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/backup"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext
          value:
            runAsUser: 1000
            runAsGroup: 3000
            runAsNonRoot: true
