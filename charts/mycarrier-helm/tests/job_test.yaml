suite: Job template tests
templates:
  - jobs.yaml
values:
  - ../values.yaml
tests:
  - it: should create a basic job with required fields
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: dev-app-migration-job
      - equal:
          path: spec.template.spec.containers[0].image
          value: "myregistry.example.com/mycarrier/migration:1.0.0"

  - it: should set activeDeadlineSeconds when specified
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          activeDeadlineSeconds: 600
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.activeDeadlineSeconds
          value: 600

  - it: should set backoffLimit when specified
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          backoffLimit: 3
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.backoffLimit
          value: 3

  - it: should set default backoffLimit to 0 when not specified
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.backoffLimit
          value: 0

  - it: should set restartPolicy when specified
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          restartPolicy: "OnFailure"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.restartPolicy
          value: "OnFailure"

  - it: should set default restartPolicy to Never when not specified
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.restartPolicy
          value: "Never"

  - it: should include custom labels
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          labels:
            custom-label: "test-value"
            team: "platform"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.labels.custom-label
          value: "test-value"
      - equal:
          path: metadata.labels.team
          value: "platform"

  - it: should include custom annotations
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          annotations:
            app.mycarrier.tech/team: "platform"
            custom-annotation: "test-value"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["app.mycarrier.tech/team"]
          value: "platform"
      - equal:
          path: metadata.annotations.custom-annotation
          value: "test-value"
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: "Force=true,Replace=true"

  - it: should set image pull policy
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          imagePullPolicy: "Always"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "Always"

  - it: should set default image pull policy to IfNotPresent when not specified
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "IfNotPresent"

  - it: should set command and args
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          command: ["/bin/sh", "-c"]
          args: ["./run-migration.sh"]
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - exists:
          path: spec.template.spec.containers[0].command
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: "./run-migration.sh"

  - it: should set environment variables
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          env:
            MIGRATION_TARGET: "database"
            LOG_LEVEL: "info"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MIGRATION_TARGET
            value: "database"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: "info"

  - it: should set environment variables from secret using secretKeyRef
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          env:
            DB_PASSWORD:
              secretKeyRef:
                name: "db-credentials"
                key: "password"
            API_KEY:
              secretKeyRef:
                name: "api-secrets"
                key: "key"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: "db-credentials"
                key: "password"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_KEY
            valueFrom:
              secretKeyRef:
                name: "api-secrets"
                key: "key"

  - it: should set environment variables from configMap using configMapKeyRef
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          env:
            APP_CONFIG:
              configMapKeyRef:
                name: "app-config"
                key: "config.json"
            DATABASE_URL:
              configMapKeyRef:
                name: "db-config"
                key: "url"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_CONFIG
            valueFrom:
              configMapKeyRef:
                name: "app-config"
                key: "config.json"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              configMapKeyRef:
                name: "db-config"
                key: "url"

  - it: should set environment variables from field references
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          env:
            POD_NAME:
              fieldRef:
                fieldPath: "metadata.name"
            POD_NAMESPACE:
              fieldRef:
                fieldPath: "metadata.namespace"
            POD_IP:
              fieldRef:
                fieldPath: "status.podIP"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: "metadata.name"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: "metadata.namespace"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: "status.podIP"

  - it: should set environment variables from resource field references
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          env:
            MEMORY_LIMIT:
              resourceFieldRef:
                containerName: "migration-job"
                resource: "limits.memory"
            CPU_REQUEST:
              resourceFieldRef:
                containerName: "migration-job"
                resource: "requests.cpu"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEMORY_LIMIT
            valueFrom:
              resourceFieldRef:
                containerName: "migration-job"
                resource: "limits.memory"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CPU_REQUEST
            valueFrom:
              resourceFieldRef:
                containerName: "migration-job"
                resource: "requests.cpu"

  - it: should support mixed environment variable types
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          env:
            PLAIN_VALUE: "simple-string"
            NUMERIC_VALUE: "12345"
            DB_PASSWORD:
              secretKeyRef:
                name: "db-credentials"
                key: "password"
            CONFIG_PATH:
              configMapKeyRef:
                name: "app-config"
                key: "path"
            NODE_NAME:
              fieldRef:
                fieldPath: "spec.nodeName"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PLAIN_VALUE
            value: "simple-string"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NUMERIC_VALUE
            value: "12345"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: "db-credentials"
                key: "password"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONFIG_PATH
            valueFrom:
              configMapKeyRef:
                name: "app-config"
                key: "path"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: "spec.nodeName"

  - it: should combine env with both configMapName and secretName
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          env:
            CUSTOM_VAR: "custom-value"
          configMapName: "migration-config"
          secretName: "migration-secrets"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CUSTOM_VAR
            value: "custom-value"
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: "migration-config"
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: "migration-secrets"

  - it: should handle empty env object
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          env: {}
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - exists:
          path: spec.template.spec.containers[0].env

  - it: should set custom resources
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "200m"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "128Mi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "1000m"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "512Mi"

  - it: should set default resources when not specified
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "128Mi"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "100m"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "256Mi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "500m"

  - it: should set configMapName when specified with secretName
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          configMapName: "migration-config"
          secretName: "migration-secrets"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: "migration-config"

  - it: should set secretName when specified
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          secretName: "migration-secrets"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: "migration-secrets"

  - it: should create multiple jobs
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
        - name: seeding-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/seeding"
            tag: "2.0.0"
    asserts:
      - hasDocuments:
          count: 2

  - it: should not create job when jobs is empty
    set:
      environment.name: "dev"
      jobs: []
    asserts:
      - hasDocuments:
          count: 0

  - it: should include standard labels
    set:
      environment.name: "dev"
      global.appStack: "myapp"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - exists:
          path: metadata.labels["app.kubernetes.io/name"]
      - exists:
          path: metadata.labels["app.kubernetes.io/instance"]

  - it: should use default imagePullSecret when not specified
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: "imagepull"

  - it: should use custom imagePullSecret when specified
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          imagePullSecret: "custom-pull-secret"
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: "custom-pull-secret"

  - it: should work with different environments
    set:
      environment.name: "preprod"
      global.appStack: "testapp"
      jobs:
        - name: env-test-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/env-test"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: preprod-testapp-env-test-job
      - equal:
          path: metadata.namespace
          value: preprod

  - it: should include tmp-dir volume by default
    set:
      environment.name: "dev"
      jobs:
        - name: default-volume-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/test"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp-dir
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp-dir
            mountPath: /tmp

  - it: should render a large fsGroup value as a plain integer, not scientific notation (int64 cast regression guard)
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
          securityContext:
            fsGroup: 1000000
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000000

  - it: should set container-level readOnlyRootFilesystem when specified on job securityContext
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
          securityContext:
            readOnlyRootFilesystem: true
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: should default container-level readOnlyRootFilesystem to false without job securityContext
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false

  - it: should set pod-level seccompProfile when specified on job securityContext
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
          securityContext:
            seccompProfile:
              type: RuntimeDefault
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: should render pod securityContext with only the default fields when no job securityContext is specified (opt-in regression guard)
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsUser: 1000
            runAsGroup: 3000
            runAsNonRoot: true

  - it: should reject fsGroup 0 via the values schema (fsGroup 0 is the root group and is disallowed)
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
          securityContext:
            fsGroup: 0
    asserts:
      # Asserted loosely on purpose: the local unittest plugin (v1.0.0) emits
      # "jobs.0.securityContext.fsGroup: Must be greater than or equal to 1", but CI pins
      # v1.1.0 whose exact wording is unconfirmed. Two independent, version-robust patterns:
      # one anchors on the field name, the other on the numeric bound/phrase, so this survives
      # a wording change (e.g. jsonschema's "minimum: got 0, want 1" style) without being so loose
      # it would also pass for an unrelated failure.
      - failedTemplate:
          errorPattern: "fsGroup"
      - failedTemplate:
          errorPattern: "(?i)(greater than or equal to 1|minimum|want 1|>= *1)"

  - it: should render pod-template annotations and pod securityContext byte-identical to snapshot (regression guard)
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
    asserts:
      - isKind:
          of: Job
      - matchSnapshot:
          path: spec.template.metadata.annotations
      - matchSnapshot:
          path: spec.template.spec.securityContext

  - it: should let the chart-managed argocd sync-options annotation win over a colliding user annotation on Job metadata (exactly once, no stray duplicate)
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
          annotations:
            argocd.argoproj.io/sync-options: "Prune=false"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: "Force=true,Replace=true"

  - it: should render jobs[].annotations onto the pod template too, with chart-managed keys winning over collisions (new capability)
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
          annotations:
            sidecar.istio.io/inject: "false"
            argocd.argoproj.io/sync-options: "Prune=false"
            vault.security.banzaicloud.io/run-as-non-root: "false"
    asserts:
      - isKind:
          of: Job
      # New capability: jobs[].annotations previously could not reach the pod template at all.
      - equal:
          path: spec.template.metadata.annotations["sidecar.istio.io/inject"]
          value: "false"
      # Job pod-template sync-options differs from the Job-metadata value by design
      # (Prune=true,Replace=true vs Force=true,Replace=true) - the collision must resolve to
      # THIS surface's chart-managed value, not the metadata one.
      - equal:
          path: spec.template.metadata.annotations["argocd.argoproj.io/sync-options"]
          value: "Prune=true,Replace=true"
      - equal:
          path: spec.template.metadata.annotations["vault.security.banzaicloud.io/run-as-non-root"]
          value: "true"

  - it: should reserve the argocd hook annotations on the job pod template unconditionally, even when timing is not set
    set:
      environment.name: "dev"
      jobs:
        - name: regular-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/regular"
            tag: "1.0.0"
          annotations:
            argocd.argoproj.io/hook: "PreSync"
            argocd.argoproj.io/sync-wave: "5"
    asserts:
      - isKind:
          of: Job
      # No .job.timing set, so the chart itself would not render these keys - but they are
      # reserved unconditionally (see _spec_job.tpl $argocdReserved), so the user-supplied
      # values must still be dropped rather than leaking through.
      - notExists:
          path: spec.template.metadata.annotations["argocd.argoproj.io/hook"]
      - notExists:
          path: spec.template.metadata.annotations["argocd.argoproj.io/sync-wave"]

  - it: should reject readOnlyRootFileSystem (capital S typo) via the values schema
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
          securityContext:
            readOnlyRootFileSystem: true
    asserts:
      - failedTemplate:
          errorPattern: "(?i)(readOnlyRootFileSystem|additional propert)"

  - it: should reject an empty seccompProfile (missing required type) via the values schema
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
          securityContext:
            seccompProfile: {}
    asserts:
      - failedTemplate:
          errorPattern: "(?i)(seccompProfile|missing propert|required)"

  - it: should reject a seccompProfile.type outside the enum via the values schema
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
          securityContext:
            seccompProfile:
              type: Bogus
    asserts:
      - failedTemplate:
          errorPattern: "(?i)(RuntimeDefault|Localhost|Unconfined|enum|one of)"

  - it: should set pod-level seccompProfile Localhost with a localhostProfile path
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
          securityContext:
            seccompProfile:
              type: Localhost
              localhostProfile: profiles/x.json
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: Localhost
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.localhostProfile
          value: profiles/x.json

  - it: should render the smallest legal fsGroup (1) as a presence guard boundary, not a falsey-guard boundary
    set:
      environment.name: "dev"
      jobs:
        - name: migration-job
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/migration"
            tag: "1.0.0"
          securityContext:
            fsGroup: 1
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1
