suite: Session affinity, the own VirtualService of a frontend in a multi-frontend release
# An isFrontend application also gets its own VirtualService, and the Rollout lists it beside the shared
# multi-frontend one, so the per-app wrapping applies there too.
templates:
  - virtualService.yaml
values:
  - values/multifrontend-affinity.yaml
tests:
  - it: wraps the weighted routes of the frontend's own VirtualService
    documentIndex: 2
    asserts:
      - equal: {path: metadata.name, value: test-stack-shell}
      - equal: {path: "spec.http[0].name", value: test-stack-shell-canary-source}
      - equal: {path: "spec.http[1].name", value: test-stack-shell-pin-canary}
      - equal: {path: "spec.http[2].name", value: test-stack-shell-pin-stable}
      - equal: {path: "spec.http[3].name", value: test-stack-shell}
      - equal: {path: "spec.http[4].name", value: test-stack-shell-stable}

  - it: leaves the own VirtualService of a frontend without the value as it was
    documentIndex: 0
    set:
      applications:
        admin:
          canarySessionAffinity: false
    asserts:
      - equal: {path: metadata.name, value: test-stack-admin}
      - equal: {path: "spec.http[0].name", value: test-stack-admin-canary-source}
      - equal: {path: "spec.http[1].name", value: test-stack-admin}
      - notExists: {path: 'spec.http[?(@.name=="test-stack-admin-pin-canary")]'}
