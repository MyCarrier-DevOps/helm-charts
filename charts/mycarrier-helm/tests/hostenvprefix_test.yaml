suite: helm.hostEnvPrefix legacy-host consumer-contract tests
# RED-stage tests for the (not-yet-implemented) `helm.hostEnvPrefix` named template.
# Contract (see standup-notes/2026/09/loop-legacy-host-helper/spec.md):
#   - returns "api" when hasPrefix "prod" .Values.environment.name
#   - returns .Values.environment.name verbatim otherwise (dev/preprod/feature21/...)
#   - no metaenv collapsing (unlike helm.domain.prefix)
#
# Consumer-contract host string under test (single-quoted, exactly as MC.Integration will use it):
#   'integrations-testapp.{{ include "helm.hostEnvPrefix" $ }}.{{ include "helm.domain" $ }}'
#
# These MUST fail on unmodified main with a template error naming the missing helper
# (`helm.hostEnvPrefix` not defined), not a YAML parse error or an assertion mismatch.
templates:
  - virtualService.yaml
  - offloadBase.yaml
tests:
  # T1: dev — spec.hosts contains integrations-testapp.dev.mycarrier.dev
  - it: T1 should render legacy host with env-name prefix for dev
    template: virtualService.yaml
    set:
      environment.name: "dev"
      applications.testapp.deploymentType: deployment
      applications.testapp.isFrontend: false
      applications.testapp.image.registry: "myregistry.example.com"
      applications.testapp.image.repository: "mycarrier/testapp"
      applications.testapp.image.tag: "1.0.0"
      applications.testapp.ports.http: 8080
      applications.testapp.networking.ingress.type: "istio"
      applications.testapp.networking.istio.enabled: true
      applications.testapp.networking.istio.hosts:
        - 'integrations-testapp.{{ include "helm.hostEnvPrefix" $ }}.{{ include "helm.domain" $ }}'
      applications.testapp.networking.istio.offloadOperatorEnabled: false
    asserts:
      - isKind:
          of: VirtualService
      - contains:
          path: spec.hosts
          content: integrations-testapp.dev.mycarrier.dev

  # T2: preprod — spec.hosts contains integrations-testapp.preprod.mycarrier.dev
  - it: T2 should render legacy host with env-name prefix for preprod
    template: virtualService.yaml
    set:
      environment.name: "preprod"
      applications.testapp.deploymentType: deployment
      applications.testapp.isFrontend: false
      applications.testapp.image.registry: "myregistry.example.com"
      applications.testapp.image.repository: "mycarrier/testapp"
      applications.testapp.image.tag: "1.0.0"
      applications.testapp.ports.http: 8080
      applications.testapp.networking.ingress.type: "istio"
      applications.testapp.networking.istio.enabled: true
      applications.testapp.networking.istio.hosts:
        - 'integrations-testapp.{{ include "helm.hostEnvPrefix" $ }}.{{ include "helm.domain" $ }}'
      applications.testapp.networking.istio.offloadOperatorEnabled: false
    asserts:
      - isKind:
          of: VirtualService
      - contains:
          path: spec.hosts
          content: integrations-testapp.preprod.mycarrier.dev

  # T3: feature21 — feature `-offload` VS (documentIndex 1) contains the literal feature-env
  # host and must NOT contain the collapsed-metaenv `dev` host (no metaenv collapsing bug).
  - it: T3 should render literal feature-env host (no metaenv collapsing) in feature offload VS
    template: virtualService.yaml
    set:
      environment.name: "feature21"
      applications.testapp.deploymentType: deployment
      applications.testapp.isFrontend: false
      applications.testapp.image.registry: "myregistry.example.com"
      applications.testapp.image.repository: "mycarrier/testapp"
      applications.testapp.image.tag: "1.0.0"
      applications.testapp.ports.http: 8080
      applications.testapp.networking.ingress.type: "istio"
      applications.testapp.networking.istio.enabled: true
      applications.testapp.networking.istio.hosts:
        - 'integrations-testapp.{{ include "helm.hostEnvPrefix" $ }}.{{ include "helm.domain" $ }}'
      applications.testapp.networking.istio.offloadOperatorEnabled: false
    asserts:
      - contains:
          path: spec.hosts
          content: integrations-testapp.feature21.mycarrier.dev
        documentIndex: 1
      - notContains:
          path: spec.hosts
          content: integrations-testapp.dev.mycarrier.dev
        documentIndex: 1

  # T4: prod — hasPrefix "prod" true -> "api", domain -> mycarriertms.com
  - it: T4 should render "api" prefix and prod domain for prod
    template: virtualService.yaml
    set:
      environment.name: "prod"
      applications.testapp.deploymentType: deployment
      applications.testapp.isFrontend: false
      applications.testapp.image.registry: "myregistry.example.com"
      applications.testapp.image.repository: "mycarrier/testapp"
      applications.testapp.image.tag: "1.0.0"
      applications.testapp.ports.http: 8080
      applications.testapp.networking.ingress.type: "istio"
      applications.testapp.networking.istio.enabled: true
      applications.testapp.networking.istio.hosts:
        - 'integrations-testapp.{{ include "helm.hostEnvPrefix" $ }}.{{ include "helm.domain" $ }}'
      applications.testapp.networking.istio.offloadOperatorEnabled: false
    asserts:
      - isKind:
          of: VirtualService
      - contains:
          path: spec.hosts
          content: integrations-testapp.api.mycarriertms.com

  # T5 (OffloadBase): dev — OffloadBase spec.hosts contains integrations-testapp.dev.mycarrier.dev
  - it: T5 should render legacy host with env-name prefix in OffloadBase for dev
    template: offloadBase.yaml
    set:
      environment.name: "dev"
      global.appStack: "devopstest"
      global.language: "go"
      applications.testapp.deploymentType: deployment
      applications.testapp.image.registry: "myregistry.example.com"
      applications.testapp.image.repository: "mycarrier/testapp"
      applications.testapp.image.tag: "1.0.0"
      applications.testapp.ports.http: 8080
      applications.testapp.networking.istio.offloadOperatorEnabled: true
      applications.testapp.networking.istio.hosts:
        - 'integrations-testapp.{{ include "helm.hostEnvPrefix" $ }}.{{ include "helm.domain" $ }}'
    asserts:
      - isKind:
          of: OffloadBase
      - contains:
          path: spec.hosts
          content: integrations-testapp.dev.mycarrier.dev
