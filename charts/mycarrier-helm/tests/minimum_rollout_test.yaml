suite: Minimum Rollout Configuration Tests
templates:
  - rollout.yaml
tests:
  - it: should create a valid rollout with minimum required configuration
    set:
      global:
        appStack: "test-stack"
        language: "nodejs"
      environment:
        name: "dev"
      applications:
        minimal-rollout-app:
          deploymentType: rollout
          networking:
            istio:
              offloadOperatorEnabled: false
          image:
            registry: "registry.example.com"
            repository: "minimal-rollout-app"
            tag: "1.0.0"
          updateStrategy:
            type: "RollingUpdate"
    asserts:
      - isKind:
          of: Rollout
      - equal:
          path: metadata.name
          value: test-stack-minimal-rollout-app
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/minimal-rollout-app:1.0.0
      - hasDocuments:
          count: 1
      # Verify essential rollout properties
      - exists:
          path: spec.selector.matchLabels
      - exists:
          path: spec.template.metadata.labels
      # Verify labels are properly set
      - isSubset:
          path: metadata.labels
          content:
            app: test-stack-minimal-rollout-app
            app.kubernetes.io/name: test-stack-minimal-rollout-app

  - it: should reject updateStrategy.bluegreen (removed; use canary)
    set:
      global:
        appStack: "test-stack"
        language: "nodejs"
      environment:
        name: "dev"
      applications:
        bluegreen-rollout-app:
          deploymentType: rollout
          networking:
            istio:
              offloadOperatorEnabled: false
          image:
            registry: "registry.example.com"
            repository: "bluegreen-rollout-app"
            tag: "1.0.0"
          updateStrategy:
            type: "RollingUpdate"
            bluegreen:
              activeService: test-stack-bluegreen-rollout-app
              previewService: test-stack-bluegreen-rollout-app-preview
              autoPromotionEnabled: true
    asserts:
      - failedTemplate:
          errorPattern: "updateStrategy.bluegreen is no longer supported"

