suite: Internal ServiceEntry template tests
templates:
  - internal-serviceentry.yaml
tests:
  - it: should render internal service entry for shared environments
    set:
      environment.name: dev
      applications.test-app.deploymentType: deployment
      applications.test-app.ports.http: 9090
      applications.test-app.networking.ingress.type: istio
      applications.test-app.networking.istio.enabled: true
      applications.test-app.image.registry: myregistry.example.com
      applications.test-app.image.repository: mycarrier/test-app
      applications.test-app.image.tag: "1.0.0"
    asserts:
      - isKind:
          of: ServiceEntry
      - equal:
          path: metadata.name
          value: app-test-app-internal
      - equal:
          path: spec.hosts[0]
          value: app-test-app.dev.internal
      - equal:
          path: spec.ports[0].number
          value: 9090
      - isSubset:
          path: spec.workloadSelector.labels
          content:
            app.kubernetes.io/instance: app-test-app-dev
  - it: should not render internal service entry for feature namespaces
    set:
      environment.name: feature-my-branch
      applications.test-app.deploymentType: deployment
      applications.test-app.networking.ingress.type: istio
      applications.test-app.networking.istio.enabled: true
      applications.test-app.image.registry: myregistry.example.com
      applications.test-app.image.repository: mycarrier/test-app
      applications.test-app.image.tag: "1.0.0"
    asserts:
      - hasDocuments:
          count: 0
  - it: should render internal service entry for qa environment
    set:
      environment.name: qa
      applications.test-app.deploymentType: deployment
      applications.test-app.ports.http: 9090
      applications.test-app.networking.ingress.type: istio
      applications.test-app.networking.istio.enabled: true
      applications.test-app.image.registry: myregistry.example.com
      applications.test-app.image.repository: mycarrier/test-app
      applications.test-app.image.tag: "1.0.0"
    asserts:
      - isKind:
          of: ServiceEntry
      - equal:
          path: metadata.name
          value: app-test-app-internal
      - equal:
          path: spec.hosts[0]
          value: app-test-app.qa.internal
      - equal:
          path: spec.ports[0].number
          value: 9090
      - isSubset:
          path: spec.workloadSelector.labels
          content:
            app.kubernetes.io/instance: app-test-app-qa
  - it: should render internal service entry for uat environment
    set:
      environment.name: uat
      applications.test-app.deploymentType: deployment
      applications.test-app.ports.http: 9090
      applications.test-app.networking.ingress.type: istio
      applications.test-app.networking.istio.enabled: true
      applications.test-app.image.registry: myregistry.example.com
      applications.test-app.image.repository: mycarrier/test-app
      applications.test-app.image.tag: "1.0.0"
    asserts:
      - isKind:
          of: ServiceEntry
      - equal:
          path: metadata.name
          value: app-test-app-internal
      - equal:
          path: spec.hosts[0]
          value: app-test-app.uat.internal
      - equal:
          path: spec.ports[0].number
          value: 9090
      - isSubset:
          path: spec.workloadSelector.labels
          content:
            app.kubernetes.io/instance: app-test-app-uat
  - it: should render internal service entry for preprod environment
    set:
      environment.name: preprod
      applications.test-app.deploymentType: deployment
      applications.test-app.ports.http: 9090
      applications.test-app.networking.ingress.type: istio
      applications.test-app.networking.istio.enabled: true
      applications.test-app.image.registry: myregistry.example.com
      applications.test-app.image.repository: mycarrier/test-app
      applications.test-app.image.tag: "1.0.0"
    asserts:
      - isKind:
          of: ServiceEntry
      - equal:
          path: metadata.name
          value: app-test-app-internal
      - equal:
          path: spec.hosts[0]
          value: app-test-app.preprod.internal
      - equal:
          path: spec.ports[0].number
          value: 9090
      - isSubset:
          path: spec.workloadSelector.labels
          content:
            app.kubernetes.io/instance: app-test-app-preprod
  - it: should not render internal service entry when environment name is exactly "feature"
    set:
      environment.name: feature
      applications.test-app.deploymentType: deployment
      applications.test-app.networking.ingress.type: istio
      applications.test-app.networking.istio.enabled: true
      applications.test-app.image.registry: myregistry.example.com
      applications.test-app.image.repository: mycarrier/test-app
      applications.test-app.image.tag: "1.0.0"
    asserts:
      - hasDocuments:
          count: 0
  - it: should not render internal service entry when internalEnabled is false for a feature environment
    set:
      environment.name: feature21
      applications.test-app.deploymentType: deployment
      applications.test-app.networking.ingress.type: istio
      applications.test-app.networking.istio.enabled: true
      applications.test-app.networking.istio.internalEnabled: false
      applications.test-app.image.registry: myregistry.example.com
      applications.test-app.image.repository: mycarrier/test-app
      applications.test-app.image.tag: "1.0.0"
    asserts:
      - hasDocuments:
          count: 0
  - it: should not render internal service entry when internalEnabled is false for a shared environment
    set:
      environment.name: qa
      applications.test-app.deploymentType: deployment
      applications.test-app.networking.ingress.type: istio
      applications.test-app.networking.istio.enabled: true
      applications.test-app.networking.istio.internalEnabled: false
      applications.test-app.image.registry: myregistry.example.com
      applications.test-app.image.repository: mycarrier/test-app
      applications.test-app.image.tag: "1.0.0"
    asserts:
      - hasDocuments:
          count: 0
