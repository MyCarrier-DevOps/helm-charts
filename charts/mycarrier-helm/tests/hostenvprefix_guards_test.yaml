suite: helm.hostEnvPrefix regression guards
# Round-2 guard tests requested by the loop VERIFY verdict
# (standup-notes/2026/09/loop-legacy-host-helper/verify-verdict.md, "Gaps in spec/tests"):
#   T6 - ApplicationSet (templates/offloads.yaml) generator-parameter passthrough: the
#        consumer-contract host string must survive into the offload-generator's `list`
#        element UNEVALUATED (literal `{{ include ... }}` text), since ApplicationSet's own
#        Go-template engine (goTemplate: true) has no `include` function and would error
#        (ApplicationGenerationFromParamsError) if the chart ever tpl-evaluated this string
#        before handing it to the generator. Proven to catch a regression: wrapping the
#        `applications` block in offloads.yaml with `tpl ... $` flips this assertion from
#        pass to fail (verified manually, not committed).
#   T7 - contrast/regression lock: helm.domain.prefix (the pre-existing, unrelated helper)
#        must keep collapsing feature envs to their metaenv ("dev") - this is the exact
#        behavior helm.hostEnvPrefix intentionally does NOT replicate.
#   T8 - OffloadBase only renders when metaEnvironment == "dev" (see offloadBase.yaml's
#        `and (not $isFeatureEnv) (eq $metaenv "dev")` gate); preprod/prod never reach the
#        legacy-host line at all, so the guard for those envs is "no document rendered",
#        not host content.
templates:
  - offloads.yaml
  - virtualService.yaml
  - offloadBase.yaml
tests:
  # T6: ApplicationSet passthrough - the contract string must not be evaluated by the chart
  # before it reaches the ApplicationSet generator's `list.elements[].Values` payload.
  - it: T6 ApplicationSet generator element carries the consumer-contract host string unevaluated
    template: offloads.yaml
    set:
      environment.name: "dev"
      isEnvironmentDeploy: false
      global.appStack: "devopstest"
      global.language: "go"
      applications.testapp.deploymentType: deployment
      applications.testapp.isFrontend: false
      applications.testapp.image.registry: "myregistry.example.com"
      applications.testapp.image.repository: "mycarrier/testapp"
      applications.testapp.image.tag: "1.0.0"
      applications.testapp.ports.http: 8080
      applications.testapp.networking.ingress.type: "istio"
      applications.testapp.networking.istio.enabled: true
      applications.testapp.networking.istio.hosts:
        - 'integrations-testapp.{{ include "helm.hostEnvPrefix" $ }}.{{ include "helm.domain" $ }}'
      applications.testapp.networking.istio.offloadOperatorEnabled: false
    asserts:
      - isKind:
          of: ApplicationSet
      # helm-unittest parses the rendered manifest as YAML, so the toYaml-folded scalar in
      # offloads.yaml is recovered here as a single unevaluated string - if the chart ever
      # started `tpl`-evaluating this value before the ApplicationSet sees it, this would
      # instead equal "integrations-testapp.dev.mycarrier.dev" and fail.
      - equal:
          path: spec.generators[0].matrix.generators[1].list.elements[0].Values.applications.testapp.networking.istio.hosts[0]
          value: 'integrations-testapp.{{ include "helm.hostEnvPrefix" $ }}.{{ include "helm.domain" $ }}'

  # T7: contrast test - helm.domain.prefix (unrelated, pre-existing) still collapses feature
  # envs to their metaenv ("dev"); helm.hostEnvPrefix's non-collapsing behavior is new and
  # additive, it does not change helm.domain.prefix.
  - it: T7 helm.domain.prefix still collapses feature21 to metaenv dev (unchanged by this feature)
    template: virtualService.yaml
    set:
      environment.name: "feature21"
      applications.testapp.deploymentType: deployment
      applications.testapp.isFrontend: false
      applications.testapp.image.registry: "myregistry.example.com"
      applications.testapp.image.repository: "mycarrier/testapp"
      applications.testapp.image.tag: "1.0.0"
      applications.testapp.ports.http: 8080
      applications.testapp.networking.ingress.type: "istio"
      applications.testapp.networking.istio.enabled: true
      applications.testapp.networking.istio.offloadOperatorEnabled: false
    asserts:
      - contains:
          path: spec.hosts
          content: app-testapp-feature21.dev.mycarrier.dev
        documentIndex: 0

  # T8: OffloadBase's `eq $metaenv "dev"` gate means preprod/prod never render an OffloadBase
  # document at all (T5 already covers the dev case's legacy-host content).
  - it: T8 OffloadBase does not render for preprod (metaEnvironment gate, not dev)
    template: offloadBase.yaml
    set:
      environment.name: "preprod"
      global.appStack: "devopstest"
      global.language: "go"
      applications.testapp.deploymentType: deployment
      applications.testapp.image.registry: "myregistry.example.com"
      applications.testapp.image.repository: "mycarrier/testapp"
      applications.testapp.image.tag: "1.0.0"
      applications.testapp.ports.http: 8080
      applications.testapp.networking.istio.offloadOperatorEnabled: true
      applications.testapp.networking.istio.hosts:
        - 'integrations-testapp.{{ include "helm.hostEnvPrefix" $ }}.{{ include "helm.domain" $ }}'
    asserts:
      - hasDocuments:
          count: 0

  - it: T8b OffloadBase does not render for prod (metaEnvironment gate, not dev)
    template: offloadBase.yaml
    set:
      environment.name: "prod"
      global.appStack: "devopstest"
      global.language: "go"
      applications.testapp.deploymentType: deployment
      applications.testapp.image.registry: "myregistry.example.com"
      applications.testapp.image.repository: "mycarrier/testapp"
      applications.testapp.image.tag: "1.0.0"
      applications.testapp.ports.http: 8080
      applications.testapp.networking.istio.offloadOperatorEnabled: true
      applications.testapp.networking.istio.hosts:
        - 'integrations-testapp.{{ include "helm.hostEnvPrefix" $ }}.{{ include "helm.domain" $ }}'
    asserts:
      - hasDocuments:
          count: 0
