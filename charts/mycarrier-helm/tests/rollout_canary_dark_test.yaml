suite: Rollout canary dark stage (header-gated, Tech Spec D11 and D20)
# The dark stage is off by default until the chart renders tests-dark (DEVOPS-326), so these tests set dark: true and,
# where the leader runs its suite, define tests-dark under the leader's analysisTemplates. Most opt out of the health
# check so the step lists show the dark stage and the barriers alone.
templates:
  - rollout.yaml
tests:
  # Tech Spec chart contract: with dark on, every preset starts with the dark stage after barrier start. The header
  # route is removed after dark-passed. setCanaryScale {matchTrafficWeight: true} then hands the canary's size back to
  # the weights: Argo Rollouts keeps the last setCanaryScale in force for every later step, so without it the canary
  # would stay at darkReplicas pods through 10/25/50%. Analysis is mandatory, so the leader runs tests-dark.
  - it: starts every preset with the dark stage when dark is on
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: 0c1d2e3f-4a5b-6c7d-8e9f-0a1b2c3d4e5f
        strategy:
          canary:
            preset: fast
            dark: true
            analysis:
              health:
                enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          analysisTemplates:
            - name: tests-dark
              provider:
                web:
                  url: http://tests.example/run
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps
          value:
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: start, timeout: 9m}
            - setCanaryScale:
                replicas: 1
            - setHeaderRoute:
                name: canary-header
                match:
                  - headerName: X-MyCarrier-Canary
                    headerValue:
                      exact: 0c1d2e3f-4a5b-6c7d-8e9f-0a1b2c3d4e5f
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: dark-ready, timeout: 9m}
            - analysis:
                templates:
                  - templateName: preprod-test-stack-api-tests-dark
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: dark-passed, timeout: 9m}
            - setHeaderRoute:
                name: canary-header
            - setCanaryScale:
                matchTrafficWeight: true
            - setWeight: 25
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: w25, timeout: 9m}
            - setWeight: 100
      - equal:
          path: spec.strategy.canary.trafficRouting.managedRoutes
          value:
            - name: canary-header

  # D20: the leader (global.strategy.canary.leader, chosen on purpose rather than by name order) alone runs the
  # dark-stage suite; followers hold at dark-passed.
  - it: gives the tests-dark analysis step to the leader only
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        correlationId: corr-1
        strategy:
          canary:
            preset: fast
            leader: worker
            dark: true
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
        worker:
          deploymentType: rollout
          analysisTemplates:
            - name: tests-dark
              provider:
                web:
                  url: http://tests.example/run
          image:
            registry: registry.example.com
            repository: worker
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps[4]
          value:
            analysis:
              templates:
                - templateName: preprod-test-stack-worker-tests-dark
        documentSelector:
          path: metadata.name
          value: test-stack-worker
      - equal:
          path: spec.strategy.canary.steps[4].plugin.config.name
          value: dark-passed
        documentSelector:
          path: metadata.name
          value: test-stack-api
      - lengthEqual:
          path: spec.strategy.canary.steps
          count: 12
        documentSelector:
          path: metadata.name
          value: test-stack-worker
      - lengthEqual:
          path: spec.strategy.canary.steps
          count: 11
        documentSelector:
          path: metadata.name
          value: test-stack-api

  - it: fails the render when the dark stage has several canary Rollouts and no leader
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            dark: true
            analysis:
              health:
                enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
        db-migration:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: migrator
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - failedTemplate:
          errorPattern: "the dark stage runs its test suite on one leader, and this release has 2 canary Rollouts; set global.strategy.canary.leader to one of: api, db-migration"

  - it: fails the render when the leader is not a canary Rollout
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            leader: web
            dark: true
            analysis:
              health:
                enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
        web:
          deploymentType: deployment
          image:
            registry: registry.example.com
            repository: web
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - failedTemplate:
          errorPattern: "global.strategy.canary.leader 'web' is not an application with deploymentType rollout that runs canary steps; choose one of: api"

  # dark is off by default (DEVOPS-312, until DEVOPS-326 renders tests-dark): the coordinator's barriers render, and
  # the dark stage, its managed route and its leader are not needed.
  - it: renders no dark stage and no managed route by default
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        correlationId: corr-1
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps[0].plugin.config.name
          value: start
      - equal:
          path: spec.strategy.canary.steps[1]
          value:
            setWeight: 10
      - notExists:
          path: spec.strategy.canary.trafficRouting.managedRoutes

  - it: needs no leader while the dark stage is off by default
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            analysis:
              health:
                enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
        worker:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: worker
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - hasDocuments:
          count: 2

  # With one Rollout that runs canary steps (the rolloutGroupSize set) the leader defaults to it: a migrating app is not
  # one, so no leader setting is needed.
  - it: defaults the leader to the only canary Rollout, skipping a migrating application
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        correlationId: corr-1
        strategy:
          canary:
            dark: true
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          migratingToRollouts: true
          autoscaling:
            enabled: true
            minReplicas: 2
            maxReplicas: 4
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
        worker:
          deploymentType: rollout
          analysisTemplates:
            - name: tests-dark
              provider:
                web:
                  url: http://tests.example/run
          image:
            registry: registry.example.com
            repository: worker
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps[4]
          value:
            analysis:
              templates:
                - templateName: preprod-test-stack-worker-tests-dark
        documentSelector:
          path: metadata.name
          value: test-stack-worker

  - it: sizes the dark canary from darkReplicas
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            dark: true
            darkReplicas: 2
            analysis:
              health:
                enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          analysisTemplates:
            - name: tests-dark
              provider:
                web:
                  url: http://tests.example/run
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps[1]
          value:
            setCanaryScale:
              replicas: 2

  # D11: strategy.canary.dark: false disables the dark stage.
  - it: renders no dark stage and no managed route with dark false
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            dark: false
            analysis:
              health:
                enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps[1]
          value:
            setWeight: 10
      - notExists:
          path: spec.strategy.canary.trafficRouting.managedRoutes

  # Followers rely on the dark-ready and dark-passed barriers, so the dark stage waits for the coordinator.
  - it: renders no dark stage and no managed route with dark true while the coordinator is off
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        strategy:
          canary:
            dark: true
            analysis:
              health:
                enabled: false
            coordinator:
              enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps[0]
          value:
            setWeight: 10
      - notExists:
          path: spec.strategy.canary.trafficRouting.managedRoutes

  # D6: an explicit steps list renders verbatim. Argo Rollouts rejects a setHeaderRoute or setMirrorRoute step whose
  # route is not in managedRoutes, so the chart lists every route those steps name.
  - it: lists the routes an explicit steps list names in managedRoutes and adds no dark stage
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            dark: true
            steps:
              - setCanaryScale: {replicas: 1}
              - setHeaderRoute:
                  name: qa-header
                  match:
                    - headerName: X-QA
                      headerValue: {exact: "1"}
              - pause: {}
              - setHeaderRoute: {name: qa-header}
              - setWeight: 100
            budgetSeconds: 3600
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - lengthEqual:
          path: spec.strategy.canary.steps
          count: 5
      - equal:
          path: spec.strategy.canary.trafficRouting.managedRoutes
          value:
            - name: qa-header

  # Argo Rollouts adds the header route to every VirtualService the Rollout lists, ahead of their other routes, and it
  # matches only the header. In the shared <primary>-multifrontend VirtualService it would send every path to this
  # app's canary, and two frontend Rollouts would overwrite each other's route.
  - it: refuses the dark stage for a frontend Rollout that shares the multi-frontend VirtualService
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            dark: true
            analysis:
              health:
                enabled: false
      environment:
        name: preprod
      applications:
        shell:
          deploymentType: rollout
          isFrontend: true
          isPrimary: true
          routePrefix: /
          analysisTemplates:
            - name: tests-dark
              provider:
                web:
                  url: http://tests.example/run
          image:
            registry: registry.example.com
            repository: shell
            tag: "1.0.0"
          ports:
            http: 4200
        admin:
          deploymentType: deployment
          isFrontend: true
          routePrefix: /admin
          image:
            registry: registry.example.com
            repository: admin
            tag: "1.0.0"
          ports:
            http: 4200
    asserts:
      - failedTemplate:
          errorPattern: "application 'shell': the dark stage's header route would also go into the shared test-stack-shell-multifrontend VirtualService"

  # The leader must name an application of the release whenever it is set, so a misspelled value fails before the
  # dark stage is turned on; that it is a canary Rollout is checked only where the dark stage needs it.
  - it: fails the render for a leader that is not an application of the release even while the dark stage is off
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        strategy:
          canary:
            leader: wroker
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - failedTemplate:
          errorPattern: "global.strategy.canary.leader 'wroker' is not an application of this release"

  # A leader set in shared values still renders where that application is a Deployment or migrating, as long as the
  # dark stage does not need it there.
  - it: renders a release whose leader is still a Deployment while the dark stage is off
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        strategy:
          canary:
            leader: api
      environment:
        name: dev
      applications:
        api:
          deploymentType: deployment
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - hasDocuments:
          count: 0
