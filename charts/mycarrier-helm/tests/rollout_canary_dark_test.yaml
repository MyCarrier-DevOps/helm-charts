suite: Rollout canary dark stage (header-gated, Tech Spec D11 and D20)
# The dark stage is on by default (DEVOPS-326); most of these tests still set dark: true and, where the leader runs its
# suite, define tests-dark under the leader's analysisTemplates (the chart's own tests-dark, rendered from the leader's
# testtrigger.testdefinitions, is in rollout_canary_tests_dark_test.yaml). Most opt out of the health
# check so the step lists show the dark stage and the barriers alone. The dark stage renders only where the steps do, in
# prod unless stepsOutsideProd is set (DEVOPS-516), so the tests that check it render a preprod drill.
templates:
  - rollout.yaml
tests:
  # Tech Spec chart contract: with dark on, every preset starts with the dark stage after barrier start. The header
  # route is removed after dark-passed. setCanaryScale {matchTrafficWeight: true}, right after the first setWeight
  # (DEVOPS-326 spec A4), then hands the canary's size back to the weights: Argo Rollouts keeps the last setCanaryScale
  # in force for every later step, so without it the canary would stay at darkReplicas pods through 10/25/50%.
  # Analysis is mandatory, so the leader runs tests-dark.
  - it: starts every preset with the dark stage when dark is on
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: 0c1d2e3f-4a5b-6c7d-8e9f-0a1b2c3d4e5f
        strategy:
          canary:
            stepsOutsideProd: true
            preset: fast
            dark: true
            analysis:
              health:
                enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          analysisTemplates:
            - name: tests-dark
              provider:
                web:
                  url: http://tests.example/run
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps
          value:
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: start, timeout: 9m}
            - setCanaryScale:
                replicas: 2
            - setHeaderRoute:
                name: canary-header
                match:
                  - headerName: X-MyCarrier-Canary
                    headerValue:
                      exact: 0c1d2e3f-4a5b-6c7d-8e9f-0a1b2c3d4e5f
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: dark-ready, timeout: 9m}
            - analysis:
                templates:
                  - templateName: preprod-test-stack-api-tests-dark
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: dark-passed, timeout: 15m}
            - setHeaderRoute:
                name: canary-header
            - setWeight: 25
            - setCanaryScale:
                matchTrafficWeight: true
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: w25, timeout: 9m}
            - setWeight: 100
      - equal:
          path: spec.strategy.canary.trafficRouting.managedRoutes
          value:
            - name: canary-header

  # D20: the leader (global.strategy.canary.leader, chosen on purpose rather than by name order) alone runs the
  # dark-stage suite; followers hold at dark-passed.
  - it: gives the tests-dark analysis step to the leader only
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        correlationId: corr-1
        strategy:
          canary:
            stepsOutsideProd: true
            preset: fast
            leader: worker
            dark: true
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
        worker:
          deploymentType: rollout
          analysisTemplates:
            - name: tests-dark
              provider:
                web:
                  url: http://tests.example/run
          image:
            registry: registry.example.com
            repository: worker
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps[4]
          value:
            analysis:
              templates:
                - templateName: preprod-test-stack-worker-tests-dark
        documentSelector:
          path: metadata.name
          value: test-stack-worker
      - equal:
          path: spec.strategy.canary.steps[4].plugin.config.name
          value: dark-passed
        documentSelector:
          path: metadata.name
          value: test-stack-api
      - lengthEqual:
          path: spec.strategy.canary.steps
          count: 12
        documentSelector:
          path: metadata.name
          value: test-stack-worker
      - lengthEqual:
          path: spec.strategy.canary.steps
          count: 11
        documentSelector:
          path: metadata.name
          value: test-stack-api

  - it: fails the render when the dark stage has several canary Rollouts and no leader
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            stepsOutsideProd: true
            dark: true
            analysis:
              health:
                enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
        db-migration:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: migrator
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - failedTemplate:
          errorPattern: "the dark stage runs its test suite on one leader, and this release has 2 canary Rollouts; set global.strategy.canary.leader to one of: api, db-migration"

  - it: fails the render when the leader is not a canary Rollout
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            stepsOutsideProd: true
            leader: web
            dark: true
            analysis:
              health:
                enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
        web:
          deploymentType: deployment
          image:
            registry: registry.example.com
            repository: web
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - failedTemplate:
          errorPattern: "global.strategy.canary.leader 'web' is not an application with deploymentType rollout that runs canary steps; choose one of: api"

  # dark is on by default (DEVOPS-326): after the start barrier the dark stage renders, with its managed route, and the
  # only canary Rollout leads it with the chart's tests-dark from its test definitions.
  - it: renders the dark stage and its managed route by default
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        correlationId: corr-1
        strategy:
          canary:
            stepsOutsideProd: true
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
          testtrigger:
            testdefinitions:
              - name: apitests
                containerImage: testing/mycarrier/api/tests
                containerTag: 1.0.0
                secretId: vault:QA/data/app_auth#SecretId
                filters: [TestCategory=CoreAPI]
    asserts:
      - equal:
          path: spec.strategy.canary.steps[0].plugin.config.name
          value: start
      - equal:
          path: spec.strategy.canary.steps[1]
          value:
            setCanaryScale:
              replicas: 2
      - equal:
          path: spec.strategy.canary.steps[4]
          value:
            analysis:
              templates:
                - templateName: preprod-test-stack-api-tests-dark
      - equal:
          path: spec.strategy.canary.trafficRouting.managedRoutes
          value:
            - name: canary-header

  - it: needs no leader with the dark stage off
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            dark: false
            analysis:
              health:
                enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
        worker:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: worker
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - hasDocuments:
          count: 2

  # With one Rollout that runs canary steps (the rolloutGroupSize set) the leader defaults to it: a migrating app is not
  # one, so no leader setting is needed.
  - it: defaults the leader to the only canary Rollout, skipping a migrating application
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        correlationId: corr-1
        strategy:
          canary:
            stepsOutsideProd: true
            dark: true
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          migratingToRollouts: true
          autoscaling:
            enabled: true
            minReplicas: 2
            maxReplicas: 4
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
        worker:
          deploymentType: rollout
          analysisTemplates:
            - name: tests-dark
              provider:
                web:
                  url: http://tests.example/run
          image:
            registry: registry.example.com
            repository: worker
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps[4]
          value:
            analysis:
              templates:
                - templateName: preprod-test-stack-worker-tests-dark
        documentSelector:
          path: metadata.name
          value: test-stack-worker

  - it: sizes the dark canary from darkReplicas
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            stepsOutsideProd: true
            dark: true
            darkReplicas: 2
            analysis:
              health:
                enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          analysisTemplates:
            - name: tests-dark
              provider:
                web:
                  url: http://tests.example/run
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps[1]
          value:
            setCanaryScale:
              replicas: 2

  # D11: strategy.canary.dark: false disables the dark stage.
  - it: renders no dark stage and no managed route with dark false
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            stepsOutsideProd: true
            dark: false
            analysis:
              health:
                enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps[1]
          value:
            setWeight: 10
      - notExists:
          path: spec.strategy.canary.trafficRouting.managedRoutes

  # Followers rely on the dark-ready and dark-passed barriers, so the dark stage waits for the coordinator.
  - it: renders no dark stage and no managed route with dark true while the coordinator is off
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        strategy:
          canary:
            stepsOutsideProd: true
            dark: true
            analysis:
              health:
                enabled: false
            coordinator:
              enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps[0]
          value:
            setWeight: 10
      - notExists:
          path: spec.strategy.canary.trafficRouting.managedRoutes

  # D6: an explicit steps list renders verbatim. Argo Rollouts rejects a setHeaderRoute or setMirrorRoute step whose
  # route is not in managedRoutes, so the chart lists every route those steps name.
  - it: lists the routes an explicit steps list names in managedRoutes and adds no dark stage
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            stepsOutsideProd: true
            dark: true
            steps:
              - setCanaryScale: {replicas: 1}
              - setHeaderRoute:
                  name: qa-header
                  match:
                    - headerName: X-QA
                      headerValue: {exact: "1"}
              - pause: {}
              - setHeaderRoute: {name: qa-header}
              - setWeight: 100
            budgetSeconds: 3600
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - lengthEqual:
          path: spec.strategy.canary.steps
          count: 5
      - equal:
          path: spec.strategy.canary.trafficRouting.managedRoutes
          value:
            - name: qa-header

  # Argo Rollouts adds the header route to every VirtualService the Rollout lists, ahead of their other routes, and it
  # matches only the header. In the shared <primary>-multifrontend VirtualService it would send every path to this
  # app's canary, and two frontend Rollouts would overwrite each other's route.
  - it: refuses the dark stage for a frontend Rollout that shares the multi-frontend VirtualService
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            dark: true
            analysis:
              health:
                enabled: false
      environment:
        name: preprod
      applications:
        shell:
          deploymentType: rollout
          isFrontend: true
          isPrimary: true
          routePrefix: /
          analysisTemplates:
            - name: tests-dark
              provider:
                web:
                  url: http://tests.example/run
          image:
            registry: registry.example.com
            repository: shell
            tag: "1.0.0"
          ports:
            http: 4200
        admin:
          deploymentType: deployment
          isFrontend: true
          routePrefix: /admin
          image:
            registry: registry.example.com
            repository: admin
            tag: "1.0.0"
          ports:
            http: 4200
    asserts:
      - failedTemplate:
          errorPattern: "application 'shell': the dark stage's header route would also go into the shared test-stack-shell-multifrontend VirtualService"

  # The leader must name an application of the release whenever it is set, so a misspelled value fails before the
  # dark stage is turned on; that it is a canary Rollout is checked only where the dark stage needs it.
  - it: fails the render for a leader that is not an application of the release even while the dark stage is off
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        strategy:
          canary:
            leader: wroker
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - failedTemplate:
          errorPattern: "global.strategy.canary.leader 'wroker' is not an application of this release"

  # A leader set in shared values still renders where that application is a Deployment or migrating, as long as the
  # dark stage does not need it there.
  - it: renders a release whose leader is still a Deployment while the dark stage is off
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        strategy:
          canary:
            dark: false
            leader: api
      environment:
        name: dev
      applications:
        api:
          deploymentType: deployment
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - hasDocuments:
          count: 0

  # DEVOPS-326 (spec A1, decision 3): the dark stage is on by default. A canary Rollout in prod with no canary values
  # starts with the start barrier, then darkReplicas (default 2, decision 4) canary pods behind the canary-header route.
  - it: dark stage on by default
    set: &prodDefault
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        correlationId: corr-1
      environment:
        name: prod
      applications:
        api: &suiteApp
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
          testtrigger:
            testdefinitions:
              - name: apitests
                containerImage: testing/mycarrier/api/tests
                containerTag: 1.0.0
                secretId: vault:QA/data/app_auth#SecretId
                filters: [TestCategory=CoreAPI]
    asserts:
      - equal:
          path: spec.strategy.canary.steps[0].plugin.config.name
          value: start
      - equal:
          path: spec.strategy.canary.steps[1]
          value:
            setCanaryScale:
              replicas: 2
      - equal:
          path: spec.strategy.canary.steps[2].setHeaderRoute.name
          value: canary-header

  # Decision 4: one dark canary pod restart would drop availability to 0 and Argo Rollouts would remove the header
  # route mid-suite, so darkReplicas is at least 2 (the schema's minimum; the render checks it too).
  - it: darkReplicas below 2 fails
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        correlationId: corr-1
        strategy:
          canary:
            dark: true
            darkReplicas: 1
      environment:
        name: prod
      applications:
        api: *suiteApp
    asserts:
      - failedTemplate:
          errorPattern: "darkReplicas.*minimum"

  # Spec A4: setCanaryScale {matchTrafficWeight: true} at weight 0 would size the canary to 0 pods, so the reset sits
  # immediately after the first setWeight: the darkReplicas pods stay up into the first weight, and the canary never
  # drops to 0 between the dark stage and promotion. Nothing scales the canary between the route removal and the first
  # setWeight.
  - it: reset follows the first weight (fast)
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        correlationId: corr-1
        strategy:
          canary:
            preset: fast
            dark: true
            darkReplicas: 2
      environment:
        name: prod
      applications:
        api: *suiteApp
    asserts:
      - equal:
          path: spec.strategy.canary.steps
          value:
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: start, timeout: 9m}
            - setCanaryScale:
                replicas: 2
            - setHeaderRoute:
                name: canary-header
                match:
                  - headerName: X-MyCarrier-Canary
                    headerValue:
                      exact: corr-1
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: dark-ready, timeout: 9m}
            - analysis:
                templates:
                  - templateName: prod-test-stack-api-tests-dark
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: dark-passed, timeout: 15m}
            - setHeaderRoute:
                name: canary-header
            - setWeight: 25
            - setCanaryScale:
                matchTrafficWeight: true
            - analysis:
                templates:
                  - templateName: prod-test-stack-api-health
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: w25, timeout: 9m}
            - setWeight: 100

  - it: reset follows the first weight (standard)
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        correlationId: corr-1
        strategy:
          canary:
            dark: true
      environment:
        name: prod
      applications:
        api: *suiteApp
    asserts:
      - equal:
          path: spec.strategy.canary.steps[6]
          value:
            setHeaderRoute:
              name: canary-header
      - equal:
          path: spec.strategy.canary.steps[7]
          value:
            setWeight: 10
      - equal:
          path: spec.strategy.canary.steps[8]
          value:
            setCanaryScale:
              matchTrafficWeight: true
      - equal:
          path: spec.strategy.canary.steps[9].analysis.templates[0].templateName
          value: prod-test-stack-api-health
      - lengthEqual:
          path: spec.strategy.canary.steps
          count: 21

  - it: reset follows the first weight (manual)
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        correlationId: corr-1
        strategy:
          canary:
            preset: manual
            dark: true
      environment:
        name: prod
      applications:
        api: *suiteApp
    asserts:
      - equal:
          path: spec.strategy.canary.steps[6]
          value:
            setHeaderRoute:
              name: canary-header
      - equal:
          path: spec.strategy.canary.steps[7]
          value:
            setWeight: 10
      - equal:
          path: spec.strategy.canary.steps[8]
          value:
            setCanaryScale:
              matchTrafficWeight: true
      - equal:
          path: spec.strategy.canary.steps[10]
          value:
            pause: {}
      - lengthEqual:
          path: spec.strategy.canary.steps
          count: 13

  # Without the dark stage nothing scales the canary: the weights size it (with the canary floor).
  - it: renders no setCanaryScale with dark false
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        correlationId: corr-1
        strategy:
          canary:
            dark: false
      environment:
        name: prod
      applications:
        api: *suiteApp
    asserts:
      - notContains:
          path: spec.strategy.canary.steps
          content:
            setCanaryScale:
              matchTrafficWeight: true
      - equal:
          path: spec.strategy.canary.steps[1]
          value:
            setWeight: 10

  # Review Focus 3: the header route matches the lower-cased string form of global.correlationId
  # (helm.canary.correlationId), whatever its case or type, the form tests-dark sends.
  - it: header route value is the lower-cased id (ABC-12)
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        correlationId: ABC-12
        strategy:
          canary:
            dark: true
      environment:
        name: prod
      applications:
        api: *suiteApp
    asserts:
      - equal:
          path: spec.strategy.canary.steps[2].setHeaderRoute.match[0].headerValue.exact
          value: abc-12

  - it: header route value is the lower-cased id (numeric 12345)
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        correlationId: 12345
        strategy:
          canary:
            dark: true
      environment:
        name: prod
      applications:
        api: *suiteApp
    asserts:
      - equal:
          path: spec.strategy.canary.steps[2].setHeaderRoute.match[0].headerValue.exact
          value: "12345"

  # Review Focus 5: an explicit steps list renders verbatim (no dark stage, no reset moved, no step added) and the
  # canary floor still applies.
  - it: explicit steps render verbatim with the floor
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        correlationId: corr-1
        strategy:
          canary:
            budgetSeconds: 600
            steps:
              - setCanaryScale:
                  replicas: 3
              - setCanaryScale:
                  matchTrafficWeight: true
              - setWeight: 5
              - pause: {duration: 5m}
              - setWeight: 100
      environment:
        name: prod
      applications:
        api: *suiteApp
    asserts:
      - equal:
          path: spec.strategy.canary.steps
          value:
            - setCanaryScale:
                replicas: 3
            - setCanaryScale:
                matchTrafficWeight: true
            - setWeight: 5
            - pause: {duration: 5m}
            - setWeight: 100
      - equal:
          path: spec.strategy.canary.minPodsPerReplicaSet
          value: 2

  # Decision 7: the leader's tests-dark Job (573 s with the defaults) fits the followers' wait at dark-passed (15m), and
  # every barrier timeout stays below progressDeadlineSeconds (1200 s).
  - it: timing defaults
    set: *prodDefault
    asserts:
      - equal:
          path: spec.progressDeadlineSeconds
          value: 1200
      - equal:
          path: spec.strategy.canary.steps[5].plugin.config
          value: {kind: barrier, name: dark-passed, timeout: 15m}
      - equal:
          path: spec.strategy.canary.steps[3].plugin.config
          value: {kind: barrier, name: dark-ready, timeout: 9m}

  - it: timing defaults keep refusing a barrier timeout at the progress deadline
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        correlationId: corr-1
        strategy:
          canary:
            dark: true
            coordinator:
              barrierTimeouts:
                dark-passed: 20m
      environment:
        name: prod
      applications:
        api: *suiteApp
    asserts:
      - failedTemplate:
          errorPattern: "barrier 'dark-passed' has timeout 20m, which is not below progressDeadlineSeconds \\(1200 s\\)"
