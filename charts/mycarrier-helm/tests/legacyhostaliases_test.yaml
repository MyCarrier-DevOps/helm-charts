suite: helm.legacyHostFqdn legacy host alias tests
# networking.istio.legacyHostAliases is plain data (a list of alias strings, no template
# syntax) composed into a full FQDN at chart render time by helm.legacyHostFqdn. See
# templates/_helpers.tpl for the WHY (ArgoCD ApplicationSet goTemplate generator parses every
# values string leaf; a values-side `{{ include ... }}` expression bricks the offload
# generator). Coverage here: per-env FQDN shapes on the VirtualService path (including the
# feature `-offload` VS) and the OffloadBase path.
templates:
  - virtualService.yaml
  - offloadBase.yaml
tests:
  - it: should render legacy host alias with dev domain prefix for dev
    template: virtualService.yaml
    set:
      environment.name: "dev"
      applications: &legacyAliasApp
        testapp:
          deploymentType: deployment
          isFrontend: false
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/testapp"
            tag: "1.0.0"
          ports:
            http: 8080
          networking:
            ingress:
              type: "istio"
            istio:
              enabled: true
              offloadOperatorEnabled: false
              legacyHostAliases:
                - integrations-testapp
    asserts:
      - isKind:
          of: VirtualService
      - contains:
          path: spec.hosts
          content: integrations-testapp.dev.mycarrier.dev

  - it: should render legacy host alias with preprod domain prefix for preprod
    template: virtualService.yaml
    set:
      environment.name: "preprod"
      applications: *legacyAliasApp
    asserts:
      - isKind:
          of: VirtualService
      - contains:
          path: spec.hosts
          content: integrations-testapp.preprod.mycarrier.dev

  - it: should render "api" domain prefix and the prod domain for prod
    template: virtualService.yaml
    set:
      environment.name: "prod"
      applications: *legacyAliasApp
    asserts:
      - isKind:
          of: VirtualService
      - contains:
          path: spec.hosts
          content: integrations-testapp.api.mycarriertms.com

  - it: should render a per-feature-env alias in the feature offload VS and never the dev-collapsed alias
    template: virtualService.yaml
    set:
      environment.name: "feature21"
      applications: *legacyAliasApp
    asserts:
      - contains:
          path: spec.hosts
          content: integrations-testapp-feature21.dev.mycarrier.dev
        documentIndex: 1
      - notContains:
          path: spec.hosts
          content: integrations-testapp.dev.mycarrier.dev
        documentIndex: 1

  - it: should follow environment.domainOverride for a feature env alias
    template: virtualService.yaml
    set:
      environment:
        name: "feature21"
        domainOverride:
          enabled: true
          domain: "overridedomain.example"
      applications: *legacyAliasApp
    asserts:
      - contains:
          path: spec.hosts
          content: integrations-testapp-feature21.dev.overridedomain.example
        documentIndex: 1

  - it: should render legacy host alias in OffloadBase for dev
    template: offloadBase.yaml
    set:
      environment.name: "dev"
      global.appStack: "devopstest"
      global.language: "go"
      applications.testapp.deploymentType: deployment
      applications.testapp.image.registry: "myregistry.example.com"
      applications.testapp.image.repository: "mycarrier/testapp"
      applications.testapp.image.tag: "1.0.0"
      applications.testapp.ports.http: 8080
      applications.testapp.networking.istio.offloadOperatorEnabled: true
      applications.testapp.networking.istio.legacyHostAliases:
        - integrations-testapp
    asserts:
      - isKind:
          of: OffloadBase
      - contains:
          path: spec.hosts
          content: integrations-testapp.dev.mycarrier.dev

  # helm.domain.prefix's own feature->metaenv collapsing contrast/regression coverage lives in
  # virtualservice_test.yaml (see the tplFqdnApp fixture there) - not duplicated here.
