  - it: "AQA-38 refuses a test tag over 100 characters"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.testdefinitions:
        - <<: *v2Def
          testEnvironmentTag: FeatureCore
          testTags: [Taaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa]
    asserts:
      - failedTemplate:
          errorPattern: "testTags\\[0\\] must be at most 100 characters"

  - it: "AQA-38 a tag with enableV1: false fails on enableV1 (results API)"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.enableV1: false
      applications.app1.testtrigger.testdefinitions:
        - <<: *v2DefResults
          testEnvironmentTag: FeatureCore
    asserts: &noV1Asserts
      - failedTemplate:
