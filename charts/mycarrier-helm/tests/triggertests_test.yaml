  - it: "AQA-38 refuses v1 and v2 definitions in one application (results API)"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.testdefinitions:
        - <<: *v2DefResults
          filters: [TestCategory=CoreAPI]
