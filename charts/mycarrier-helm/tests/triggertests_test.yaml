          name: tagged
          testEnvironmentTag: FeatureCore
    asserts: &mixedAsserts
      - failedTemplate:
          errorPattern: "application 'app-app1': test definition 'apitests' goes to TestEngine's v1 trigger \\(filters\\) and 'tagged' to its v2 trigger \\(testEnvironmentTag\\). All test definitions of an application use the same trigger"

  - it: "AQA-38 refuses v1 and v2 definitions in one application (no results API)"
    values: [values/v2-trigger-app.yaml]
    set:
