suite: Test trigger tests template
templates:
  - triggertestengine.yaml
tests:
  - it: should create a job for each application
    set:
      fullnameOverride: app
      namespace: dev
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=whatever"
        app2:
          version: 2.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app2"
            tag: "2.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=whatever"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.namespace
          value: dev
      - matchRegex:
          path: metadata.name
          pattern: ^app-app[12]-trigger$
      - exists:
          path: spec
      - equal:
          path: apiVersion
          value: batch/v1
      - hasDocuments:
          count: 2

  - it: should only create jobs for enabled applications
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=whatever"
    asserts:
      - isKind:
          of: Job
      - hasDocuments:
          count: 1
      - matchRegex:
          path: metadata.name
          pattern: ^app-app1-trigger$

  - it: should have proper labels and annotations
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=whatever"
    asserts:
      - isKind:
          of: Job
      - hasDocuments:
          count: 1
      - exists:
          path: metadata.labels
      - exists:
          path: metadata.annotations

  - it: should use testenginehook spec
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=whatever"
    asserts:
      - exists:
          path: spec

  # DEVOPS-632: the trigger pod holds the TestEngine API key, so its image comes through the Harbor proxy cache and is
  # pinned by digest; a moved tag cannot change what runs.
  - it: pulls the trigger image through the Harbor proxy cache, pinned by digest
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: harbor.mycarrier.tech/proxy-cache/alpine/curl:8.23.0@sha256:2a36f3dfe424231c1b03753929e43dda451c29a6193873916924f0b6073bbc5f

  # enableV1 tests
  - it: should bundle all test definitions into a single curl when enableV1 is true
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            enableV1: true
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=api"
              - name: "uitests"
                containerImage: "cypress/included"
                containerTag: "12.8.1"
                secretId: "vault:Secret/data/ui#SecretId"
                filters:
                  - "TestCategory=ui"
                  - "TestPriority=high"
              - name: "performancetests"
                containerImage: "k6/operator"
                containerTag: "latest"
                secretId: "vault:Secret/data/performance#SecretId"
                filters:
                  - "TestCategory=performance"
    asserts:
      - isKind:
          of: Job
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"Tests":\s*\['
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"TestName":\s*"apitests"'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"TestName":\s*"uitests"'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"TestName":\s*"performancetests"'
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '(?s)curl -sS --fail-with-body.*curl -sS --fail-with-body'
      - equal:
          path: spec.template.spec.containers[0].env[1].value
          value: "vault:DevOps/data/testengine/api/v1#url"

  # DEVOPS-629: TestEngine's legacy POST /trigger is removed (DEVOPS-623). enableV1: false selected the per-definition
  # calls to it, so it fails the render, with or without test definitions, and names the application.
  - it: fails the render when testtrigger.enableV1 is false
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            enableV1: false
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=api"
    asserts:
      - failedTemplate:
          errorPattern: "application 'app1': testtrigger.enableV1: false is not supported\\. TestEngine's legacy POST /trigger is removed \\(DEVOPS-623\\).* Remove applications\\.app1\\.testtrigger\\.enableV1, or set it to true\\.$"

  - it: fails the render when testtrigger.enableV1 is false and the testtrigger has no test definitions
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        worker:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/worker"
            tag: "1.0.0"
          testtrigger:
            enableV1: false
    asserts:
      - failedTemplate:
          errorPattern: "application 'worker': testtrigger.enableV1: false is not supported\\."

  # The legacy API is retired, so enableV1 defaults to true: one bundled POST to api/v1.
  - it: should default to v1 mode when enableV1 is omitted
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=api"
              - name: "uitests"
                containerImage: "cypress/included"
                containerTag: "12.8.1"
                secretId: "vault:Secret/data/ui#SecretId"
                filters:
                  - "TestCategory=ui"
    asserts:
      - isKind:
          of: Job
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"Tests":\s*\['
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '(?s)curl -sS --fail-with-body.*curl -sS --fail-with-body'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TESTENGINEHOOK_URL
            value: "vault:DevOps/data/testengine/api/v1#url"

  # An explicit null counts as not set: it renders the same v1 hook as an omitted enableV1, not the enableV1: false error.
  - it: should default to v1 mode when enableV1 is null
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            enableV1: null
            ttlSecondsAfterFinished: "300"
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=api"
    asserts:
      - isKind:
          of: Job
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"Tests":\s*\['
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TESTENGINEHOOK_URL
            value: "vault:DevOps/data/testengine/api/v1#url"


  # Edge case tests for testdefinitions
  - it: should handle multiple test definitions correctly
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            enableV1: true
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=api"
              - name: "uitests"
                containerImage: "cypress/included"
                containerTag: "12.8.1"
                secretId: "vault:Secret/data/ui#SecretId"
                filters:
                  - "TestCategory=ui"
                  - "TestPriority=high"
              - name: "performancetests"
                containerImage: "k6/operator"
                containerTag: "latest"
                secretId: "vault:Secret/data/performance#SecretId"
                filters:
                  - "TestCategory=performance"
    asserts:
      - isKind:
          of: Job
      - hasDocuments:
          count: 1
      - exists:
          path: spec
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"Tests":\s*\['
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"TestName":\s*"apitests"'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"TestName":\s*"uitests"'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"TestName":\s*"performancetests"'
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '(?s)curl -X POST.*curl -X POST'

  - it: should handle special characters in filter values correctly
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            testdefinitions:
              - name: "specialchartests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=special@chars"
                  - "TestName=special-name_with.chars"
                  - "TestPath=path/with/slashes"
    asserts:
      - isKind:
          of: Job
      - hasDocuments:
          count: 1
      - exists:
          path: spec

  - it: should handle custom TTL values correctly
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "600"
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=whatever"
    asserts:
      - isKind:
          of: Job
      - hasDocuments:
          count: 1
      - exists:
          path: spec

  - it: should include CorrelationId in test engine payload
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      global.correlationId: "test-correlation-123"
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=whatever"
    asserts:
      - isKind:
          of: Job
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"CorrelationId":\s*"test-correlation-123"'

  - it: should include empty CorrelationId when not set
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      global.correlationId: ""
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=whatever"
    asserts:
      - isKind:
          of: Job
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"CorrelationId":\s*""'

  - it: should include correlationId label on trigger job
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      global.correlationId: "deploy-corr-id-789"
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=whatever"
    asserts:
      - isKind:
          of: Job
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.labels["mycarrier.tech/correlationId"]
          value: "deploy-corr-id-789"

  - it: should include default tolerations when not specified
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=whatever"
    asserts:
      - isKind:
          of: Job
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '(?s)"Tolerations":\s*\[[^\]]*"key":\s*"kubernetes.azure.com/scalesetpriority"'

  - it: should use custom tolerations when specified
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=whatever"
                tolerations:
                  - key: "custom-key"
                    operator: "Equal"
                    value: "custom-value"
                    effect: "NoExecute"
    asserts:
      - isKind:
          of: Job
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '(?s)"Tolerations":\s*\[[^\]]*"key":\s*"custom-key"'

  - it: should include empty NodeAffinity by default
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=whatever"
    asserts:
      - isKind:
          of: Job
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"NodeAffinity":\s*\[\]'

  - it: should use custom NodeAffinity when specified
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=whatever"
                nodeAffinity:
                  - key: "agentpool"
                    operator: "In"
                    type: "nodeSelector"
                    values:
                      - "testpool"
    asserts:
      - isKind:
          of: Job
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '(?s)"NodeAffinity":\s*\[[^\]]*"key":\s*"agentpool"'

  - it: should include UseDefaultNodeAffinity as false by default
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=whatever"
    asserts:
      - isKind:
          of: Job
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"UseDefaultNodeAffinity":\s*"false"'

  - it: should set UseDefaultNodeAffinity to true when specified as string
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=whatever"
                useDefaultNodeAffinity: "true"
    asserts:
      - isKind:
          of: Job
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"UseDefaultNodeAffinity":\s*"true"'

  - it: should preserve unquoted boolean true for UseDefaultNodeAffinity
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=whatever"
                useDefaultNodeAffinity: true
    asserts:
      - isKind:
          of: Job
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"UseDefaultNodeAffinity":\s*"true"'

  - it: should include SpreadAcrossNodes as true by default
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
            repository: "mycarrier/app1"
            tag: "1.0.0"
          testtrigger:
            ttlSecondsAfterFinished: "300"
            testdefinitions:
              - name: "apitests"
                containerImage: "alpine/curl"
                containerTag: "latest"
                secretId: "vault:Secret/data/secret#SecretId"
                filters:
                  - "TestCategory=whatever"
    asserts:
      - isKind:
          of: Job
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"SpreadAcrossNodes":\s*"true"'

  - it: should set SpreadAcrossNodes to false when specified as string
    set:
      fullnameOverride: app
      namespace: dev-app
      metaEnvironment: dev
      applications:
        app1:
          version: 1.0.0
          enabled: true
          image:
            registry: "myregistry.example.com"
