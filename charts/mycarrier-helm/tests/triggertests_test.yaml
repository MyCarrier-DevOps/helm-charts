  # AQA-38: testEnvironmentTag sends the definitions to TestEngine's v2 trigger. Every case runs with the results API
  # settings (resultsApiKey/resultsApiUrl) and without them. .github/scripts/test_trigger_v2.py runs the script itself.
  - it: "AQA-38 v1: filters only post the v1 request to the hook URL, with no capabilities read (results API)"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.testdefinitions:
        - <<: &v2DefResults
            name: apitests
            containerImage: alpine/curl
            containerTag: latest
            secretId: vault:Secret/data/secret#SecretId
            resultsApiUrl: vault:QA/data/autotestresults_api#url
            resultsApiKey: vault:DevOps/data/autotestresults_api/api#key
          filters: [TestCategory=CoreAPI]
    asserts: &v1Asserts
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"TestFilters": \[\s*"TestCategory=CoreAPI"\s*\]'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "' \"\\$TESTENGINEHOOK_URL\" \\|\\| \\{"
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'capabilities|v2/trigger|TestEnvironmentTag'

  - it: "AQA-38 v1: filters only post the v1 request to the hook URL, with no capabilities read (no results API)"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.testdefinitions:
        - <<: &v2Def
            name: apitests
            containerImage: alpine/curl
            containerTag: latest
            secretId: vault:Secret/data/secret#SecretId
          filters: [TestCategory=CoreAPI]
    asserts: *v1Asserts

  - it: "AQA-38 v2: a tag reads capabilities, then posts the v2 request to /v2/trigger (results API)"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.testdefinitions:
        - <<: *v2DefResults
          testEnvironmentTag: FeatureCore
    asserts: &v2Asserts
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '(?s)"\$base/v1/capabilities".*
 *payload=.\{.*
 *-d "\$payload" "\$base/v2/trigger"\)'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"TestEnvironmentTag": "FeatureCore"'
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'TestFilters|TestTags|MultiRun|WARN|TESTENGINEHOOK_URL" \|\||/v1/trigger"'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'v2 is switched off in this TestEngine \(GET /v1/capabilities answered 404'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'v2 is switched off in this TestEngine \(GET /v1/capabilities does not list v2 in trigger_versions\)'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'the /v2/trigger route is missing'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '(?s)"PodResources": \{\s*"limits": \{\s*"cpu": "2000m",\s*"memory": "4Gi"\s*\},\s*"requests": \{\s*"cpu": "250m",\s*"memory": "1Gi"'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'exit 0\s*$'

