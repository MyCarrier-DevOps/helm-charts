          path: spec.template.spec.containers[0].command[2]
          pattern: '(?s)"TestEnvironmentTag": "FeatureCore".*"TestEnvironmentTag": "Ui"'
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '(?s)/v2/trigger"\).*/v2/trigger"\)'

  - it: "AQA-38 v2: tags at TestEngine's limits render (100 characters, 10 testTags)"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.testdefinitions:
        - <<: *v2Def
          testEnvironmentTag: Taaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          testTags: [t0, t1, t2, t3, t4, t5, t6, t7, t8, -Edge--Case-]
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"TestEnvironmentTag": "T(a){99}"'

  # Render checks: each fails with a message that names the definition and the field.
  - it: "AQA-38 refuses filters and testEnvironmentTag together (results API)"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.testdefinitions:
        - <<: *v2DefResults
          filters: [TestCategory=CoreAPI]
          testEnvironmentTag: FeatureCore
    asserts: &bothAsserts
      - failedTemplate:
          errorPattern: "test definition 'apitests' of 'app-app1': set either filters \\(TestEngine's v1 trigger\\) or testEnvironmentTag \\(its v2 trigger\\), not both"

  - it: "AQA-38 refuses filters and testEnvironmentTag together (no results API)"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.testdefinitions:
        - <<: *v2Def
          filters: [TestCategory=CoreAPI]
          testEnvironmentTag: FeatureCore
    asserts: *bothAsserts

  - it: "AQA-38 refuses testTags without testEnvironmentTag (results API)"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.testdefinitions:
        - <<: *v2DefResults
          testTags: [Smoke]
    asserts: &testTagsNoTagAsserts
      - failedTemplate:
          errorPattern: "test definition 'apitests' of 'app-app1': testTags needs testEnvironmentTag"

  - it: "AQA-38 refuses testTags without testEnvironmentTag (no results API)"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.testdefinitions:
        - <<: *v2Def
          testTags: [Smoke]
    asserts: *testTagsNoTagAsserts

  - it: "AQA-38 refuses multiRun without testEnvironmentTag (results API)"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.testdefinitions:
        - <<: *v2DefResults
          multiRun: true
    asserts: &multiRunNoTagAsserts
      - failedTemplate:
          errorPattern: "test definition 'apitests' of 'app-app1': multiRun needs testEnvironmentTag"

  - it: "AQA-38 refuses multiRun without testEnvironmentTag (no results API)"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.testdefinitions:
        - <<: *v2Def
          multiRun: true
    asserts: *multiRunNoTagAsserts

  - it: "AQA-38 refuses a tag with a character TestEngine refuses (results API)"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.testdefinitions:
        - <<: *v2DefResults
          testEnvironmentTag: "a&TestCategory=b"
    asserts: &badTagAsserts
      - failedTemplate:
          errorPattern: "test definition 'apitests' of 'app-app1': testEnvironmentTag 'a&TestCategory=b' must use only letters, digits, '_', '.' and '-'"

  - it: "AQA-38 refuses a tag with a character TestEngine refuses (no results API)"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.testdefinitions:
        - <<: *v2Def
          testEnvironmentTag: "a&TestCategory=b"
    asserts: *badTagAsserts

  - it: "AQA-38 refuses a test tag with a space"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.testdefinitions:
        - <<: *v2Def
          testEnvironmentTag: FeatureCore
          testTags: [ok, "no way"]
    asserts:
      - failedTemplate:
          errorPattern: "testTags\\[1\\] 'no way' must use only letters, digits"

  - it: "AQA-38 refuses a tag of only '_', '.' and '-'"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.testdefinitions:
        - <<: *v2DefResults
          testEnvironmentTag: "._-"
    asserts:
      - failedTemplate:
          errorPattern: "testEnvironmentTag '._-' must contain a letter or digit"

  - it: "AQA-38 refuses a tag over 100 characters"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.testdefinitions:
        - <<: *v2Def
          testEnvironmentTag: Taaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - failedTemplate:
          errorPattern: "testEnvironmentTag must be at most 100 characters"

  - it: "AQA-38 refuses more than 10 testTags"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.testdefinitions:
        - <<: *v2DefResults
          testEnvironmentTag: FeatureCore
          testTags: [t0, t1, t2, t3, t4, t5, t6, t7, t8, t9, t10]
    asserts:
      - failedTemplate:
          errorPattern: "testTags allows at most 10 entries"

  - it: "AQA-38 refuses an empty test tag"
    values: [values/v2-trigger-app.yaml]
    set:
      applications.app1.testtrigger.testdefinitions:
        - <<: *v2Def
          testEnvironmentTag: FeatureCore
