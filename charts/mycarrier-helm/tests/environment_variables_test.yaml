suite: Environment Variables Tests
templates:
  - deployment.yaml
tests:
  - it: should set custom environment variables
    set:
      environment.name: "dev"
      applications.env-vars-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "env-vars-app"
          tag: "1.0.0"
        env:
          SIMPLE_ENV_VAR: "simple-value"
          INTEGER_VAR: "123"
          COMPLEX_VAR: "value-with-special-chars_$@!%"
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIMPLE_ENV_VAR
            value: "simple-value"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INTEGER_VAR
            value: "123"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPLEX_VAR
            value: "value-with-special-chars_$@!%"

  - it: should handle environment variables with special formats
    set:
      environment.name: "dev"
      applications.special-env-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "special-env-app"
          tag: "1.0.0"
        env:
          URL_WITH_VARIABLES: "http://service-$(POD_NAME):8080"
          ENVIRONMENT_SPECIFIC: "development-mode"
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: URL_WITH_VARIABLES
            value: "http://service-$(POD_NAME):8080"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENVIRONMENT_SPECIFIC
            value: "development-mode"
          
  - it: should combine default environment variables with custom ones
    set:
      environment.name: "dev"
      applications.combined-env-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "combined-env-app"
          tag: "1.0.0"
        env:
          CUSTOM_VAR_1: "custom-value-1"
          CUSTOM_VAR_2: "custom-value-2"
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CUSTOM_VAR_1
            value: "custom-value-1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CUSTOM_VAR_2
            value: "custom-value-2"
      # Test for a default OpenTelemetry environment variable
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_TRACES_EXPORTER
            value: otlp

  - it: should render complex valueFrom environment variables
    set:
      environment.name: "dev"
      applications.routetester:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "route-tester"
          tag: "25.46.527a4c8"
        env:
          ENVIRONMENT:
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENVIRONMENT
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

  - it: should support all Kubernetes valueFrom sources
    set:
      global:
        appStack: test-stack
        language: nodejs
      environment.name: "dev"
      applications.multi-format-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "multi-format"
          tag: "1.0.0"
        env:
          FIELD_REF_ENV:
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          RESOURCE_REF_ENV:
            valueFrom:
              resourceFieldRef:
                containerName: multi-format-app
                resource: limits.cpu
          CONFIGMAP_REF_ENV:
            valueFrom:
              configMapKeyRef:
                name: shared-config
                key: app.properties
                optional: true
          SECRET_REF_ENV:
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: password
                optional: true
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FIELD_REF_ENV
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RESOURCE_REF_ENV
            valueFrom:
              resourceFieldRef:
                containerName: multi-format-app
                resource: limits.cpu
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONFIGMAP_REF_ENV
            valueFrom:
              configMapKeyRef:
                name: shared-config
                key: app.properties
                optional: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECRET_REF_ENV
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: password
                optional: true

  - it: should map preprod environment to uat computed name
    set:
      environment.name: "preprod"
      applications.preprod-env-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "preprod-env-app"
          tag: "1.0.0"
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ComputedEnvironmentName
            value: "uat"

  - it: should let application env override global env for matching keys
    set:
      environment.name: "dev"
      global:
        env:
          SHARED_VAR: "global-value"
          GLOBAL_ONLY: "global-only-value"
      applications.merge-env-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "merge-env-app"
          tag: "1.0.0"
        env:
          SHARED_VAR: "app-value"
          APP_ONLY: "app-only-value"
    asserts:
      - isKind:
          of: Deployment
      # Application value wins for the shared key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHARED_VAR
            value: "app-value"
      # The global value for the same key is not emitted
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHARED_VAR
            value: "global-value"
      # Global-only keys still pass through
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GLOBAL_ONLY
            value: "global-only-value"
      # Application-only keys still pass through
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_ONLY
            value: "app-only-value"

  - it: should let application valueFrom override a literal global env value
    set:
      environment.name: "dev"
      global:
        env:
          OVERRIDE_ME: "from-global"
      applications.valuefrom-override-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "valuefrom-override-app"
          tag: "1.0.0"
        env:
          OVERRIDE_ME:
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OVERRIDE_ME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OVERRIDE_ME
            value: "from-global"

  # Regression (chart 3.1.12): the env-merge helper omitted the 5 KeyVault_* keys
  # from BOTH global.env and application.env, unconditionally. For nodejs apps,
  # nothing re-injects them (helm.lang.vars.csharp only emits for csharp), so the
  # keys were deleted entirely, breaking deployment. They must now pass through.
  - it: should keep global.env KeyVault_* keys for nodejs apps (regression 3.1.12)
    set:
      environment.name: "dev"
      global:
        appStack: test-stack
        language: nodejs
        env:
          KeyVault_SplitIoProxyApiKey: SomeValue
      applications.nodejs-keyvault-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "nodejs-keyvault-app"
          tag: "1.0.0"
    asserts:
      - isKind:
          of: Deployment
      # nodejs: nothing re-injects KeyVault_*, so the user-supplied value survives
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KeyVault_SplitIoProxyApiKey
            value: SomeValue

  # For csharp apps, helm.lang.vars.csharp injects KeyVault_* (as vault pointers),
  # so the helper must still strip the user-supplied global.env copy to avoid a
  # duplicate. We assert the lang.vars-injected value is present and the
  # user-supplied value is NOT (the csharp injection is the single source).
  - it: should strip user global.env KeyVault_* for csharp apps (lang.vars is source)
    set:
      environment.name: "dev"
      global:
        appStack: test-stack
        language: csharp
        env:
          KeyVault_SplitIoProxyApiKey: SomeValue
      applications.csharp-keyvault-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "csharp-keyvault-app"
          tag: "1.0.0"
    asserts:
      - isKind:
          of: Deployment
      # The csharp lang.vars injection is the single source for this key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KeyVault_SplitIoProxyApiKey
            value: SplitIoProxyApiKey_dev
      # The user-supplied global.env copy is stripped (no duplicate)
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KeyVault_SplitIoProxyApiKey
            value: SomeValue

  # The 3 computed keys (otel endpoint / ComputedEnvironmentName / ActiveOffloads)
  # are injected by other helpers for ALL languages, so the unconditional omit of
  # a global.env copy must still apply even for nodejs.
  - it: should still omit global.env ComputedEnvironmentName for nodejs apps
    set:
      environment.name: "dev"
      global:
        appStack: test-stack
        language: nodejs
        env:
          ComputedEnvironmentName: "user-override-bad"
      applications.nodejs-computed-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "nodejs-computed-app"
          tag: "1.0.0"
    asserts:
      - isKind:
          of: Deployment
      # The user-supplied override from global.env must not appear in the merged block
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ComputedEnvironmentName
            value: "user-override-bad"
