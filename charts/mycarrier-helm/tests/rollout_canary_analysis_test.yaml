suite: Rollout canary analysis (chart AnalysisTemplates, DEVOPS-312)
# The dark stage is off in these tests (values/dark-off.yaml); rollout_canary_dark_test.yaml covers it.
templates:
  - analysistemplate.yaml
  - rollout.yaml
values:
  - values/dark-off.yaml
tests:
  # R3: the chart's health template calls the -preview Service and needs "Healthy"; a non-2xx answer is an error,
  # and a second error in a row aborts the canary (consecutiveErrorLimit 1). Analysis is mandatory, so it renders with
  # no analysis values; a csharp app's default liveness probe gives the path.
  - it: renders the chart's health template for a csharp canary Rollout by default
    template: analysistemplate.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: csharp
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: AnalysisTemplate
      - equal:
          path: metadata.name
          value: preprod-test-stack-api-health
      - equal:
          path: spec.metrics[0]
          value:
            name: health
            interval: 30s
            count: 3
            failureLimit: 0
            consecutiveErrorLimit: 1
            successCondition: result == "Healthy"
            provider:
              web:
                url: http://test-stack-api-preview.preprod.svc.cluster.local:8080/liveness
                jsonPath: "{$.status}"
                timeoutSeconds: 10

  # The check reuses the liveness probe the pod renders with, from the app's probes or the chart's default for
  # global.language. Readiness and startup probes are not used.
  - it: takes the health path and port from the livenessProbe httpGet, not the readinessProbe
    template: analysistemplate.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: nodejs
      environment:
        name: preprod
      applications:
        web:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: web
            tag: "1.0.0"
          ports:
            http: 3000
            management: 3001
          probes:
            readinessProbe:
              httpGet:
                path: /ready
                port: 3001
            livenessProbe:
              httpGet:
                path: /live
                port: 3001
    asserts:
      - equal:
          path: spec.metrics[0].provider.web.url
          value: http://test-stack-web-preview.preprod.svc.cluster.local:3001/live

  - it: ignores the startupProbe and resolves the livenessProbe's named port
    template: analysistemplate.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: nodejs
      environment:
        name: preprod
      applications:
        web:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: web
            tag: "1.0.0"
          ports:
            http: 3000
          probes:
            startupProbe:
              httpGet:
                path: /started
                port: http
            livenessProbe:
              httpGet:
                path: /alive
                port: http
    asserts:
      - equal:
          path: spec.metrics[0].provider.web.url
          value: http://test-stack-web-preview.preprod.svc.cluster.local:3000/alive

  # A csharp app's default startup probe calls /health; the check now calls its default liveness probe's /liveness.
  - it: uses the csharp default liveness path, not the default startup probe's /health
    template: analysistemplate.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: csharp
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
          probes:
            readinessProbe:
              tcpSocket:
                port: 8080
    asserts:
      - equal:
          path: spec.metrics[0].provider.web.url
          value: http://test-stack-api-preview.preprod.svc.cluster.local:8080/liveness

  # An HTTP readiness probe no longer gives the path: with a TCP liveness probe the render fails.
  - it: fails the render with an HTTP readinessProbe and a TCP livenessProbe
    template: rollout.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: nodejs
      environment:
        name: preprod
      applications:
        web:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: web
            tag: "1.0.0"
          ports:
            http: 3000
          probes:
            readinessProbe:
              httpGet:
                path: /ready
                port: http
            livenessProbe:
              tcpSocket:
                port: http
    asserts:
      - failedTemplate:
          errorPattern: "application 'web': the canary health check has no HTTP path on a port its -preview Service exposes"

  - it: fails the render when the liveness probe is turned off and no path is set
    template: rollout.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: csharp
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
          probes:
            enableLiveness: false
    asserts:
      - failedTemplate:
          errorPattern: "application 'api': the canary health check has no HTTP path on a port its -preview Service exposes"

  - it: uses the livenessProbe httpGet of a nodejs app
    template: analysistemplate.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: nodejs
      environment:
        name: preprod
      applications:
        web:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: web
            tag: "1.0.0"
          ports:
            http: 3000
          probes:
            livenessProbe:
              httpGet:
                path: alive
                port: 3000
    asserts:
      - equal:
          path: spec.metrics[0].provider.web.url
          value: http://test-stack-web-preview.preprod.svc.cluster.local:3000/alive

  - it: calls the service.ports port that targets the probe's container port
    template: analysistemplate.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: csharp
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
          service:
            ports:
              - name: http
                port: 80
                targetPort: 8080
    asserts:
      - equal:
          path: spec.metrics[0].provider.web.url
          value: http://test-stack-api-preview.preprod.svc.cluster.local:80/liveness

  # analysis.health.path: an app whose liveness probe is TCP names its health path for the canary check only.
  - it: calls analysis.health.path on the http port when the liveness probe is TCP
    template: analysistemplate.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: nodejs
        strategy:
          canary:
            analysis:
              health:
                path: /healthz
      environment:
        name: preprod
      applications:
        web:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: web
            tag: "1.0.0"
          ports:
            http: 3000
    asserts:
      - equal:
          path: spec.metrics[0].provider.web.url
          value: http://test-stack-web-preview.preprod.svc.cluster.local:3000/healthz
  - it: prefers analysis.health.path over the probe-derived path
    template: analysistemplate.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: csharp
        strategy:
          canary:
            analysis:
              health:
                path: /ready
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.metrics[0].provider.web.url
          value: http://test-stack-api-preview.preprod.svc.cluster.local:8080/ready
  - it: maps analysis.health.path through service.ports
    template: analysistemplate.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: nodejs
        strategy:
          canary:
            analysis:
              health:
                path: /status
      environment:
        name: preprod
      applications:
        web:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: web
            tag: "1.0.0"
          ports:
            http: 10000
          service:
            ports:
              - name: http
                port: 80
                targetPort: 10000
    asserts:
      - equal:
          path: spec.metrics[0].provider.web.url
          value: http://test-stack-web-preview.preprod.svc.cluster.local:80/status
  - it: rejects an analysis.health.path without a leading slash
    template: rollout.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: nodejs
        strategy:
          canary:
            analysis:
              health:
                path: healthz
      environment:
        name: preprod
      applications:
        web:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: web
            tag: "1.0.0"
          ports:
            http: 3000
    asserts:
      - failedTemplate:
          errorPattern: "analysis[./]health[./]path.*[Dd]oes not match pattern"

  # applications.<app>.canaryHealthPath overrides the stack's path for one application.
  - it: gives each application its own canaryHealthPath, over the stack's analysis.health.path
    template: analysistemplate.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: nodejs
        strategy:
          canary:
            analysis:
              health:
                path: /healthz
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          canaryHealthPath: /api/health
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 10000
        web:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: web
            tag: "1.0.0"
          ports:
            http: 10000
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.metrics[0].provider.web.url
          value: http://test-stack-api-preview.preprod.svc.cluster.local:10000/api/health
        documentIndex: 0
      - equal:
          path: spec.metrics[0].provider.web.url
          value: http://test-stack-web-preview.preprod.svc.cluster.local:10000/healthz
        documentIndex: 1

  - it: uses canaryHealthPath over the liveness probe's path
    template: analysistemplate.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: nodejs
      environment:
        name: preprod
      applications:
        web:
          deploymentType: rollout
          canaryHealthPath: /status
          image:
            registry: registry.example.com
            repository: web
            tag: "1.0.0"
          ports:
            http: 3000
          probes:
            livenessProbe:
              httpGet:
                path: /alive
                port: http
    asserts:
      - equal:
          path: spec.metrics[0].provider.web.url
          value: http://test-stack-web-preview.preprod.svc.cluster.local:3000/status

  - it: uses canaryHealthPath over the csharp default liveness path without a stack path
    template: analysistemplate.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: csharp
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          canaryHealthPath: /ready
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.metrics[0].provider.web.url
          value: http://test-stack-api-preview.preprod.svc.cluster.local:8080/ready

  - it: rejects a canaryHealthPath without a leading slash
    template: rollout.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: nodejs
      environment:
        name: preprod
      applications:
        web:
          deploymentType: rollout
          canaryHealthPath: healthz
          image:
            registry: registry.example.com
            repository: web
            tag: "1.0.0"
          ports:
            http: 3000
    asserts:
      - failedTemplate:
          errorPattern: "canaryHealthPath.*[Dd]oes not match pattern"

  - it: applies analysis.health overrides
    template: analysistemplate.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: csharp
        strategy:
          canary:
            analysis:
              health:
                count: 5
                interval: 1m
                consecutiveErrorLimit: 2
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.metrics[0].count
          value: 5
      - equal:
          path: spec.metrics[0].interval
          value: 1m
      - equal:
          path: spec.metrics[0].consecutiveErrorLimit
          value: 2

  # Opt-out: analysis.health.enabled false renders no health template and no analysis step. Alerts stays on, which is
  # enough for the mandatory-analysis check even outside prod, where the chart's alerts template does not render.
  - it: renders no AnalysisTemplate in preprod with health opted out and alerts on
    template: analysistemplate.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: csharp
        strategy:
          canary:
            analysis:
              health:
                enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a preprod drill (stepsOutsideProd) with no analysis step when health is opted out and alerts is on
    template: rollout.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: nodejs
        strategy:
          canary:
            stepsOutsideProd: true
            preset: fast
            analysis:
              health:
                enabled: false
      environment:
        name: preprod
      applications:
        web:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: web
            tag: "1.0.0"
          ports:
            http: 3000
    asserts:
      - equal:
          path: spec.strategy.canary.steps
          value:
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: start, timeout: 9m}
            - setWeight: 25
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: w25, timeout: 9m}
            - setWeight: 100
      - notExists:
          path: spec.strategy.canary.analysis

  - it: renders no health template for a migrating Rollout or a Deployment
    template: analysistemplate.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          migratingToRollouts: true
          autoscaling:
            enabled: true
            minReplicas: 2
            maxReplicas: 4
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
        worker:
          deploymentType: deployment
          image:
            registry: registry.example.com
            repository: worker
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - hasDocuments:
          count: 0

  # A nodejs app's default liveness probe is TCP, so the check has no path until one is set.
  - it: fails the render when the chart can't find an app's health path
    template: rollout.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: nodejs
      environment:
        name: preprod
      applications:
        web:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: web
            tag: "1.0.0"
          ports:
            http: 3000
    asserts:
      - failedTemplate:
          errorPattern: "application 'web': the canary health check has no HTTP path on a port its -preview Service exposes. Set applications.web.canaryHealthPath or global.strategy.canary.analysis.health.path .*, give the app an httpGet liveness probe under applications.web.probes.livenessProbe .*, or opt out with global.strategy.canary.analysis.health.enabled: false"

  - it: fails the render when the liveness probe port is not on the -preview Service
    template: rollout.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: nodejs
      environment:
        name: preprod
      applications:
        web:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: web
            tag: "1.0.0"
          ports:
            http: 3000
          probes:
            livenessProbe:
              httpGet:
                path: /alive
                port: 3001
    asserts:
      - failedTemplate:
          errorPattern: "application 'web': the canary health check has no HTTP path on a port its -preview Service exposes. Set applications.web.canaryHealthPath"

  # Argo Rollouts resolves every referenced AnalysisTemplate up front, so a step may only reference one that renders.
  - it: fails the render when analysis.templates lists a template that does not render
    template: rollout.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: csharp
        strategy:
          canary:
            analysis:
              templates: [compare]
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - failedTemplate:
          errorPattern: "application 'api': global.strategy.canary.analysis.templates lists 'compare', but no AnalysisTemplate of that name renders for it"

  # analysis.templates lists extra templates; each analysis step runs them together with health.
  - it: runs an extra template that the app defines itself together with health
    template: rollout.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: csharp
        strategy:
          canary:
            stepsOutsideProd: true
            preset: fast
            analysis:
              templates: [smoke]
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
          analysisTemplates:
            - name: smoke
              provider:
                web:
                  url: http://smoke.example/check
    asserts:
      - equal:
          path: spec.strategy.canary.steps[2].analysis.templates
          value:
            - templateName: preprod-test-stack-api-health
            - templateName: preprod-test-stack-api-smoke

  # health and alerts always run unless opted out, so listing them as extra templates fails in every environment.
  - it: fails the render when analysis.templates lists health
    template: rollout.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: csharp
        strategy:
          canary:
            analysis:
              templates: [health]
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - failedTemplate:
          errorPattern: "global.strategy.canary.analysis.templates lists 'health': health and alerts always run, so list only extra templates there. To leave one out, set global.strategy.canary.analysis.health.enabled: false."

  - it: fails the render when analysis.templates lists alerts, in a release without Rollouts too
    template: rollout.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        strategy:
          canary:
            analysis:
              templates: [smoke, alerts]
      environment:
        name: dev
      applications:
        api:
          deploymentType: deployment
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - failedTemplate:
          errorPattern: "global.strategy.canary.analysis.templates lists 'alerts': health and alerts always run, so list only extra templates there. To leave one out, set global.strategy.canary.analysis.alerts.enabled: false."

  # analysis.enabled is deprecated: false fails the render in every environment, Rollouts or not; true has no effect.
  - it: fails the render with analysis.enabled false
    template: rollout.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: csharp
        strategy:
          canary:
            analysis:
              enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - failedTemplate:
          errorPattern: "global.strategy.canary.analysis.enabled: false is no longer supported: canary analysis is mandatory for every Rollout"

  - it: fails the render with analysis.enabled false in a release without Rollouts
    template: rollout.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        strategy:
          canary:
            analysis:
              enabled: false
      environment:
        name: dev
      applications:
        api:
          deploymentType: deployment
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - failedTemplate:
          errorPattern: "global.strategy.canary.analysis.enabled: false is no longer supported"

  - it: accepts analysis.enabled true and renders the same steps as without it
    template: rollout.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: csharp
        strategy:
          canary:
            stepsOutsideProd: true
            preset: fast
            analysis:
              enabled: true
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps
          value:
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: start, timeout: 9m}
            - setWeight: 25
            - analysis:
                templates:
                  - templateName: preprod-test-stack-api-health
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: w25, timeout: 9m}
            - setWeight: 100

  # Analysis is mandatory: both opt-outs with no extra template fail every canary Rollout, in every environment, for
  # preset and explicit steps alike.
  - it: fails the render in prod when health and alerts are both opted out and no extra template is listed
    template: rollout.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: csharp
        strategy:
          canary:
            analysis:
              health:
                enabled: false
              alerts:
                enabled: false
      environment:
        name: prod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - failedTemplate:
          errorPattern: "analysis is mandatory for every Rollout, and application 'api' would run none: global.strategy.canary.analysis.health.enabled and analysis.alerts.enabled are both false and analysis.templates lists no extra template"

  - it: fails the render outside prod too when health and alerts are both opted out
    template: rollout.yaml
