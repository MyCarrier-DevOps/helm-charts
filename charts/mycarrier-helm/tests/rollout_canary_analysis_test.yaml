            tag: "1.0.0"
          ports:
            http: 5000
          analysisTemplates:
            - name: status
              provider:
                web: {}
    asserts:
      - equal:
          path: spec.metrics[0].successCondition
          value: result == "Healthy"
      - notExists:
          path: spec.metrics[0].provider.successCondition
      - equal:
          path: spec.metrics[0].provider.web.url
          value: http://test-stack-api-preview.preprod.svc.cluster.local:5000/health

  - it: refuses the job container shorthand
