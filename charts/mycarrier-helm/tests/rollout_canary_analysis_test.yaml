  # R1 and the D7-era defect: the legacy web shorthand puts successCondition at metric level (under provider it never
  # applied) and its default URL has a scheme and the app's port.
  - it: renders the legacy web shorthand with successCondition at metric level
    template: analysistemplate.yaml
    documentSelector:
      path: metadata.name
      value: preprod-test-stack-api-status
    set:
      global:
