  # The check calls plain http with no host or headers, so a liveness probe that needs them fails the render while
  # the check is on, instead of erroring on every measurement.
  - it: fails the render when the reused liveness probe needs HTTPS
    template: rollout.yaml
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        correlationId: corr-1
        language: nodejs
      environment:
        name: preprod
      applications:
        web:
          deploymentType: rollout
          image: {registry: registry.example.com, repository: web, tag: "1.0.0"}
          ports:
            http: 8443
          probes:
            livenessProbe:
              httpGet:
                path: /live
                port: http
                scheme: HTTPS
    asserts:
      - failedTemplate:
          errorPattern: "application 'web': the canary health check would reuse the path of its livenessProbe, which sets scheme HTTPS, host or httpHeaders.*or opt out with global.strategy.canary.analysis.health.enabled: false"

