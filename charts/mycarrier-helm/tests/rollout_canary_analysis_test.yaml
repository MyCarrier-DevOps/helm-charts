suite: Rollout canary analysis (chart AnalysisTemplates, DEVOPS-312)
templates:
  - analysistemplate.yaml
  - rollout.yaml
tests:
  # R3: the chart's health template calls the -preview Service and needs "Healthy"; a non-2xx answer is an error,
  # which aborts the canary at consecutiveErrorLimit 0.
  - it: renders the chart's health template for a csharp canary Rollout with analysis on
    template: analysistemplate.yaml
    set:
      global:
        appStack: test-stack
        language: csharp
        strategy:
          canary:
            analysis:
              enabled: true
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: AnalysisTemplate
      - equal:
          path: metadata.name
          value: preprod-test-stack-api-health
      - equal:
          path: spec.metrics[0]
          value:
            name: health
            interval: 30s
            count: 3
            failureLimit: 0
            consecutiveErrorLimit: 0
            successCondition: result == "Healthy"
            provider:
              web:
                url: http://test-stack-api-preview.preprod.svc.cluster.local:8080/health
                jsonPath: "{$.status}"
                timeoutSeconds: 10

  - it: takes the health path and port from the readinessProbe httpGet
    template: analysistemplate.yaml
    set:
      global:
        appStack: test-stack
        language: nodejs
        strategy:
          canary:
            analysis:
              enabled: true
      environment:
        name: preprod
      applications:
        web:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: web
            tag: "1.0.0"
          ports:
            http: 3000
          probes:
            readinessProbe:
              httpGet:
                path: /ready
                port: 3001
    asserts:
      - equal:
          path: spec.metrics[0].provider.web.url
          value: http://test-stack-web-preview.preprod.svc.cluster.local:3001/ready

  - it: falls back to the startupProbe httpGet path on the http port
    template: analysistemplate.yaml
    set:
      global:
        appStack: test-stack
        language: nodejs
        strategy:
          canary:
            analysis:
              enabled: true
      environment:
        name: preprod
      applications:
        web:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: web
            tag: "1.0.0"
          ports:
            http: 3000
          probes:
            startupProbe:
              httpGet:
                path: /started
                port: http
    asserts:
      - equal:
          path: spec.metrics[0].provider.web.url
          value: http://test-stack-web-preview.preprod.svc.cluster.local:3000/started

  - it: applies analysis.health overrides
    template: analysistemplate.yaml
    set:
      global:
        appStack: test-stack
        language: csharp
        strategy:
          canary:
            analysis:
              enabled: true
              health:
                count: 5
                interval: 1m
                consecutiveErrorLimit: 2
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.metrics[0].count
          value: 5
      - equal:
          path: spec.metrics[0].interval
          value: 1m
      - equal:
          path: spec.metrics[0].consecutiveErrorLimit
          value: 2

  - it: renders no AnalysisTemplate while analysis is off
    template: analysistemplate.yaml
    set:
      global:
        appStack: test-stack
        language: csharp
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no health template for a migrating Rollout or a Deployment
    template: analysistemplate.yaml
    set:
      global:
        appStack: test-stack
        language: csharp
        strategy:
          canary:
            analysis:
              enabled: true
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          migratingToRollouts: true
          autoscaling:
            enabled: true
            minReplicas: 2
            maxReplicas: 4
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
        worker:
          deploymentType: deployment
          image:
            registry: registry.example.com
            repository: worker
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - hasDocuments:
          count: 0

  - it: fails the render when the chart can't find an app's health path
    template: rollout.yaml
    set:
      global:
        appStack: test-stack
        language: nodejs
        strategy:
          canary:
            analysis:
              enabled: true
      environment:
        name: preprod
      applications:
        web:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: web
            tag: "1.0.0"
          ports:
            http: 3000
    asserts:
      - failedTemplate:
          errorPattern: "application 'web': the canary health check needs an HTTP path"

  # Argo Rollouts resolves every referenced AnalysisTemplate up front, so a step may only reference one that renders.
  - it: fails the render when analysis.templates lists a template that does not render
    template: rollout.yaml
    set:
      global:
        appStack: test-stack
        language: csharp
        strategy:
          canary:
            analysis:
              enabled: true
              templates: [health, compare]
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - failedTemplate:
          errorPattern: "application 'api': global.strategy.canary.analysis.templates lists 'compare', but no AnalysisTemplate of that name renders for it"

  - it: accepts a listed template that the app defines itself
    template: rollout.yaml
    set:
      global:
        appStack: test-stack
        language: csharp
        strategy:
          canary:
            preset: fast
            analysis:
              enabled: true
              templates: [health, smoke]
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
          analysisTemplates:
            - name: smoke
              provider:
                web:
                  url: http://smoke.example/check
    asserts:
      - equal:
          path: spec.strategy.canary.steps[1].analysis.templates
          value:
            - templateName: preprod-test-stack-api-health
            - templateName: preprod-test-stack-api-smoke

  - it: lets an app's own health template replace the chart's
    template: analysistemplate.yaml
    set:
      global:
        appStack: test-stack
        language: csharp
        strategy:
          canary:
            analysis:
              enabled: true
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
          analysisTemplates:
            - name: health
              provider:
                web:
                  url: http://health.example
                  statusEndpoint: /status
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.metrics[0].provider.web.url
          value: http://health.example/status

  # R1 and the D7-era defect: the legacy web shorthand puts successCondition at metric level (under provider it never
  # applied) and its default URL has a scheme and the app's port.
  - it: renders the legacy web shorthand with successCondition at metric level
    template: analysistemplate.yaml
    set:
      global:
        appStack: test-stack
        language: csharp
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 5000
          analysisTemplates:
            - name: status
              provider:
                web: {}
    asserts:
      - equal:
          path: spec.metrics[0].successCondition
          value: result == "Healthy"
      - notExists:
          path: spec.metrics[0].provider.successCondition
      - equal:
          path: spec.metrics[0].provider.web.url
          value: http://test-stack-api-preview.preprod.svc.cluster.local:5000/health

  - it: refuses the job container shorthand
    template: analysistemplate.yaml
    set:
      global:
        appStack: test-stack
        language: csharp
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
          analysisTemplates:
            - name: tests
              provider:
                job:
                  container:
                    image:
                      registry: registry.example.com
                      repository: tests
                      tag: "1"
    asserts:
      - failedTemplate:
          errorPattern: "application 'api': analysisTemplates 'tests' runs a test container through the job provider shorthand, which is no longer supported"

  # The dark stage's tests-dark template is not rendered by the chart yet (DEVOPS-312, DEVOPS-326).
  - it: fails the render when the leader's dark stage needs a tests-dark template that does not render
    template: rollout.yaml
    set:
      global:
        appStack: test-stack
        language: csharp
        correlationId: corr-1
        strategy:
          canary:
            analysis:
              enabled: true
            coordinator:
              enabled: true
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - failedTemplate:
          errorPattern: "application 'api': the dark stage runs the tests-dark AnalysisTemplate on the leader, and the chart does not render it yet"
