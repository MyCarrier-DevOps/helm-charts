suite: Rollout canary analysis template set (committed snapshot, DEVOPS-312 R5)
templates:
  - analysistemplate.yaml
  - rollout.yaml
# The default template set for a canary Rollout in prod with no canary values (analysis is mandatory, DEVOPS-312): the
# chart's health template, the alerts template with its ExternalSecret, the chart's tests-dark template for the dark
# stage's leader (on by default, DEVOPS-326; it runs the app's testtrigger.testdefinitions), and the Rollout's canary
# strategy that references them, with the coordinator's barriers, the dark stage, the canary floor and the canary and
# stable pod labels the canary source routes match. The snapshots cover the specs only, so a chart version bump does
# not change them; any change to what the canary runs does.
tests:
  - it: renders the default analysis template set
    template: analysistemplate.yaml
    set: &prod
      global:
        deploymentStrategy: canary
        appStack: mycarrier
        language: csharp
        correlationId: corr-1
      environment:
        name: prod
      alerts:
        serviceName: MyCarrier
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
          testtrigger:
            testdefinitions:
              - name: apitests
                containerImage: testing/mycarrier/api/tests
                containerTag: 1.0.0
                secretId: vault:QA/data/app_auth#SecretId
                filters: [TestCategory=CoreAPI]
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.name
          value: prod-mycarrier-api-health
        documentIndex: 0
      - matchSnapshot:
          path: spec
        documentIndex: 0
      - equal:
          path: kind
          value: ExternalSecret
        documentIndex: 1
      - matchSnapshot:
          path: spec
        documentIndex: 1
      - equal:
          path: metadata.name
          value: prod-mycarrier-api-alerts
        documentIndex: 2
      - matchSnapshot:
          path: spec
        documentIndex: 2
      - equal:
          path: metadata.name
          value: prod-mycarrier-api-tests-dark
        documentIndex: 3
      - matchSnapshot:
          path: spec
        documentIndex: 3

  - it: references the default template set from the canary strategy
    template: rollout.yaml
    set: *prod
    asserts:
      - matchSnapshot:
          path: spec.strategy.canary
