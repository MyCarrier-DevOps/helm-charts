suite: Rollout canary coordinator (release-wide lockstep, DEVOPS-325 step plugin)
# The coordinator and the dark stage are on by default; rollout_canary_dark_test.yaml covers the dark stage, and these
# tests turn it off (dark: false) except the default render. Most of these tests opt out of the health check (alerts
# stays on, and renders only in prod) so the step lists show the barriers alone; rollout_canary_analysis_test.yaml
# covers the analysis steps. The steps render only in prod unless stepsOutsideProd is set (DEVOPS-516), so the tests
# that check them render a preprod drill; rollout_canary_prod_only_test.yaml covers the other environments.
templates:
  - rollout.yaml
tests:
  # R-coord: the coordinator is on by default, so a Rollout with no canary values gets the barriers: start, the dark
  # stage's dark-ready and dark-passed (the dark stage is on by default, DEVOPS-326), and one after the health analysis
  # and the pause of each weight.
  - it: renders the barriers by default
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        correlationId: corr-1
        strategy:
          canary:
            stepsOutsideProd: true
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
          testtrigger:
            testdefinitions:
              - name: apitests
                containerImage: testing/mycarrier/api/tests
                containerTag: 1.0.0
                secretId: vault:QA/data/app_auth#SecretId
                filters: [TestCategory=CoreAPI]
    asserts:
      - lengthEqual:
          path: spec.strategy.canary.steps
          count: 22
      - equal:
          path: spec.strategy.canary.steps[0].plugin
          value:
            name: mycarrier/canary-coordinator
            config: {kind: barrier, name: start, timeout: 9m}
      - equal:
          path: spec.strategy.canary.steps[3].plugin.config
          value: {kind: barrier, name: dark-ready, timeout: 9m}
      - equal:
          path: spec.strategy.canary.steps[5].plugin.config
          value: {kind: barrier, name: dark-passed, timeout: 15m}
      - equal:
          path: spec.strategy.canary.steps[12].plugin.config.name
          value: w10
      - equal:
          path: spec.strategy.canary.steps[16].plugin.config.name
          value: w25
      - equal:
          path: spec.strategy.canary.steps[20].plugin.config.name
          value: w50

  # coordinator.enabled: false stays allowed: no plugin step renders, and global.correlationId is not required.
  - it: renders no plugin step with coordinator.enabled false
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        strategy:
          canary:
            stepsOutsideProd: true
            analysis:
              health:
                enabled: false
            coordinator:
              enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps
          value:
            - setWeight: 10
            - pause:
                duration: 5m
            - setWeight: 25
            - pause:
                duration: 5m
            - setWeight: 50
            - pause:
                duration: 5m
            - setWeight: 100

  # Tech Spec chart contract: every preset starts with barrier start, which arms the plugin's Abort hook and
  # confirms the whole group has been applied; every step boundary is a barrier.
  - it: starts with the start barrier and puts a barrier at every step boundary of the standard preset
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            dark: false
            stepsOutsideProd: true
            analysis:
              health:
                enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps
          value:
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: start, timeout: 9m}
            - setWeight: 10
            - pause:
                duration: 5m
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: w10, timeout: 9m}
            - setWeight: 25
            - pause:
                duration: 5m
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: w25, timeout: 9m}
            - setWeight: 50
            - pause:
                duration: 5m
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: w50, timeout: 9m}
            - setWeight: 100

  - it: puts the barrier after the analysis and the pause of each weight
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: csharp
        correlationId: corr-1
        strategy:
          canary:
            dark: false
            stepsOutsideProd: true
            preset: fast
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps
          value:
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: start, timeout: 9m}
            - setWeight: 25
            - analysis:
                templates:
                  - templateName: preprod-test-stack-api-health
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: w25, timeout: 9m}
            - setWeight: 100

  # The manual preset's pause stays before its barrier, so a resume of the group fans out and the barrier holds it.
  - it: keeps the manual pause before the w10 barrier
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            dark: false
            stepsOutsideProd: true
            preset: manual
            analysis:
              health:
                enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps
          value:
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: start, timeout: 9m}
            - setWeight: 10
            - pause: {}
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: w10, timeout: 9m}
            - setWeight: 100

  - it: takes barrier timeouts from coordinator.barrierTimeouts and keeps the other defaults
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            dark: false
            stepsOutsideProd: true
            preset: fast
            analysis:
              health:
                enabled: false
            coordinator:
              barrierTimeouts:
                w25: 5m
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps[0].plugin.config.timeout
          value: 9m
      - equal:
          path: spec.strategy.canary.steps[2].plugin.config.timeout
          value: 5m

  # D6: an explicit steps list overrides the preset and renders verbatim; it carries its own barriers.
  - it: renders an explicit steps list verbatim, with no barrier added
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            stepsOutsideProd: true
            steps:
              - setWeight: 5
              - plugin:
                  name: mycarrier/canary-coordinator
                  config: {kind: barrier, name: w5, timeout: 5m}
            budgetSeconds: 300
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps
          value:
            - setWeight: 5
            - plugin:
                name: mycarrier/canary-coordinator
                config: {kind: barrier, name: w5, timeout: 5m}

  # R-add: every Rollout of a release carries the same barrier sequence and the same group size.
  - it: gives two Rollouts of a release the same barriers and a group size of 2
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            dark: false
            stepsOutsideProd: true
            analysis:
              health:
                enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
        worker:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: worker
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: metadata.annotations["mycarrier.tech/rolloutGroupSize"]
          value: "2"
      # Same barriers at the same positions on both Rollouts.
      - equal:
          path: spec.strategy.canary.steps[0].plugin.config
          value: {kind: barrier, name: start, timeout: 9m}
      - equal:
          path: spec.strategy.canary.steps[3].plugin.config
          value: {kind: barrier, name: w10, timeout: 9m}
      - equal:
          path: spec.strategy.canary.steps[6].plugin.config
          value: {kind: barrier, name: w25, timeout: 9m}
      - equal:
          path: spec.strategy.canary.steps[9].plugin.config
          value: {kind: barrier, name: w50, timeout: 9m}
      - lengthEqual:
          path: spec.strategy.canary.steps
          count: 11

  # A2: a long-running migrator application (it runs the migration when it starts and keeps running) may be a canary
  # Rollout; a migrator that runs to completion stays a job with timing: pre-deploy.
  - it: renders a long-running migrator application as a canary Rollout
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            dark: false
      environment:
        name: preprod
      applications:
        db-migration:
          deploymentType: rollout
          canaryHealthPath: /health
          image:
            registry: registry.example.com
            repository: migrator
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Rollout
      - equal:
          path: metadata.name
          value: test-stack-db-migration
      - exists:
          path: spec.strategy.canary.steps

  # The canary-coordinator finds a release's Rollouts by the mycarrier.tech/correlationId label (Tech Spec D20). The
  # coordinator is on by default, so a canary Rollout without it fails to render where its steps render (deploy-core
  # always sets it): in prod, or with stepsOutsideProd. rollout_canary_prod_only_test.yaml covers the other
  # environments, where it is not required.
  - it: requires global.correlationId in prod while the coordinator is on by default
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
      environment:
        name: prod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - failedTemplate:
          errorPattern: "global.correlationId is required when the coordinator is enabled"

  - it: requires global.correlationId in a drill outside prod (stepsOutsideProd)
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        strategy:
          canary:
            stepsOutsideProd: true
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - failedTemplate:
          errorPattern: "global.correlationId is required when the coordinator is enabled"

  # Q26: Argo Rollouts counts the wait at a barrier (a plugin step) toward progressDeadlineSeconds, so a barrier
  # timeout at or above the deadline would never fire.
  - it: fails when a barrier timeout reaches progressDeadlineSeconds
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            dark: false
            preset: fast
            analysis:
              health:
                enabled: false
            coordinator:
              barrierTimeouts:
                w25: 20m
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - failedTemplate:
          errorPattern: "barrier 'w25' has timeout 20m, which is not below progressDeadlineSeconds \\(1200 s\\)"

  - it: accepts a longer barrier timeout when the release raises progressDeadlineSeconds
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            dark: false
            stepsOutsideProd: true
            preset: fast
            progressDeadlineSeconds: 1900
            analysis:
              health:
                enabled: false
            coordinator:
              barrierTimeouts:
                w25: 30m
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.strategy.canary.steps[2].plugin.config.timeout
          value: 30m

  - it: checks against the application's own progressDeadlineSeconds
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            dark: false
            stepsOutsideProd: true
            preset: fast
            analysis:
              health:
                enabled: false
            coordinator:
              barrierTimeouts:
                w25: 15m
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          progressDeadlineSeconds: 1200
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.progressDeadlineSeconds
          value: 1200
      - equal:
          path: spec.strategy.canary.steps[2].plugin.config.timeout
          value: 15m

  - it: checks the barriers of an explicit steps list too
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        correlationId: corr-1
        strategy:
          canary:
            steps:
              - setWeight: 5
              - plugin:
                  name: mycarrier/canary-coordinator
                  config: {kind: barrier, name: w5, timeout: 20m}
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - failedTemplate:
          errorPattern: "barrier 'w5' has timeout 20m, which is not below progressDeadlineSeconds"

  # DEVOPS-326: progressDeadlineSeconds defaults to 1200 where barriers render, so dark-passed's 15m stays below it.
  # With the coordinator off no barrier renders and the budget counts the deadline for each setWeight step, so the
  # default stays 600 there (1200 would put the standard preset at 4 x 1200 + 3 x 390 = 5970 s, above 5700).
  - it: keeps the 600 s default deadline with the coordinator off
    set:
      global:
        deploymentStrategy: canary
        appStack: test-stack
        language: nodejs
        strategy:
          canary:
            stepsOutsideProd: true
            coordinator:
              enabled: false
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          canaryHealthPath: /health
          image:
            registry: registry.example.com
            repository: api
            tag: "1.0.0"
          ports:
            http: 8080
    asserts:
      - equal:
          path: spec.progressDeadlineSeconds
          value: 600
      - equal:
          path: metadata.annotations["mycarrier.tech/canaryBudgetSeconds"]
          value: "3570"
