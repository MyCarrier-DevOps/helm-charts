suite: Security Context Tests
templates:
  - deployment.yaml
tests:
  - it: should set custom pod security context
    set:
      environment.name: "dev"
      applications.security-test-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "security-test-app"
          tag: "1.0.0"
        podSecurityContext:
          runAsUser: 1000
          runAsGroup: 3000
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 3000

  - it: should set container security context
    set:
      environment.name: "dev"
      applications.container-security-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "container-security-app"
          tag: "1.0.0"
        containerSecurityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # Updated to match chart behavior
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false

  - it: should apply both pod and container security contexts
    set:
      environment.name: "dev"
      applications.full-security-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "full-security-app"
          tag: "1.0.0"
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
        containerSecurityContext:
          privileged: false
          readOnlyRootFilesystem: false  # Updated to match chart behavior
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].securityContext.privileged
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false

  - it: should drop ALL capabilities by default with no add list
    set:
      environment.name: "dev"
      applications.no-caps-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "no-caps-app"
          tag: "1.0.0"
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL
      - notExists:
          path: spec.template.spec.containers[0].securityContext.capabilities.add

  - it: should add back a single capability via securityContext.addCapabilities when allow-listed
    set:
      environment.name: "dev"
      applications.single-add-cap-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "single-add-cap-app"
          tag: "1.0.0"
        securityContext:
          addCapabilities:
            - NET_BIND_SERVICE
          allowedCapabilities:
            - NET_BIND_SERVICE
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          value:
            - NET_BIND_SERVICE

  - it: should add back multiple capabilities via securityContext.addCapabilities when allow-listed
    set:
      environment.name: "dev"
      applications.multi-add-cap-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "multi-add-cap-app"
          tag: "1.0.0"
        securityContext:
          addCapabilities:
            - NET_BIND_SERVICE
            - SYS_TIME
          allowedCapabilities:
            - NET_BIND_SERVICE
            - SYS_TIME
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          value:
            - NET_BIND_SERVICE
            - SYS_TIME

  - it: should fail the render when addCapabilities is set without a matching allowedCapabilities entry (empty allow-list by default)
    set:
      environment.name: "dev"
      applications.unallowed-add-cap-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "unallowed-add-cap-app"
          tag: "1.0.0"
        securityContext:
          addCapabilities:
            - NET_BIND_SERVICE
    asserts:
      - failedTemplate:
          errorMessage: 'Capability "NET_BIND_SERVICE" is not permitted by the chart security policy. To permit it, add it to application.securityContext.allowedCapabilities (with security sign-off). Currently allowed: [].'

  - it: should fail the render for a capability not covered by a non-empty allowedCapabilities list
    set:
      environment.name: "dev"
      applications.disallowed-add-cap-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "disallowed-add-cap-app"
          tag: "1.0.0"
        securityContext:
          addCapabilities:
            - SYS_ADMIN
          allowedCapabilities:
            - NET_BIND_SERVICE
    asserts:
      - failedTemplate:
          errorMessage: 'Capability "SYS_ADMIN" is not permitted by the chart security policy. To permit it, add it to application.securityContext.allowedCapabilities (with security sign-off). Currently allowed: [NET_BIND_SERVICE].'

  - it: should not fail and should render no add block when addCapabilities is unset (allow-list guard is inert)
    set:
      environment.name: "dev"
      applications.no-addcaps-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "no-addcaps-app"
          tag: "1.0.0"
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL
      - notExists:
          path: spec.template.spec.containers[0].securityContext.capabilities.add

  - it: should honor application-level securityContext fsGroup and seccompProfile on the pod spec
    set:
      environment.name: "dev"
      applications.app-level-sc-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "app-level-sc-app"
          tag: "1.0.0"
        securityContext:
          fsGroup: 1000000
          seccompProfile:
            type: RuntimeDefault
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000000
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: should render pod-template annotations and pod securityContext byte-identical to snapshot (regression guard)
    set:
      environment.name: "dev"
      applications.snapshot-guard-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "snapshot-guard-app"
          tag: "1.0.0"
    asserts:
      - isKind:
          of: Deployment
      - matchSnapshot:
          path: spec.template.metadata.annotations
      - matchSnapshot:
          path: spec.template.spec.securityContext

  - it: should reject fsGroup 0 via the values schema on the application securityContext (fsGroup 0 is the root group and is disallowed)
    set:
      environment.name: "dev"
      applications.fsgroup-zero-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "fsgroup-zero-app"
          tag: "1.0.0"
        securityContext:
          fsGroup: 0
    asserts:
      # Loosely asserted for CI-version robustness (see the equivalent job/cronjob tests):
      # local unittest v1.0.0 emits "Must be greater than or equal to 1"; CI pins v1.1.0 whose
      # exact wording is unconfirmed - jsonschema's "minimum: got 0, want 1" is one known form.
      - failedTemplate:
          errorPattern: "fsGroup"
      - failedTemplate:
          errorPattern: "(?i)(greater than or equal to 1|minimum|want 1|>= *1)"

  - it: should render the smallest legal fsGroup (1) on an application as a presence guard boundary, not a falsey-guard boundary
    set:
      environment.name: "dev"
      applications.fsgroup-one-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "fsgroup-one-app"
          tag: "1.0.0"
        securityContext:
          fsGroup: 1
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1

  - it: should render pod securityContext with only the default fields when no application securityContext is specified (opt-in regression guard)
    set:
      environment.name: "dev"
      applications.no-sc-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "no-sc-app"
          tag: "1.0.0"
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsUser: 1000
            runAsGroup: 3000
            runAsNonRoot: true

  - it: should still harden pod and container securityContext when enableVaultCA is true (enableVaultCA has no consumer; it does not gate hardening)
    set:
      environment.name: "dev"
      enableVaultCA: true
      applications.vault-ca-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "vault-ca-app"
          tag: "1.0.0"
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true

  - it: should omit securityContext when disableSecurity is true, even if enableVaultCA is also true (break-glass opt-out is unchanged)
    set:
      environment.name: "dev"
      enableVaultCA: true
      disableSecurity: true
      applications.disable-security-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "disable-security-app"
          tag: "1.0.0"
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.template.spec.securityContext
      - notExists:
          path: spec.template.spec.containers[0].securityContext

  - it: should render pod and container securityContext unchanged when enableVaultCA and disableSecurity are both unset (default)
    set:
      environment.name: "dev"
      applications.default-security-app:
        enabled: true
        deploymentType: deployment
        image:
          registry: "test-registry"
          repository: "default-security-app"
          tag: "1.0.0"
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsUser: 1000
            runAsGroup: 3000
            runAsNonRoot: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true