suite: Environment-header route carries the endpoint allowlist
templates:
  - virtualService.yaml
tests:
  # The frontend and the API gateway send the environment header on every call, so the header route must meet the
  # allowlist too: one match per allowed endpoint (the header AND that path).
  - it: gives the prod header route one match per allowed endpoint
    set:
      global:
        appStack: test-stack
        language: csharp
      environment:
        name: prod
      applications:
        api:
          image: {registry: registry.example.com, repository: api, tag: "1.0.0"}
          ports: {http: 8080}
    asserts:
      - equal:
          path: spec.http[0].name
          value: test-stack-api
        documentSelector: {path: metadata.name, value: test-stack-api}
      - equal:
          path: spec.http[0].match
          value:
            - headers: {environment: {exact: prod}}
              uri: {exact: /liveness}
            - headers: {environment: {exact: prod}}
              uri: {exact: /health}
            - headers: {environment: {exact: prod}}
              uri: {prefix: /api}
        documentSelector: {path: metadata.name, value: test-stack-api}

  - it: uses the preprod header regex in each match and keeps the canary weights on a Rollout
    set:
      global:
        appStack: test-stack
        language: csharp
      environment:
        name: preprod
      applications:
        api:
          deploymentType: rollout
          image: {registry: registry.example.com, repository: api, tag: "1.0.0"}
          ports: {http: 8080}
          networking:
            istio:
              allowedEndpoints: ["/hooks/*"]
    asserts:
      - equal:
          path: spec.http[0].match[3]
          value:
            headers: {environment: {regex: "^(preprod|uat|qa)$"}}
            uri: {prefix: /hooks/}
        documentSelector: {path: metadata.name, value: test-stack-api}
      - lengthEqual:
          path: spec.http[0].route
          count: 2
        documentSelector: {path: metadata.name, value: test-stack-api}

  - it: keeps the header-only match when enforceAllowlistOnEnvironmentHeader is false
    set:
      global:
        appStack: test-stack
        language: csharp
      environment:
        name: prod
      applications:
        api:
          image: {registry: registry.example.com, repository: api, tag: "1.0.0"}
          ports: {http: 8080}
          networking:
            istio:
              enforceAllowlistOnEnvironmentHeader: false
    asserts:
      - equal:
          path: spec.http[0].match
          value:
            - headers: {environment: {exact: prod}}
        documentSelector: {path: metadata.name, value: test-stack-api}

  - it: keeps the header-only match when no allowlist applies
    set:
      global:
        appStack: test-stack
        language: nodejs
      environment:
        name: prod
      applications:
        web:
          image: {registry: registry.example.com, repository: web, tag: "1.0.0"}
          ports: {http: 3000}
    asserts:
      - equal:
          path: spec.http[0].match
          value:
            - headers: {environment: {exact: prod}}
        documentSelector: {path: metadata.name, value: test-stack-web}
