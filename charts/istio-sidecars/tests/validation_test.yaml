  - it: "[N-6] strict reserved name monitoring fails naming it"
    set: {"strict": true, "featureNamespaces": [{"name": "monitoring"}]}
    asserts:
      - failedTemplate:
          errorPattern: "monitoring"
        template: templates/sidecar-feature.yaml

  - it: "[N-7] strict sidecar string false fails"
    set: {"strict": true, "featureNamespaces": [{"name": "feature12", "sidecar": "false"}]}
    asserts:
      - failedTemplate:
          errorPattern: "feature12"
        template: templates/sidecar-feature.yaml

  - it: "[N-7] strict sidecar 0 (number) fails"
    set: {"strict": true, "featureNamespaces": [{"name": "feature13", "sidecar": 0}]}
    asserts:
      - failedTemplate:
          errorPattern: "feature13"
        template: templates/sidecar-feature.yaml

  - it: "[N-7] lenient non-boolean flags: no Sidecar for them, host kept, feature14 rendered"
    values:
      - fixtures/bad_flags.yaml
    asserts:
      - hasDocuments:
          count: 1
        template: templates/sidecar-feature.yaml
      - equal:
          path: metadata.namespace
          value: "feature14"
        template: templates/sidecar-feature.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: "default"
        template: templates/sidecar-feature.yaml
        documentIndex: 0
      - hasDocuments:
          count: 1
        template: templates/sidecar-dev.yaml
      - equal:
          path: spec.egress[0].hosts
          value: ["./*", "monitoring/*", "istio-system/*", "default/*", "kube-system/*", "feature12/*", "feature13/*", "feature14/*"]
        template: templates/sidecar-dev.yaml
        documentIndex: 0

  - it: "[N-8] strict extraHosts '' fails"
    set: {"strict": true, "featureNamespaces": [{"name": "feature15", "extraHosts": [""]}]}
    asserts:
      - failedTemplate:
          errorPattern: "feature15"
        template: templates/sidecar-feature.yaml

  - it: "[N-8] strict extraHosts '*/*' fails"
