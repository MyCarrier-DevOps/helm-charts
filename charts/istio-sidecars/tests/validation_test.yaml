    asserts:
      - failedTemplate:
          errorPattern: "feature15"
        template: templates/sidecar-feature.yaml

  - it: "[N-8] lenient invalid extraHosts dropped: feature15 keeps the six feature hosts"
    values:
      - fixtures/bad_extrahosts.yaml
    asserts:
      - hasDocuments:
          count: 2
        template: templates/sidecar-feature.yaml
      - equal:
          path: metadata.namespace
          value: "feature15"
        template: templates/sidecar-feature.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: "default"
        template: templates/sidecar-feature.yaml
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: "feature16"
        template: templates/sidecar-feature.yaml
        documentIndex: 1
      - equal:
          path: metadata.name
          value: "default"
        template: templates/sidecar-feature.yaml
        documentIndex: 1
      - hasDocuments:
          count: 1
        template: templates/sidecar-dev.yaml
      - equal:
          path: spec.egress[0].hosts
          value: ["./*", "monitoring/*", "istio-system/*", "default/*", "kube-system/*", "feature15/*", "feature16/*"]
        template: templates/sidecar-dev.yaml
        documentIndex: 0

  - it: "[N-8] lenient dropped extraHosts leave exact feature hosts"
