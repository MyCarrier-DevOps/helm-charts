    asserts:
      - failedTemplate:
          errorPattern: "feature15"
        template: templates/sidecar-feature.yaml

  - it: "[N-8] strict extraHosts 'feature*/*' fails"
    set: {"strict": true, "featureNamespaces": [{"name": "feature15", "extraHosts": ["feature*/*"]}]}
