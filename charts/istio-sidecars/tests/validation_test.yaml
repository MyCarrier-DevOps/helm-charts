    asserts:
      - failedTemplate:
          errorPattern: "istio\\-system"
        template: templates/sidecar-feature.yaml

  - it: "[N-6] strict reserved name kube-system fails naming it"
    set: {"strict": true, "featureNamespaces": [{"name": "kube-system"}]}
    asserts:
      - failedTemplate:
          errorPattern: "kube\\-system"
        template: templates/sidecar-feature.yaml

  - it: "[N-6] strict reserved name default fails naming it"
    set: {"strict": true, "featureNamespaces": [{"name": "default"}]}
