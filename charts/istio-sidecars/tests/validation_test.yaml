suite: validation strict and lenient
templates:
  - templates/sidecar-feature.yaml
  - templates/sidecar-dev.yaml
tests:
  - it: "[N-4] strict duplicate feature05 fails naming it"
    values:
      - fixtures/dup_feature05.yaml
    set: {"strict": true}
    asserts:
      - failedTemplate:
          errorPattern: "feature05"
        template: templates/sidecar-feature.yaml

  - it: "[N-5] strict bad name Feature05 fails naming it"
    set: {"strict": true, "featureNamespaces": [{"name": "Feature05"}]}
    asserts:
      - failedTemplate:
          errorPattern: "Feature05"
        template: templates/sidecar-feature.yaml

  - it: "[N-5] strict bad name feature5 fails naming it"
    set: {"strict": true, "featureNamespaces": [{"name": "feature5"}]}
    asserts:
      - failedTemplate:
          errorPattern: "feature5"
        template: templates/sidecar-feature.yaml

  - it: "[N-5] strict bad name feature05_x fails naming it"
    set: {"strict": true, "featureNamespaces": [{"name": "feature05_x"}]}
    asserts:
      - failedTemplate:
          errorPattern: "feature05_x"
        template: templates/sidecar-feature.yaml

  - it: "[N-5] strict bad name featureAB fails naming it"
    set: {"strict": true, "featureNamespaces": [{"name": "featureAB"}]}
    asserts:
      - failedTemplate:
          errorPattern: "featureAB"
        template: templates/sidecar-feature.yaml

  - it: "[N-5] strict bad name staging fails naming it"
    set: {"strict": true, "featureNamespaces": [{"name": "staging"}]}
    asserts:
      - failedTemplate:
          errorPattern: "staging"
        template: templates/sidecar-feature.yaml

  - it: "[N-6] strict reserved name dev fails naming it"
    set: {"strict": true, "featureNamespaces": [{"name": "dev"}]}
    asserts:
      - failedTemplate:
          errorPattern: "dev"
        template: templates/sidecar-feature.yaml

  - it: "[N-6] strict reserved name preprod fails naming it"
    set: {"strict": true, "featureNamespaces": [{"name": "preprod"}]}
    asserts:
      - failedTemplate:
          errorPattern: "preprod"
        template: templates/sidecar-feature.yaml

  - it: "[N-6] strict reserved name uat fails naming it"
    set: {"strict": true, "featureNamespaces": [{"name": "uat"}]}
    asserts:
