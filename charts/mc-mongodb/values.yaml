# Default values for mc-mongodb.

## @section Rendering

## @param standalone Render from this chart's own templates. mycarrier-helm sets false and renders the named templates itself.
standalone: true
## @param debugContext Render a ConfigMap holding the computed render context (used by the chart's tests only)
debugContext: false
## @param nameOverride Override the chart name used in resource names
nameOverride: ""
## @param fullnameOverride Override the full resource name
fullnameOverride: ""

## @section MongoDB

## @param members Number of replica set members
members: 1
## @param version MongoDB server version (exact)
version: "8.0.34"
## @param featureCompatibilityVersion Pinned feature compatibility version, so upgrades are deliberate
featureCompatibilityVersion: "8.0"

## @param storage.size Data volume size per member
## @param storage.storageClassName Storage class for the data volume (empty uses the cluster default)
storage:
  size: 10Gi
  storageClassName: ""

## @param resources [object] Resources for the mongod container
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

## @param appUser.name Application user name
## @param appUser.database Primary database: the path of the generated connection string (defaults to the full name). The user can still reach any database.
appUser:
  name: app
  database: ""

## @param password.length Length of each generated password
password:
  length: 32

## @section Backups

## @param backup.enabled Render the backup and restore CronJobs and their blob storage volume
## @param backup.schedule Cron schedule for backups
## @param backup.timeZone Time zone for the backup schedule
## @param backup.retentionDays Backups older than this many days are deleted after each successful backup
## @param backup.container Blob container to write to, one per cluster (e.g. production). Required when backups are enabled.
## @param backup.path Folder inside the container (defaults to <namespace>/<full name>)
## @param backup.storageAccount Storage account holding the backup containers
## @param backup.resourceGroup Resource group of the storage account
## @param backup.subscriptionId Subscription of the storage account
## @param backup.image Image providing mongodump and mongorestore
## @param backup.resources [object] Resources for the backup and restore containers
backup:
  enabled: false
  schedule: "0 2 * * *"
  timeZone: "Etc/UTC"
  retentionDays: 7
  container: ""
  path: ""
  storageAccount: mycarriermongobackups
  resourceGroup: rg_management_controlplane
  subscriptionId: 99b54c45-a73d-4d40-915e-c0392b589e8c
  image: mongo:8.0.34
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
