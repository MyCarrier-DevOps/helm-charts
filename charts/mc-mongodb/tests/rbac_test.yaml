suite: database pod ServiceAccount and Role
templates:
  - templates/rbac.yaml
release:
  name: mydb
  namespace: tools
tests:
  - it: renders a ServiceAccount, a Role and a RoleBinding in the release namespace
    asserts:
      - hasDocuments: {count: 3}
      - isKind: {of: ServiceAccount}
        documentIndex: 0
      - isKind: {of: Role}
        documentIndex: 1
      - isKind: {of: RoleBinding}
        documentIndex: 2
      - equal: {path: metadata.name, value: mydb-mc-mongodb-database}
      - equal: {path: metadata.namespace, value: tools}

  - it: lets the MongoDB agent read Secrets and get, patch and delete its pods (the operator's database role)
    documentIndex: 1
    asserts:
      - equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [secrets], verbs: [get]}
            - {apiGroups: [""], resources: [pods], verbs: [patch, delete, get]}

  - it: binds the Role to the ServiceAccount
    documentIndex: 2
    asserts:
      - equal: {path: roleRef, value: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: mydb-mc-mongodb-database}}
      - equal: {path: subjects, value: [{kind: ServiceAccount, name: mydb-mc-mongodb-database, namespace: tools}]}

  - it: renders nothing when embedded (standalone false)
    set:
      standalone: false
    asserts:
      - hasDocuments: {count: 0}
