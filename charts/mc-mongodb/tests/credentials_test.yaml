suite: generated credentials
templates:
  - templates/credentials.yaml
release:
  name: mydb
  namespace: tools
tests:
  - it: renders a password generator and two ExternalSecrets
    asserts:
      - hasDocuments: {count: 3}
      - isKind: {of: Password}
        documentIndex: 0
      - equal: {path: apiVersion, value: generators.external-secrets.io/v1alpha1}
        documentIndex: 0
      - equal: {path: metadata.name, value: mydb-mc-mongodb-password}
        documentIndex: 0
      - equal: {path: spec.symbols, value: 0}
        documentIndex: 0
      - equal: {path: spec.length, value: 32}
        documentIndex: 0
      - isKind: {of: ExternalSecret}
        documentIndex: 1
      - isKind: {of: ExternalSecret}
        documentIndex: 2

  - it: generates the app password once and builds its connection string
    documentIndex: 1
    asserts:
      - equal: {path: apiVersion, value: external-secrets.io/v1}
      - equal: {path: metadata.name, value: mydb-mc-mongodb-app}
      - equal: {path: spec.refreshPolicy, value: CreatedOnce}
      - equal: {path: spec.target.name, value: mydb-mc-mongodb-connection}
      - equal: {path: spec.target.creationPolicy, value: Owner}
      - equal: {path: spec.target.deletionPolicy, value: Retain}
      - equal: {path: "spec.dataFrom[0].sourceRef.generatorRef.kind", value: Password}
      - equal: {path: "spec.dataFrom[0].sourceRef.generatorRef.name", value: mydb-mc-mongodb-password}
      - equal:
          path: spec.target.template.data.password
          value: '{{ .password }}'
      - equal:
          path: spec.target.template.data.connectionString
          value: 'mongodb://app:{{ .password }}@mydb-mc-mongodb-svc.tools.svc.cluster.local:27017/mydb-mc-mongodb?replicaSet=mydb-mc-mongodb&authSource=admin'

  - it: builds the backup user's connection string without a database
    documentIndex: 2
    asserts:
      - equal: {path: metadata.name, value: mydb-mc-mongodb-backup}
      - equal: {path: spec.target.name, value: mydb-mc-mongodb-backup-connection}
      - equal: {path: spec.refreshPolicy, value: CreatedOnce}
      - equal: {path: spec.target.deletionPolicy, value: Retain}
      - equal:
          path: spec.target.template.data.connectionString
          value: 'mongodb://backup:{{ .password }}@mydb-mc-mongodb-svc.tools.svc.cluster.local:27017/?replicaSet=mydb-mc-mongodb&authSource=admin'

  - it: uses the configured database and user in the app connection string
    documentIndex: 1
    set:
      appUser.name: inventory
      appUser.database: primary
    asserts:
      - matchRegex:
          path: spec.target.template.data.connectionString
          pattern: "^mongodb://inventory:\\{\\{ \\.password \\}\\}@.*:27017/primary\\?"

  - it: honours password.length
    documentIndex: 0
    set:
      password.length: 48
    asserts:
      - equal: {path: spec.length, value: 48}

  - it: never carries Argo CD sync options that would recreate the secrets
    asserts:
      - notExists: {path: "metadata.annotations[\"argocd.argoproj.io/sync-options\"]"}
        documentIndex: 1
      - notExists: {path: "metadata.annotations[\"argocd.argoproj.io/sync-options\"]"}
        documentIndex: 2
