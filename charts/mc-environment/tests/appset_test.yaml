# Validates ApplicationSet rendering for mc-environment wrapper
suite: application set
templates:
  - templates/appset.yaml
tests:
  - it: renders one application set per environment
    values:
      - fixtures/basic-environments.yaml
    asserts:
      - hasDocuments:
          count: 2
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: carriers-dev
          namespace: argocd
          any: true
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: carriers-prod
          namespace: argocd
          any: true
  - it: forwards dev environment configuration into list elements
    values:
      - fixtures/basic-environments.yaml
    documentSelector:
      path: metadata.name
      value: carriers-dev
    asserts:
      - equal:
          path: spec.goTemplateOptions[0]
          value: missingkey=error
      - lengthEqual:
          path: spec.generators[0].list.elements
          count: 1
      - equal:
          path: spec.generators[0].list.elements[0].Values.environment.name
          value: dev
      - equal:
          path: spec.generators[0].list.elements[0].Values.deployment
          value: rollout
      - equal:
          path: spec.generators[0].list.elements[0].Values.global.dependencies.redis
          value: true
      - equal:
          path: spec.generators[0].list.elements[0].Values.global.env.LOG_LEVEL
          value: info
      - equal:
          path: spec.generators[0].list.elements[0].Values.global.correlationId
          value: test-corr-id-123
      - equal:
          path: spec.generators[0].list.elements[0].Values.global.commitDeployed
          value: abc1234
      - equal:
          path: spec.generators[0].list.elements[0].Values.infrastructure.azure.storage.accounts[0].newStorageAccount.name
          value: shipmentsdata
      - equal:
          path: spec.generators[0].list.elements[0].Values.infrastructure.azure.storage.accounts[0].containers[0].metadata.retention
          value: "30days"
      - equal:
          path: spec.generators[0].list.elements[0].Values.enableVaultCA
          value: true
  - it: applies defaults for omitted environment settings
    values:
      - fixtures/basic-environments.yaml
    documentSelector:
      path: metadata.name
      value: carriers-prod
    asserts:
      - lengthEqual:
          path: spec.generators[0].list.elements
          count: 1
      - equal:
          path: spec.generators[0].list.elements[0].Values.environment.name
          value: prod
      - equal:
          path: spec.generators[0].list.elements[0].Values.enableVaultCA
          value: false
      - equal:
          path: spec.generators[0].list.elements[0].Values.disableOtelAutoinstrumentation
          value: false
      - equal:
          path: spec.generators[0].list.elements[0].Values.deployment
          value: deployment
      - equal:
          path: spec.generators[0].list.elements[0].Values.tolerations
          value: []
  - it: forwards empty correlationId and commitDeployed when not set
    set:
      global.appStack: carriers
      global.correlationId: ""
      global.commitDeployed: ""
      environments:
        - name: dev
    documentSelector:
      path: metadata.name
      value: carriers-dev
    asserts:
      - equal:
          path: spec.generators[0].list.elements[0].Values.global.correlationId
          value: ""
      - equal:
          path: spec.generators[0].list.elements[0].Values.global.commitDeployed
          value: ""
  - it: configures template with chart source and sync policies
    values:
      - fixtures/basic-environments.yaml
    documentSelector:
      path: metadata.name
      value: carriers-dev
    asserts:
      - equal:
          path: spec.template.metadata.name
          value: "carriers-{{ .Values.environment.name }}"
      - equal:
          path: spec.template.spec.destination.namespace
          value: "{{ .Values.environment.name }}"
      - equal:
          path: spec.template.spec.source.chart
          value: mycarrier-helm
      - equal:
          path: spec.template.spec.source.targetRevision
          value: "2.5.100"
      - contains:
          path: spec.template.spec.syncPolicy.syncOptions
          content: ApplyOutOfSyncOnly=true
      - contains:
          path: spec.template.spec.syncPolicy.syncOptions
          content: CreateNamespace=true
      - contains:
          path: spec.template.spec.syncPolicy.syncOptions
          content: ServerSideApply=true
      - notContains:
          path: spec.template.spec.syncPolicy.syncOptions
          content: RespectIgnoreDifferences=true
      - notContains:
          path: spec.template.spec.syncPolicy.syncOptions
          content: Replace=true
      - equal:
          path: spec.template.spec.syncPolicy.automated
          value: { prune: true, selfHeal: true }
  - it: ignores Rollout-controller-managed Service and VirtualService fields
    values:
      - fixtures/basic-environments.yaml
    documentSelector:
      path: metadata.name
      value: carriers-dev
    asserts:
      - equal:
          path: spec.template.spec.ignoreDifferences
          value:
            - group: ""
              kind: Service
              managedFieldsManagers:
                - rollouts-controller
              jsonPointers:
                - /metadata/labels/mycarrier.tech~1correlationId
                - /metadata/labels/mycarrier.tech~1commitDeployed
                - /metadata/labels/mycarrier.tech~1reference
            - group: networking.istio.io
              kind: VirtualService
              jqPathExpressions:
                # Weights on every multi-destination route with a -preview destination (Rollout-managed: canary and allowed-* routes).
                # Host forms: FQDN <app>-preview.<ns>.svc.cluster.local and multi-frontend short <app>-preview (hence the end-of-string alternative).
                - '.spec.http[] | select(((.route // []) | length) > 1 and any(.route[]; (.destination.host // "") | test("-preview(\\.|$)"))) | .route[].weight'
                - '.spec.http[] | select(.name == "canary-header")'
  - it: forwards the environment block (dependencyenv, namespaceOverride, domainOverride)
    values:
      - fixtures/environment-overrides.yaml
    documentSelector:
      path: metadata.name
      value: carriers-dev
    asserts:
      - equal:
          path: spec.generators[0].list.elements[0].Values.environment.name
          value: dev
      - equal:
          path: spec.generators[0].list.elements[0].Values.environment.dependencyenv
          value: dev
      - equal:
          path: spec.generators[0].list.elements[0].Values.environment.namespaceOverride
          value: platform-dev
      - equal:
          path: spec.generators[0].list.elements[0].Values.environment.domainOverride.enabled
          value: true
      - equal:
          path: spec.generators[0].list.elements[0].Values.environment.domainOverride.domain
          value: example.dev
      - equal:
          path: spec.generators[0].list.elements[0].Values.applications.shipments-api.staticHostname
          value: api
  - it: merges per-environment global overrides over the base global
    set:
      global.appStack: Carriers
      global.gitbranch: main
      global.dependencies.redis: false
      environments:
        - name: dev
          global:
            gitbranch: dev
            dependencies:
              redis: true
    documentSelector:
      path: metadata.name
      value: carriers-dev
    asserts:
      - equal:
          path: spec.generators[0].list.elements[0].Values.global.gitbranch
          value: dev
      - equal:
          path: spec.generators[0].list.elements[0].Values.global.dependencies.redis
          value: true
      - equal:
          path: spec.generators[0].list.elements[0].Values.global.appStack
          value: carriers
  - it: accepts storage-account fields that mycarrier-helm permits
    set:
      global.appStack: carriers
      environments:
        - name: dev
          infrastructure:
            azure:
              storage:
                accounts:
                  - name: shipmentsdata
                    sku: Standard_LRS
                    newStorageAccount:
                      name: shipmentsdata
    documentSelector:
      path: metadata.name
      value: carriers-dev
    asserts:
      - equal:
          path: spec.generators[0].list.elements[0].Values.infrastructure.azure.storage.accounts[0].sku
          value: Standard_LRS

  # mycarrier-helm gained manualOtelConfig; the wrapper builds the subchart values from an explicit
  # allowlist, so without a passthrough here the key is unreachable for every environment deploy.
  - it: forwards manualOtelConfig to the subchart values when an environment opts out
    values:
      - fixtures/basic-environments.yaml
    set:
      environments:
        - name: dev
          manualOtelConfig: true
    documentSelector:
      path: metadata.name
      value: carriers-dev
    asserts:
      - equal:
          path: spec.generators[0].list.elements[0].Values.manualOtelConfig
          value: true

  - it: defaults manualOtelConfig to chart-managed when an environment omits it
    values:
      - fixtures/basic-environments.yaml
    documentSelector:
      path: metadata.name
      value: carriers-dev
    asserts:
      - equal:
          path: spec.generators[0].list.elements[0].Values.manualOtelConfig
          value: false

  # mycarrier-helm gained cronjobs; the wrapper builds the subchart values from an explicit
  # allowlist, so without a passthrough here the key is unreachable for every environment deploy.
  - it: forwards cronjobs to the subchart values when an environment defines them
    values:
      - fixtures/basic-environments.yaml
    documentSelector:
      path: metadata.name
      value: carriers-dev
    asserts:
      - equal:
          path: spec.generators[0].list.elements[0].Values.cronjobs[0].name
          value: shipments-db-cleanup
      - equal:
          path: spec.generators[0].list.elements[0].Values.cronjobs[0].schedule
          value: "0 3 * * *"

  - it: omits cronjobs from the subchart values when an environment doesn't define them
    values:
      - fixtures/basic-environments.yaml
    documentSelector:
      path: metadata.name
      value: carriers-prod
    asserts:
      - notExists:
          path: spec.generators[0].list.elements[0].Values.cronjobs
  - it: emits no Rollout replicas ignore even for HPA/KEDA-scaled rollouts (mycarrier-helm omits spec.replicas)
    values:
      - fixtures/rollout-hpa.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.ignoreDifferences
          count: 2
  - it: renders valid ignoreDifferences when an environment has no applications
    set:
      global.appStack: carriers
      environments:
        - name: dev
    asserts:
      - lengthEqual:
          path: spec.template.spec.ignoreDifferences
          count: 2
  - it: renders the CSA migration annotation for an environment without jobs
    set:
      global.appStack: carriers
      environments:
        - name: dev
    documentSelector:
      path: metadata.name
      value: carriers-dev
    asserts:
      - equal:
          path: spec.template.metadata.annotations["argocd.argoproj.io/client-side-apply-migration-manager"]
          value: argocd-application-controller
  - it: omits the CSA migration annotation for an environment with jobs
    values:
      - fixtures/basic-environments.yaml
    documentSelector:
      path: metadata.name
      value: carriers-dev
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["argocd.argoproj.io/client-side-apply-migration-manager"]
      - equal:
          path: spec.template.metadata.annotations["notifications.argoproj.io/subscribe.on-deployed.deploy-reporter"]
          value: ""
  - it: renders the CSA migration annotation when jobs is an empty list
    set:
      global.appStack: carriers
      environments:
        - name: dev
          jobs: []
    documentSelector:
      path: metadata.name
      value: carriers-dev
    asserts:
      - equal:
          path: spec.template.metadata.annotations["argocd.argoproj.io/client-side-apply-migration-manager"]
          value: argocd-application-controller
  - it: omits the CSA migration annotation when extraObjects is set
    set:
      global.appStack: carriers
      environments:
        - name: dev
          extraObjects:
            - apiVersion: v1
              kind: ConfigMap
              metadata:
                name: x
    documentSelector:
      path: metadata.name
      value: carriers-dev
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["argocd.argoproj.io/client-side-apply-migration-manager"]
  - it: renders the Service label jsonPointers with RFC 6901 escaping
    set:
      global.appStack: carriers
      environments:
        - name: dev
    documentSelector:
      path: metadata.name
      value: carriers-dev
    asserts:
      - equal:
          path: spec.template.spec.ignoreDifferences[0].jsonPointers[0]
          value: /metadata/labels/mycarrier.tech~1correlationId
      - equal:
          path: spec.template.spec.ignoreDifferences[0].jsonPointers[1]
          value: /metadata/labels/mycarrier.tech~1commitDeployed
      - equal:
          path: spec.template.spec.ignoreDifferences[0].jsonPointers[2]
          value: /metadata/labels/mycarrier.tech~1reference
