{{- /*
  Generates one ApplicationSet per defined environment, separated by YAML document markers.
  Each ApplicationSet contains a single list generator element for its environment.
*/ -}}
{{- range $env := .Values.environments }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $.Values.global.appStack | lower }}-{{ $env.name }}
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
      - list:
          elements:
            - Values:
                isEnvironmentDeploy: true
                global:
                  {{- $g := mustMergeOverwrite (deepCopy $.Values.global) ($env.global | default dict) }}
                  {{- $_ := set $g "appStack" (lower ($g.appStack | default "")) }}
                  {{- $g | toYaml | nindent 18 }}
                environment:
                  {{- $envBlock := deepCopy ($env.environment | default dict) }}
                  {{- $_ := set $envBlock "name" $env.name }}
                  {{- $envBlock | toYaml | nindent 18 }}
                {{- /* disableSecurity is intentionally NOT forwarded here — it stays direct-mycarrier-helm-values-only (break-glass, blast-radius limited by design). Do not add a disableSecurity line to this list. */}}
                enableVaultCA: {{ $env.enableVaultCA | default false }}
                manualOtelConfig: {{ $env.manualOtelConfig | default false }}
                disableOtelAutoinstrumentation: {{ $env.disableOtelAutoinstrumentation | default false }}
                tolerations: {{ $env.tolerations | default "[]" }}
                deployment: {{ $env.deployment | default "deployment" }}
                {{ with $env.applications }}applications:
                  {{- toYaml . | nindent 18 }}
                  {{- end }}
                {{ with $env.jobs }}jobs:
                  {{- toYaml . | nindent 18 }}
                  {{- end }}
                {{ with $env.cronjobs }}cronjobs:
                  {{- toYaml . | nindent 18 }}
                  {{- end }}
                {{ with $env.secrets }}secrets:
                  {{- toYaml . | nindent 18 }}
                  {{- end }}
                {{ with $env.infrastructure }}infrastructure:
                  {{- toYaml . | nindent 18 }}
                  {{- end }}
                {{ with $.Values.alerts }}alerts:
                  {{- toYaml . | nindent 18 }}
                  {{- end }}
                {{ with $env.extraObjects }}extraObjects:
                  {{- toYaml . | nindent 18 }}
                  {{- end }}
  template:
    metadata:
      name: "{{ $.Values.global.appStack | lower }}-{{`{{`}} .Values.environment.name {{`}}`}}"
      annotations:
        notifications.argoproj.io/subscribe.on-deployed.deploy-reporter: ""
        {{- if not (or $env.jobs $env.extraObjects) }}
        {{- /* CSA->SSA managedFields migration of the legacy Replace-era manager. Skipped when the env
             renders Jobs or extraObjects (which can carry Jobs): mycarrier-helm Jobs keep Force=true,Replace=true, get the legacy manager back on
             every replace, and the migration's client-side apply of an immutable Job template fails the sync. */}}
        argocd.argoproj.io/client-side-apply-migration-manager: argocd-application-controller
        {{- end }}
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{`{{`}} .Values.environment.name {{`}}`}}"
      source:
        repoURL: https://charts.mycarrier.dev
        chart: mycarrier-helm
        targetRevision: "{{ $.Values.mycarrierChartVersion | default "3.4.0" }}"
        helm:
          values: |2+
            {{`{{`}} .Values | toYaml {{`}}`}}
      ignoreDifferences:
        - group: ""
          kind: Service
          managedFieldsManagers:
            - rollouts-controller
          # Per-deploy labels (mycarrier-helm _labels.tpl). Ignoring them keeps Services Synced on a deploy, so
          # ApplyOutOfSyncOnly skips them and SSA (force-conflicts) never takes the atomic spec.selector
          # away from rollouts-controller (which would drop rollouts-pod-template-hash).
          jsonPointers:
            - /metadata/labels/mycarrier.tech~1correlationId
            - /metadata/labels/mycarrier.tech~1commitDeployed
            - /metadata/labels/mycarrier.tech~1reference
        - group: networking.istio.io
          kind: VirtualService
          jqPathExpressions:
            # Weights on every multi-destination route with a -preview destination (Rollout-managed: canary and allowed-* routes).
            # Host forms: FQDN <app>-preview.<ns>.svc.cluster.local and multi-frontend short <app>-preview (hence the end-of-string alternative).
            - '.spec.http[] | select(((.route // []) | length) > 1 and any(.route[]; (.destination.host // "") | test("-preview(\\.|$)"))) | .route[].weight'
            - '.spec.http[] | select(.name == "canary-header")'
        # mycarrier-helm syncs the autoscalers in wave 11, after the Rollout (wave 10). Their per-deploy labels would keep
        # them in every sync, so wave 11 would wait for the paused Rollout to be Healthy and the app would stay OutOfSync
        # for the whole canary. Labels only, no spec field is ignored. `version` and `mycarrier/service-version`
        # (helm.labels.version) follow the image tag; Services carry only helm.labels.standard, so they do not need them.
        - group: autoscaling
          kind: HorizontalPodAutoscaler
          jsonPointers:
            - /metadata/labels/mycarrier.tech~1correlationId
            - /metadata/labels/mycarrier.tech~1commitDeployed
            - /metadata/labels/mycarrier.tech~1reference
            - /metadata/labels/version
            - /metadata/labels/mycarrier~1service-version
        - group: keda.sh
          kind: ScaledObject
          jsonPointers:
            - /metadata/labels/mycarrier.tech~1correlationId
            - /metadata/labels/mycarrier.tech~1commitDeployed
            - /metadata/labels/mycarrier.tech~1reference
            - /metadata/labels/version
            - /metadata/labels/mycarrier~1service-version
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - Validate=true
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=false
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true

        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 10m
{{- end }}
